" x2=\"122\" y2=\"64\" class=\"ln\"/><polygon points=\"122,64 116.59731738588394,66.60979320466738 116.59731738588394,61.39020679533262\" class=\"ah\"/><text x=\"160\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>max</text><rect x=\"130\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"141.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">6</text><rect x=\"152\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"163.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">8</text><rect x=\"130\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"141.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><rect x=\"152\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"163.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4</text><text x=\"260\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>average</text><rect x=\"225\" y=\"42\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxa\"/><text x=\"240.0\" y=\"60.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3.25</text><rect x=\"255\" y=\"42\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxg\"/><text x=\"270.0\" y=\"60.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">5.25</text><rect x=\"225\" y=\"72\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxr\"/><text x=\"240.0\" y=\"90.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"255\" y=\"72\" width=\"30\" height=\"30\" rx=\"1\" class=\"box\"/><text x=\"270.0\" y=\"90.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><text x=\"160\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">2x2, stride 2: 4x4 -&gt; 2x2.  0 learnable parameters</text></svg>", "h": "Pooling just picks the max (or mean) of each block. Nothing to learn."}, {"id": "Q25", "t": "Training", "q": "Why is it not a good idea to use sigmoid or tanh as activation functions in general?", "a": "Both saturate: at large |x| the gradient is ~0, which kills gradients during backprop. Sigmoid also has outputs that are not zero-centered (gradients on w all same sign, zig-zag updates) and exp() is a bit expensive.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 110\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>sigmoid</text><line x1=\"10\" y1=\"90\" x2=\"150\" y2=\"90\" class=\"ln\"/><path d=\"M10,86 C60,86 60,24 80,24 S100,24 150,24\" class=\"lna\"/><path d=\"M10,86 C60,86 70,24 150,24\" class=\"none\"/><rect x=\"10\" y=\"18\" width=\"35\" height=\"74\" rx=\"2\" class=\"boxr\"/><rect x=\"115\" y=\"18\" width=\"35\" height=\"74\" rx=\"2\" class=\"boxr\"/><text x=\"80\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">flat ends: grad ~ 0</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>ReLU</text><line x1=\"170\" y1=\"90\" x2=\"310\" y2=\"90\" class=\"ln\"/><polyline points=\"170,80 240,80 310,20\" class=\"lng\"/><text x=\"205\" y=\"72\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">x&lt;0: output 0</text><text x=\"240\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">dead if always below 0</text><text x=\"280\" y=\"72\" text-anchor=\"middle\" font-size=\"8\" class=\"good\">slope 1</text></svg>", "h": "Sigmoid goes flat at both ends and kills gradients. ReLU is a ramp: slope 1 for positives."}, {"id": "Q26", "t": "Training", "q": "How do you know from the loss curves if a model is overfitting or underfitting?", "a": "Overfitting: training loss keeps falling but validation loss stops improving or rises; the gap widens.\nUnderfitting: both losses stay high and close together.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 138\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Overfitting</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Underfitting</text><line x1=\"15\" y1=\"90\" x2=\"150\" y2=\"90\" class=\"ln\"/><line x1=\"15\" y1=\"90\" x2=\"15\" y2=\"20\" class=\"ln\"/><line x1=\"175\" y1=\"90\" x2=\"310\" y2=\"90\" class=\"ln\"/><line x1=\"175\" y1=\"90\" x2=\"175\" y2=\"20\" class=\"ln\"/><path d=\"M15,85 Q50,30 145,25\" class=\"lng\"/><path d=\"M15,85 Q50,50 145,60\" class=\"lnr\"/><text x=\"110\" y=\"34\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">train</text><text x=\"130\" y=\"72\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">val</text><line x1=\"140\" y1=\"28\" x2=\"140\" y2=\"58\" class=\"lnd\"/><text x=\"110\" y=\"45\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">big gap</text><path d=\"M175,85 Q210,65 305,62\" class=\"lng\"/><path d=\"M175,86 Q210,70 305,66\" class=\"lnr\"/><text x=\"290\" y=\"55\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">both low</text><text x=\"80\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fix: regularize,</text><text x=\"80\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">more data</text><text x=\"240\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fix: bigger model,</text><text x=\"240\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">train longer</text><text x=\"80\" y=\"132\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">(accuracy curves)</text><text x=\"240\" y=\"132\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">(no gap, both bad)</text></svg>", "h": "Gap = overfit. No gap but bad = underfit."}, {"id": "Q27", "t": "Architectures & BatchNorm", "q": "What does batch normalization do?", "a": "Normalizes a layer's outputs to zero mean and unit variance using the minibatch mean and std, then applies a learnable scale (gamma) and shift (beta). Makes deep nets easier to train, allows higher learning rates, acts as regularization. At test time it uses running averages from training instead of batch stats.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><circle cx=\"31.657523896432394\" cy=\"57.21146126479759\" r=\"3.5\" class=\"bad\"/><circle cx=\"40.89686165836555\" cy=\"60.196001929809725\" r=\"3.5\" class=\"bad\"/><circle cx=\"58.80042128756378\" cy=\"33.276442961990654\" r=\"3.5\" class=\"bad\"/><circle cx=\"15.92175940884119\" cy=\"71.873454104823\" r=\"3.5\" class=\"bad\"/><circle cx=\"33.15478100296053\" cy=\"41.716548052334815\" r=\"3.5\" class=\"bad\"/><circle cx=\"84.6951384857324\" cy=\"53.5131753761224\" r=\"3.5\" class=\"bad\"/><circle cx=\"73.55230158920722\" cy=\"53.81766043496675\" r=\"3.5\" class=\"bad\"/><circle cx=\"59.73476983809134\" cy=\"37.530821201176195\" r=\"3.5\" class=\"bad\"/><circle cx=\"59.44024607996319\" cy=\"73.40226535716484\" r=\"3.5\" class=\"bad\"/><circle cx=\"51.622684726831096\" cy=\"67.0625928100745\" r=\"3.5\" class=\"bad\"/><circle cx=\"61.99880327587148\" cy=\"33.201571911349866\" r=\"3.5\" class=\"bad\"/><circle cx=\"68.07611724007722\" cy=\"59.554979146565884\" r=\"3.5\" class=\"bad\"/><text x=\"50\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">raw activations</text><line x1=\"95\" y1=\"55\" x2=\"115\" y2=\"55\" class=\"ln\"/><polygon points=\"115,55 109.59731738588394,57.60979320466738 109.59731738588394,52.39020679533262\" class=\"ah\"/><text x=\"105\" y=\"46\" text-anchor=\"middle\" font-size=\"8\" class=\"\">-mu</text><text x=\"105\" y=\"70\" text-anchor=\"middle\" font-size=\"8\" class=\"\">/sigma</text><circle cx=\"130\" cy=\"45\" r=\"3.5\" class=\"acc\"/><circle cx=\"140\" cy=\"45\" r=\"3.5\" class=\"acc\"/><circle cx=\"150\" cy=\"45\" r=\"3.5\" class=\"acc\"/><circle cx=\"160\" cy=\"45\" r=\"3.5\" class=\"acc\"/><circle cx=\"170\" cy=\"45\" r=\"3.5\" class=\"acc\"/><circle cx=\"180\" cy=\"45\" r=\"3.5\" class=\"acc\"/><circle cx=\"130\" cy=\"57\" r=\"3.5\" class=\"acc\"/><circle cx=\"140\" cy=\"57\" r=\"3.5\" class=\"acc\"/><circle cx=\"150\" cy=\"57\" r=\"3.5\" class=\"acc\"/><circle cx=\"160\" cy=\"57\" r=\"3.5\" class=\"acc\"/><circle cx=\"170\" cy=\"57\" r=\"3.5\" class=\"acc\"/><circle cx=\"180\" cy=\"57\" r=\"3.5\" class=\"acc\"/><text x=\"155\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">mean 0, var 1</text><line x1=\"200\" y1=\"55\" x2=\"220\" y2=\"55\" class=\"ln\"/><polygon points=\"220,55 214.59731738588394,57.60979320466738 214.59731738588394,52.39020679533262\" class=\"ah\"/><rect x=\"222\" y=\"35\" width=\"92\" height=\"40\" rx=\"4\" class=\"boxg\"/><text x=\"268.0\" y=\"52.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x gamma + beta</text><text x=\"268.0\" y=\"63.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">(learned)</text><text x=\"160\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">train: batch stats   test: running averages</text></svg>", "h": "Normalize, then let the net rescale (gamma) and shift (beta). Test time uses saved averages."}, {"id": "Q28", "t": "Basics/KNN/Linear", "q": "Why use a validation set separate from the test set?", "a": "Hyperparameters are tuned on the validation set, so its score becomes slightly optimistic. The test set is used only once at the end, so it gives an unbiased estimate on new data.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 92\" role=\"img\"><rect x=\"10\" y=\"30\" width=\"180\" height=\"28\" rx=\"2\" class=\"boxa\"/><text x=\"100\" y=\"48\" text-anchor=\"middle\" font-size=\"11\" class=\"\">train: learn W</text><rect x=\"190\" y=\"30\" width=\"70\" height=\"28\" rx=\"2\" class=\"boxg\"/><text x=\"225\" y=\"48\" text-anchor=\"middle\" font-size=\"11\" class=\"\">val</text><rect x=\"260\" y=\"30\" width=\"50\" height=\"28\" rx=\"2\" class=\"boxr\"/><text x=\"285\" y=\"48\" text-anchor=\"middle\" font-size=\"11\" class=\"\">test</text><text x=\"225\" y=\"22\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">pick K / LR here</text><text x=\"285\" y=\"74\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">use ONCE</text><text x=\"285\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">at the end</text><text x=\"100\" y=\"74\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">homework</text><text x=\"225\" y=\"74\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">practice exam</text></svg>", "h": "Homework, practice exam, real exam. Never peek at the real exam."}, {"id": "Q29", "t": "Training", "q": "What does dropout do?", "a": "During training, randomly sets some neurons to zero each forward pass (drop prob 0.5 is common). This forces redundant representations and acts like training an ensemble, reducing overfitting. At test time nothing is dropped and activations are scaled by the keep probability so outputs match; inverted dropout instead divides by the keep probability during training so test time is unchanged.", "f": "fixed", "d": "<svg class=\"dg\" viewBox=\"0 0 320 134\" role=\"img\"><line x1=\"30\" y1=\"30\" x2=\"110\" y2=\"30\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"110\" y2=\"80\" class=\"lnf\"/><line x1=\"30\" y1=\"60\" x2=\"110\" y2=\"30\" class=\"lnf\"/><line x1=\"30\" y1=\"60\" x2=\"110\" y2=\"80\" class=\"lnf\"/><line x1=\"30\" y1=\"90\" x2=\"110\" y2=\"30\" class=\"lnf\"/><line x1=\"30\" y1=\"90\" x2=\"110\" y2=\"80\" class=\"lnf\"/><line x1=\"110\" y1=\"30\" x2=\"190\" y2=\"60\" class=\"lnf\"/><line x1=\"110\" y1=\"30\" x2=\"190\" y2=\"90\" class=\"lnf\"/><line x1=\"110\" y1=\"80\" x2=\"190\" y2=\"60\" class=\"lnf\"/><line x1=\"110\" y1=\"80\" x2=\"190\" y2=\"90\" class=\"lnf\"/><line x1=\"190\" y1=\"60\" x2=\"270\" y2=\"60\" class=\"lnf\"/><line x1=\"190\" y1=\"90\" x2=\"270\" y2=\"60\" class=\"lnf\"/><circle cx=\"30\" cy=\"30\" r=\"8\" class=\"boxa\"/><circle cx=\"30\" cy=\"60\" r=\"8\" class=\"boxa\"/><circle cx=\"30\" cy=\"90\" r=\"8\" class=\"boxa\"/><circle cx=\"110\" cy=\"30\" r=\"8\" class=\"boxa\"/><circle cx=\"110\" cy=\"55\" r=\"8\" class=\"boxr\"/><line x1=\"104\" y1=\"49\" x2=\"116\" y2=\"61\" class=\"lnr\"/><line x1=\"104\" y1=\"61\" x2=\"116\" y2=\"49\" class=\"lnr\"/><circle cx=\"110\" cy=\"80\" r=\"8\" class=\"boxa\"/><circle cx=\"110\" cy=\"105\" r=\"8\" class=\"boxr\"/><line x1=\"104\" y1=\"99\" x2=\"116\" y2=\"111\" class=\"lnr\"/><line x1=\"104\" y1=\"111\" x2=\"116\" y2=\"99\" class=\"lnr\"/><circle cx=\"190\" cy=\"30\" r=\"8\" class=\"boxr\"/><line x1=\"184\" y1=\"24\" x2=\"196\" y2=\"36\" class=\"lnr\"/><line x1=\"184\" y1=\"36\" x2=\"196\" y2=\"24\" class=\"lnr\"/><circle cx=\"190\" cy=\"60\" r=\"8\" class=\"boxa\"/><circle cx=\"190\" cy=\"90\" r=\"8\" class=\"boxa\"/><circle cx=\"270\" cy=\"60\" r=\"8\" class=\"boxa\"/><text x=\"160\" y=\"128\" text-anchor=\"middle\" font-size=\"10\" class=\"\">train: random neurons off   test: all on (scaled)</text></svg>", "h": "Dropout = randomly benching players so the team can't rely on a star."}, {"id": "Q30", "t": "Training", "q": "What is transfer learning?", "a": "Reusing a model pretrained on a big dataset (e.g. ImageNet) for a new task. Small dataset: freeze it and use it as a feature extractor (train only a new last layer). Bigger dataset: fine-tune some or all layers with a lower learning rate.", "f": "fixed", "d": "<svg class=\"dg\" viewBox=\"0 0 320 136\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>small data: feature extractor</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>bigger data: fine-tune</text><rect x=\"20\" y=\"22\" width=\"120\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"80.0\" y=\"33.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">pretrained layer</text><rect x=\"20\" y=\"44\" width=\"120\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"80.0\" y=\"55.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">pretrained layer</text><rect x=\"20\" y=\"66\" width=\"120\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"80.0\" y=\"77.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">pretrained layer</text><rect x=\"20\" y=\"88\" width=\"120\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"80.0\" y=\"99.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">pretrained layer</text><rect x=\"20\" y=\"110\" width=\"120\" height=\"18\" rx=\"4\" class=\"boxg\"/><text x=\"80.0\" y=\"121.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">new last layer: TRAIN</text><text x=\"150\" y=\"56\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">frozen</text><rect x=\"180\" y=\"22\" width=\"120\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"240.0\" y=\"33.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">pretrained layer</text><rect x=\"180\" y=\"44\" width=\"120\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"240.0\" y=\"55.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">pretrained layer</text><rect x=\"180\" y=\"66\" width=\"120\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"240.0\" y=\"77.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">fine-tune (low LR)</text><rect x=\"180\" y=\"88\" width=\"120\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"240.0\" y=\"99.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">fine-tune (low LR)</text><rect x=\"180\" y=\"110\" width=\"120\" height=\"18\" rx=\"4\" class=\"boxg\"/><text x=\"240.0\" y=\"121.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">new last layer: TRAIN</text></svg>", "h": "Little data: freeze and swap the head. More data: unfreeze more layers, LR about 1/10."}, {"id": "Q31", "t": "Attention/Transformers", "q": "Why do Transformers train faster than RNNs?", "a": "Self-attention processes all positions of the sequence in parallel with matrix multiplies, while an RNN must compute hidden states one step at a time.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 152\" role=\"img\"><rect x=\"110\" y=\"128\" width=\"100\" height=\"20\" rx=\"4\" class=\"box\"/><text x=\"160.0\" y=\"141.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">input vectors x</text><line x1=\"160\" y1=\"128\" x2=\"160\" y2=\"116\" class=\"ln\"/><polygon points=\"160,116 162.60979320466737,121.40268261411606 157.39020679533263,121.40268261411606\" class=\"ah\"/><rect x=\"100\" y=\"94\" width=\"120\" height=\"22\" rx=\"4\" class=\"boxa\"/><text x=\"160.0\" y=\"108.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">self-attention</text><line x1=\"160\" y1=\"94\" x2=\"160\" y2=\"84\" class=\"ln\"/><polygon points=\"160,84 162.60979320466737,89.40268261411606 157.39020679533263,89.40268261411606\" class=\"ah\"/><rect x=\"130\" y=\"64\" width=\"60\" height=\"20\" rx=\"4\" class=\"boxg\"/><text x=\"160.0\" y=\"76.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">+ , LayerNorm</text><line x1=\"160\" y1=\"64\" x2=\"160\" y2=\"54\" class=\"ln\"/><polygon points=\"160,54 162.60979320466737,59.40268261411606 157.39020679533263,59.40268261411606\" class=\"ah\"/><rect x=\"100\" y=\"32\" width=\"120\" height=\"22\" rx=\"4\" class=\"boxa\"/><text x=\"160.0\" y=\"46.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">MLP (per vector)</text><line x1=\"160\" y1=\"32\" x2=\"160\" y2=\"22\" class=\"ln\"/><polygon points=\"160,22 162.60979320466737,27.40268261411606 157.39020679533263,27.40268261411606\" class=\"ah\"/><rect x=\"130\" y=\"2\" width=\"60\" height=\"20\" rx=\"4\" class=\"boxg\"/><text x=\"160.0\" y=\"14.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">+ , LayerNorm</text><path d=\"M110,138 Q60,110 128,74\" class=\"lnf\"/><path d=\"M120,74 Q60,50 128,12\" class=\"lnf\"/><text x=\"55\" y=\"80\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">residual</text><text x=\"268\" y=\"40\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">only attention</text><text x=\"268\" y=\"52\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">mixes tokens;</text><text x=\"268\" y=\"64\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">all in parallel</text><text x=\"268\" y=\"92\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">RNN: one step</text><text x=\"268\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">at a time</text></svg>", "h": "Transformer block: attention, add + norm, MLP, add + norm. Stack many."}, {"id": "Q32", "t": "Basics/KNN/Linear", "q": "True/False: Machine learning could reach human learning in a mechanical sense, but human learning involves soul.", "a": "TRUE. (From the lecture contrasting human learning, Plato's 'learning is remembrance', with machine learning, Simon's 'improves performance from experience'.)", "f": ""}, {"id": "Q33", "t": "Basics/KNN/Linear", "q": "What is predictive modeling?", "a": "Using historical data to build a model (approximating a function y = f(x)) that makes predictions on new data where we don't know the answer.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 66\" role=\"img\"><text x=\"160\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Predictive modeling: approximate y = f(x)</text><rect x=\"10\" y=\"26\" width=\"90\" height=\"34\" rx=\"4\" class=\"box\"/><text x=\"55.0\" y=\"40.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">historical data</text><text x=\"55.0\" y=\"52.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">(x, y) pairs</text><line x1=\"100\" y1=\"43\" x2=\"120\" y2=\"43\" class=\"ln\"/><polygon points=\"120,43 114.59731738588394,45.60979320466738 114.59731738588394,40.39020679533262\" class=\"ah\"/><rect x=\"122\" y=\"26\" width=\"70\" height=\"34\" rx=\"4\" class=\"boxa\"/><text x=\"157.0\" y=\"46.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">learn f</text><line x1=\"192\" y1=\"43\" x2=\"212\" y2=\"43\" class=\"ln\"/><polygon points=\"212,43 206.59731738588394,45.60979320466738 206.59731738588394,40.39020679533262\" class=\"ah\"/><rect x=\"214\" y=\"26\" width=\"96\" height=\"34\" rx=\"4\" class=\"boxg\"/><text x=\"262.0\" y=\"40.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">predict y for</text><text x=\"262.0\" y=\"52.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">new x</text></svg>"}, {"id": "Q34", "t": "Basics/KNN/Linear", "q": "What is the difference between a classification task and a regression task?", "a": "Classification predicts a discrete class label. Regression predicts a continuous quantity.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 112\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Classification</text><rect x=\"10\" y=\"22\" width=\"50\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"35.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">email</text><line x1=\"60\" y1=\"35\" x2=\"80\" y2=\"35\" class=\"ln\"/><polygon points=\"80,35 74.59731738588394,37.60979320466738 74.59731738588394,32.39020679533262\" class=\"ah\"/><rect x=\"82\" y=\"22\" width=\"100\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"132.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">spam / not spam</text><text x=\"80\" y=\"72\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Regression</text><rect x=\"10\" y=\"80\" width=\"50\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"35.0\" y=\"96.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">house</text><line x1=\"60\" y1=\"93\" x2=\"80\" y2=\"93\" class=\"ln\"/><polygon points=\"80,93 74.59731738588394,95.60979320466738 74.59731738588394,90.39020679533262\" class=\"ah\"/><rect x=\"82\" y=\"80\" width=\"100\" height=\"26\" rx=\"4\" class=\"boxg\"/><text x=\"132.0\" y=\"96.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">$153,200</text><text x=\"255\" y=\"35\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">discrete label</text><text x=\"255\" y=\"93\" text-anchor=\"middle\" font-size=\"10\" class=\"good\">continuous number</text></svg>", "h": "Classification = which bucket. Regression = how much."}, {"id": "Q36", "t": "Generative", "q": "Where do we draw the line to say we have both a good generator and a good discriminator, since one being good makes the other look bad?", "a": "In theory the game reaches equilibrium when p_G = p_data: the generator's samples match the real distribution and the best discriminator can only output 1/2 everywhere (can't tell real from fake). In practice we are not minimizing one overall loss, so there is no meaningful training curve; the losses oscillate. So we judge by the generated samples: quality and diversity, and watch for mode collapse.", "f": "filled", "d": "<svg class=\"dg\" viewBox=\"0 0 320 102\" role=\"img\"><line x1=\"10\" y1=\"80\" x2=\"300\" y2=\"80\" class=\"ln\"/><path d=\"M30,80 Q150,0 270,80\" class=\"lng\"/><path d=\"M34,80 Q150,4 266,80\" class=\"lna\"/><line x1=\"10\" y1=\"45\" x2=\"300\" y2=\"45\" class=\"lnr\"/><text x=\"300\" y=\"40\" text-anchor=\"end\" font-size=\"9\" class=\"bad\">D(x) = 1/2</text><text x=\"150\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"\">p_G matches p_data: D can only guess</text></svg>", "h": "Ideal end: D is a coin flip. In practice, judge by the samples."}, {"id": "Q37", "t": "Attention/Transformers", "q": "Compare masked vs multi-head self-attention layers.", "a": "Masked self-attention: sets attention scores for future positions to -infinity before softmax so each token can't look ahead. Used for language modeling (predict the next word).\nMulti-head self-attention: runs H independent attention heads in parallel (input split across heads), then concatenates, so different heads can learn different relationships. Hyperparameters: query dimension D_Q and number of heads H.\nThey are not alternatives: a decoder can use masked multi-head attention.", "f": "filled", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"70\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>masked</text><rect x=\"20\" y=\"22\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"42\" y=\"22\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"64\" y=\"22\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"86\" y=\"22\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"20\" y=\"44\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"42\" y=\"44\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"64\" y=\"44\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"86\" y=\"44\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"20\" y=\"66\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"42\" y=\"66\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"64\" y=\"66\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"86\" y=\"66\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"20\" y=\"88\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"42\" y=\"88\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"64\" y=\"88\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"86\" y=\"88\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"53\" y=\"37\" text-anchor=\"middle\" font-size=\"6\" class=\"bad\">-inf</text><text x=\"75\" y=\"37\" text-anchor=\"middle\" font-size=\"6\" class=\"bad\">-inf</text><text x=\"97\" y=\"37\" text-anchor=\"middle\" font-size=\"6\" class=\"bad\">-inf</text><text x=\"75\" y=\"59\" text-anchor=\"middle\" font-size=\"6\" class=\"bad\">-inf</text><text x=\"97\" y=\"59\" text-anchor=\"middle\" font-size=\"6\" class=\"bad\">-inf</text><text x=\"97\" y=\"81\" text-anchor=\"middle\" font-size=\"6\" class=\"bad\">-inf</text><text x=\"64\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">can&#x27;t see the future</text><text x=\"230\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>multi-head</text><rect x=\"170\" y=\"40\" width=\"36\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"188.0\" y=\"52.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">head</text><text x=\"188.0\" y=\"62.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">1</text><line x1=\"230\" y1=\"26\" x2=\"188\" y2=\"40\" class=\"ln\"/><polygon points=\"188,40 192.3001456858019,35.815654521806394 193.95072383555768,40.76738897107374\" class=\"ah\"/><rect x=\"212\" y=\"40\" width=\"36\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"230.0\" y=\"52.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">head</text><text x=\"230.0\" y=\"62.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">2</text><line x1=\"230\" y1=\"26\" x2=\"230\" y2=\"40\" class=\"ln\"/><polygon points=\"230,40 227.39020679533263,34.59731738588394 232.60979320466737,34.59731738588394\" class=\"ah\"/><rect x=\"254\" y=\"40\" width=\"36\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"272.0\" y=\"52.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">head</text><text x=\"272.0\" y=\"62.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">3</text><line x1=\"230\" y1=\"26\" x2=\"272\" y2=\"40\" class=\"ln\"/><polygon points=\"272,40 266.0492761644423,40.767388971073736 267.6998543141981,35.815654521806394\" class=\"ah\"/><rect x=\"185\" y=\"90\" width=\"90\" height=\"22\" rx=\"4\" class=\"box\"/><text x=\"230.0\" y=\"104.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">concat</text><line x1=\"188\" y1=\"70\" x2=\"230\" y2=\"90\" class=\"ln\"/><polygon points=\"230,90 224.00009343541188,90.03348456677875 226.24416890854442,85.32092607320044\" class=\"ah\"/><line x1=\"230\" y1=\"70\" x2=\"230\" y2=\"90\" class=\"ln\"/><polygon points=\"230,90 227.39020679533263,84.59731738588394 232.60979320466737,84.59731738588394\" class=\"ah\"/><line x1=\"272\" y1=\"70\" x2=\"230\" y2=\"90\" class=\"ln\"/><polygon points=\"230,90 233.75583109145558,85.32092607320044 235.99990656458812,90.03348456677875\" class=\"ah\"/><text x=\"230\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">different relationships</text></svg>", "h": "Masked = no peeking ahead (upper triangle blocked). Multi-head = several attentions side by side."}, {"id": "Q38", "t": "RNN/LSTM", "q": "List the different input/output types for RNNs with examples.", "a": "One-to-one: plain feedforward, e.g. image classification.\nOne-to-many: image captioning (image to sequence of words).\nMany-to-one: video classification or sentiment (sequence to one label).\nMany-to-many: machine translation (seq2seq), or per-frame video classification.\nRNNs can also process non-sequential data sequentially (e.g. classifying an image by a series of glimpses).", "f": "filled", "d": "<svg class=\"dg\" viewBox=\"0 0 320 134\" role=\"img\"><text x=\"43\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>one-to-one</text><rect x=\"32\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><rect x=\"32\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"40\" y1=\"84\" x2=\"40\" y2=\"61\" class=\"ln\"/><polygon points=\"40,61 42.60979320466738,66.40268261411606 37.39020679533262,66.40268261411606\" class=\"ah\"/><rect x=\"32\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"40\" y1=\"47\" x2=\"40\" y2=\"33\" class=\"ln\"/><polygon points=\"40,33 42.60979320466738,38.40268261411606 37.39020679533262,38.40268261411606\" class=\"ah\"/><text x=\"43\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">image class.</text><text x=\"121\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>one-to-many</text><rect x=\"86\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"102\" y1=\"54\" x2=\"110\" y2=\"54\" class=\"ln\"/><polygon points=\"110,54 104.59731738588394,56.60979320466738 104.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"86\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"94\" y1=\"84\" x2=\"94\" y2=\"61\" class=\"ln\"/><polygon points=\"94,61 96.60979320466738,66.40268261411606 91.39020679533262,66.40268261411606\" class=\"ah\"/><rect x=\"86\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"94\" y1=\"47\" x2=\"94\" y2=\"33\" class=\"ln\"/><polygon points=\"94,33 96.60979320466738,38.40268261411606 91.39020679533262,38.40268261411606\" class=\"ah\"/><rect x=\"110\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"126\" y1=\"54\" x2=\"134\" y2=\"54\" class=\"ln\"/><polygon points=\"134,54 128.59731738588394,56.60979320466738 128.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"110\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"118\" y1=\"47\" x2=\"118\" y2=\"33\" class=\"ln\"/><polygon points=\"118,33 120.60979320466738,38.40268261411606 115.39020679533262,38.40268261411606\" class=\"ah\"/><rect x=\"134\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><rect x=\"134\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"142\" y1=\"47\" x2=\"142\" y2=\"33\" class=\"ln\"/><polygon points=\"142,33 144.60979320466737,38.40268261411606 139.39020679533263,38.40268261411606\" class=\"ah\"/><text x=\"121\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">captioning</text><text x=\"199\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>many-to-one</text><rect x=\"164\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"180\" y1=\"54\" x2=\"188\" y2=\"54\" class=\"ln\"/><polygon points=\"188,54 182.59731738588394,56.60979320466738 182.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"164\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"172\" y1=\"84\" x2=\"172\" y2=\"61\" class=\"ln\"/><polygon points=\"172,61 174.60979320466737,66.40268261411606 169.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"188\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"204\" y1=\"54\" x2=\"212\" y2=\"54\" class=\"ln\"/><polygon points=\"212,54 206.59731738588394,56.60979320466738 206.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"188\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"196\" y1=\"84\" x2=\"196\" y2=\"61\" class=\"ln\"/><polygon points=\"196,61 198.60979320466737,66.40268261411606 193.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"212\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><rect x=\"212\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"220\" y1=\"84\" x2=\"220\" y2=\"61\" class=\"ln\"/><polygon points=\"220,61 222.60979320466737,66.40268261411606 217.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"212\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"220\" y1=\"47\" x2=\"220\" y2=\"33\" class=\"ln\"/><polygon points=\"220,33 222.60979320466737,38.40268261411606 217.39020679533263,38.40268261411606\" class=\"ah\"/><text x=\"199\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">video class.</text><text x=\"277\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>many-to-many</text><rect x=\"242\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"258\" y1=\"54\" x2=\"266\" y2=\"54\" class=\"ln\"/><polygon points=\"266,54 260.5973173858839,56.60979320466738 260.5973173858839,51.39020679533262\" class=\"ah\"/><rect x=\"242\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"250\" y1=\"84\" x2=\"250\" y2=\"61\" class=\"ln\"/><polygon points=\"250,61 252.60979320466737,66.40268261411606 247.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"242\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"250\" y1=\"47\" x2=\"250\" y2=\"33\" class=\"ln\"/><polygon points=\"250,33 252.60979320466737,38.40268261411606 247.39020679533263,38.40268261411606\" class=\"ah\"/><rect x=\"266\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"282\" y1=\"54\" x2=\"290\" y2=\"54\" class=\"ln\"/><polygon points=\"290,54 284.5973173858839,56.60979320466738 284.5973173858839,51.39020679533262\" class=\"ah\"/><rect x=\"266\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"274\" y1=\"84\" x2=\"274\" y2=\"61\" class=\"ln\"/><polygon points=\"274,61 276.60979320466737,66.40268261411606 271.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"266\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"274\" y1=\"47\" x2=\"274\" y2=\"33\" class=\"ln\"/><polygon points=\"274,33 276.60979320466737,38.40268261411606 271.39020679533263,38.40268261411606\" class=\"ah\"/><rect x=\"290\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><rect x=\"290\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"298\" y1=\"84\" x2=\"298\" y2=\"61\" class=\"ln\"/><polygon points=\"298,61 300.60979320466737,66.40268261411606 295.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"290\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"298\" y1=\"47\" x2=\"298\" y2=\"33\" class=\"ln\"/><polygon points=\"298,33 300.60979320466737,38.40268261411606 295.39020679533263,38.40268261411606\" class=\"ah\"/><text x=\"277\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">translation</text><text x=\"160\" y=\"128\" text-anchor=\"middle\" font-size=\"8\" class=\"\">red = input   blue = hidden   green = output</text></svg>", "h": "Count the arrows in and out: captioning = 1 in, many out; video label = many in, 1 out."}, {"id": "Q39", "t": "Optimization & NN", "q": "Why are fully connected layers poorly suited for raw, high-resolution images?", "a": "Flattening the image destroys its 2D spatial structure and local correlations between neighboring pixels. And the parameter count explodes (200x200 image to 40K hidden units = ~2 billion weights), wasting memory and needing far more data than we have.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Fully connected</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Conv: shared filter</text><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"96\" class=\"lnf\"/><circle cx=\"30\" cy=\"30\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"48\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"66\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"84\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"102\" r=\"5\" class=\"acc\"/><circle cx=\"130\" cy=\"36\" r=\"5\" class=\"good\"/><circle cx=\"130\" cy=\"56\" r=\"5\" class=\"good\"/><circle cx=\"130\" cy=\"76\" r=\"5\" class=\"good\"/><circle cx=\"130\" cy=\"96\" r=\"5\" class=\"good\"/><line x1=\"190\" y1=\"30\" x2=\"290\" y2=\"48\" class=\"lna\"/><line x1=\"190\" y1=\"48\" x2=\"290\" y2=\"48\" class=\"lng\"/><line x1=\"190\" y1=\"66\" x2=\"290\" y2=\"48\" class=\"lnr\"/><line x1=\"190\" y1=\"48\" x2=\"290\" y2=\"66\" class=\"lna\"/><line x1=\"190\" y1=\"66\" x2=\"290\" y2=\"66\" class=\"lng\"/><line x1=\"190\" y1=\"84\" x2=\"290\" y2=\"66\" class=\"lnr\"/><line x1=\"190\" y1=\"66\" x2=\"290\" y2=\"84\" class=\"lna\"/><line x1=\"190\" y1=\"84\" x2=\"290\" y2=\"84\" class=\"lng\"/><line x1=\"190\" y1=\"102\" x2=\"290\" y2=\"84\" class=\"lnr\"/><circle cx=\"190\" cy=\"30\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"48\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"66\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"84\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"102\" r=\"5\" class=\"acc\"/><circle cx=\"290\" cy=\"48\" r=\"5\" class=\"good\"/><circle cx=\"290\" cy=\"66\" r=\"5\" class=\"good\"/><circle cx=\"290\" cy=\"84\" r=\"5\" class=\"good\"/><text x=\"80\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">every input to every output</text><text x=\"240\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">same 3 weights reused, local</text></svg>", "h": "FC: everyone talks to everyone (huge). Conv: one small filter slides and is reused."}, {"id": "Q40", "t": "RNN/LSTM", "q": "How do LSTM and GRU solve the vanishing gradient problem compared to a vanilla RNN?", "a": "A vanilla RNN backprops through repeated multiplication by W and tanh at every step, so gradients shrink. LSTM/GRU use gates and an additive cell update (c_t = f * c_{t-1} + i * g). Backprop from c_t to c_{t-1} is only an elementwise multiply by the forget gate, no matrix multiply, giving uninterrupted gradient flow (like ResNet).", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 172\" role=\"img\"><line x1=\"10\" y1=\"30\" x2=\"310\" y2=\"30\" class=\"lng\"/><line x1=\"290\" y1=\"30\" x2=\"310\" y2=\"30\" class=\"lng\"/><polygon points=\"310,30 304.5973173858839,32.60979320466738 304.5973173858839,27.390206795332617\" class=\"ahg\"/><text x=\"20\" y=\"22\" text-anchor=\"start\" font-size=\"9\" class=\"\">c(t-1)</text><text x=\"300\" y=\"22\" text-anchor=\"end\" font-size=\"9\" class=\"\">c(t)</text><circle cx=\"100\" cy=\"30\" r=\"10\" class=\"boxr\"/><text x=\"100\" y=\"34\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><circle cx=\"190\" cy=\"30\" r=\"10\" class=\"boxa\"/><text x=\"190\" y=\"34\" text-anchor=\"middle\" font-size=\"10\" class=\"\">+</text><text x=\"160\" y=\"16\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">cell highway: no matrix multiply</text><rect x=\"83\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxr\"/><text x=\"100.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">f</text><text x=\"100\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">forget</text><rect x=\"148\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"165.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">i</text><text x=\"165\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">input</text><rect x=\"198\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"215.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">g</text><text x=\"215\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">gate</text><rect x=\"253\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"270.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">o</text><text x=\"270\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">output</text><line x1=\"100\" y1=\"80\" x2=\"100\" y2=\"40\" class=\"ln\"/><polyline points=\"165,80 165,60 190,60 190,40\" class=\"ln\"/><polyline points=\"215,80 215,60 190,60\" class=\"ln\"/><circle cx=\"190\" cy=\"60\" r=\"6\" class=\"box\"/><text x=\"190\" y=\"63\" text-anchor=\"middle\" font-size=\"8\" class=\"\">x</text><polyline points=\"250,30 250,55\" class=\"ln\"/><rect x=\"236\" y=\"46\" width=\"28\" height=\"16\" rx=\"4\" class=\"box\"/><text x=\"250.0\" y=\"56.45\" text-anchor=\"middle\" font-size=\"7\" class=\"\">tanh</text><polyline points=\"250,62 250,70 270,70 270,80\" class=\"ln\"/><circle cx=\"270\" cy=\"70\" r=\"6\" class=\"box\"/><text x=\"270\" y=\"73\" text-anchor=\"middle\" font-size=\"8\" class=\"\">x</text><line x1=\"276\" y1=\"70\" x2=\"296\" y2=\"70\" class=\"ln\"/><polygon points=\"296,70 290.5973173858839,72.60979320466738 290.5973173858839,67.39020679533262\" class=\"ah\"/><text x=\"300\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" class=\"\">h(t)</text><rect x=\"30\" y=\"132\" width=\"260\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"160.0\" y=\"144.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">inputs: h(t-1) and x(t)</text><line x1=\"100\" y1=\"132\" x2=\"100\" y2=\"106\" class=\"ln\"/><line x1=\"165\" y1=\"132\" x2=\"165\" y2=\"106\" class=\"ln\"/><line x1=\"215\" y1=\"132\" x2=\"215\" y2=\"106\" class=\"ln\"/><line x1=\"270\" y1=\"132\" x2=\"270\" y2=\"106\" class=\"ln\"/><text x=\"160\" y=\"166\" text-anchor=\"middle\" font-size=\"10\" class=\"\">c = f*c + i*g      h = o*tanh(c)</text></svg>", "h": "f erases, i decides to write, g is what to write, o decides what to show. Top line = gradient highway."}, {"id": "Q41", "t": "Generative", "q": "What is the main difference between what a discriminative and a generative model learn?", "a": "Discriminative learns p(y|x): for each input, the possible labels compete for probability. Generative learns p(x) (or p(x|y) if conditional): all possible inputs compete for probability, so it can reject unreasonable inputs.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Discriminative p(y|x)</text><rect x=\"10\" y=\"26\" width=\"50\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"35.0\" y=\"38.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">one</text><text x=\"35.0\" y=\"49.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">image</text><rect x=\"80\" y=\"40\" width=\"18\" height=\"40\" rx=\"1\" class=\"boxa\"/><text x=\"89\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">cat</text><rect x=\"106\" y=\"65\" width=\"18\" height=\"15\" rx=\"1\" class=\"boxa\"/><text x=\"115\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">dog</text><rect x=\"132\" y=\"75\" width=\"18\" height=\"5\" rx=\"1\" class=\"boxa\"/><text x=\"141\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">ship</text><text x=\"80\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">labels compete</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Generative p(x)</text><rect x=\"185\" y=\"40\" width=\"20\" height=\"40\" rx=\"1\" class=\"boxg\"/><text x=\"195\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">dog</text><rect x=\"215\" y=\"50\" width=\"20\" height=\"30\" rx=\"1\" class=\"boxg\"/><text x=\"225\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">cat</text><rect x=\"245\" y=\"74\" width=\"20\" height=\"6\" rx=\"1\" class=\"boxg\"/><text x=\"255\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">3-leg</text><rect x=\"275\" y=\"78\" width=\"20\" height=\"2\" rx=\"1\" class=\"boxg\"/><text x=\"285\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">noise</text><text x=\"240\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">all images compete</text><text x=\"160\" y=\"126\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">conditional p(x|y): images compete within each label</text></svg>", "h": "Discriminative: given x, which y? Generative: how likely is x at all?"}, {"id": "Q42", "t": "Training", "q": "What is the dying ReLU problem, and how is it fixed?", "a": "If a ReLU's input is always negative, it outputs 0 with gradient 0, so it never updates and stays dead. Fixes: Leaky ReLU, PReLU, ELU (small nonzero output/gradient for negatives), or initialize biases slightly positive (e.g. 0.01).", "f": "fixed", "d": "<svg class=\"dg\" viewBox=\"0 0 320 110\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>sigmoid</text><line x1=\"10\" y1=\"90\" x2=\"150\" y2=\"90\" class=\"ln\"/><path d=\"M10,86 C60,86 60,24 80,24 S100,24 150,24\" class=\"lna\"/><path d=\"M10,86 C60,86 70,24 150,24\" class=\"none\"/><rect x=\"10\" y=\"18\" width=\"35\" height=\"74\" rx=\"2\" class=\"boxr\"/><rect x=\"115\" y=\"18\" width=\"35\" height=\"74\" rx=\"2\" class=\"boxr\"/><text x=\"80\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">flat ends: grad ~ 0</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>ReLU</text><line x1=\"170\" y1=\"90\" x2=\"310\" y2=\"90\" class=\"ln\"/><polyline points=\"170,80 240,80 310,20\" class=\"lng\"/><text x=\"205\" y=\"72\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">x&lt;0: output 0</text><text x=\"240\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">dead if always below 0</text><text x=\"280\" y=\"72\" text-anchor=\"middle\" font-size=\"8\" class=\"good\">slope 1</text></svg>", "h": "Sigmoid goes flat at both ends and kills gradients. ReLU is a ramp: slope 1 for positives."}, {"id": "Q43", "t": "Generative", "q": "After training an autoencoder on unlabeled data, how do you use it for a supervised task?", "a": "Throw away the decoder, keep the encoder. Put a classifier on top of the encoder's features, use the encoder to initialize the supervised model, and fine-tune encoder + classifier together on the (small) labeled dataset.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 122\" role=\"img\"><polygon points=\"10,20 70,40 70,70 10,90\" class=\"boxa\"/><text x=\"38\" y=\"58\" text-anchor=\"middle\" font-size=\"9\" class=\"\">enc</text><rect x=\"74\" y=\"42\" width=\"22\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"85.0\" y=\"58.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">z</text><polygon points=\"100,40 160,20 160,90 100,70\" class=\"boxg\"/><text x=\"132\" y=\"58\" text-anchor=\"middle\" font-size=\"9\" class=\"\">dec</text><text x=\"90\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">1. train on unlabeled</text><line x1=\"172\" y1=\"55\" x2=\"186\" y2=\"55\" class=\"ln\"/><polygon points=\"186,55 180.59731738588394,57.60979320466738 180.59731738588394,52.39020679533262\" class=\"ah\"/><polygon points=\"190,20 250,40 250,70 190,90\" class=\"boxa\"/><text x=\"218\" y=\"58\" text-anchor=\"middle\" font-size=\"9\" class=\"\">enc</text><rect x=\"254\" y=\"42\" width=\"22\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"265.0\" y=\"58.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">z</text><line x1=\"276\" y1=\"55\" x2=\"288\" y2=\"55\" class=\"ln\"/><polygon points=\"288,55 282.5973173858839,57.60979320466738 282.5973173858839,52.39020679533262\" class=\"ah\"/><rect x=\"290\" y=\"40\" width=\"30\" height=\"30\" rx=\"4\" class=\"boxr\"/><text x=\"305.0\" y=\"58.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">cls</text><text x=\"250\" y=\"104\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">2. drop decoder,</text><text x=\"250\" y=\"116\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">add classifier</text></svg>", "h": "Keep the encoder, throw away the decoder, fine-tune with a classifier."}, {"id": "Q44", "t": "Training", "q": "What are the advantages of ReLU and Leaky ReLU over other activation functions?", "a": "Don't saturate in the positive region, very cheap to compute, converge much faster than sigmoid/tanh in practice (about 6x). Leaky ReLU also never dies.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 110\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>sigmoid</text><line x1=\"10\" y1=\"90\" x2=\"150\" y2=\"90\" class=\"ln\"/><path d=\"M10,86 C60,86 60,24 80,24 S100,24 150,24\" class=\"lna\"/><path d=\"M10,86 C60,86 70,24 150,24\" class=\"none\"/><rect x=\"10\" y=\"18\" width=\"35\" height=\"74\" rx=\"2\" class=\"boxr\"/><rect x=\"115\" y=\"18\" width=\"35\" height=\"74\" rx=\"2\" class=\"boxr\"/><text x=\"80\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">flat ends: grad ~ 0</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>ReLU</text><line x1=\"170\" y1=\"90\" x2=\"310\" y2=\"90\" class=\"ln\"/><polyline points=\"170,80 240,80 310,20\" class=\"lng\"/><text x=\"205\" y=\"72\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">x&lt;0: output 0</text><text x=\"240\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">dead if always below 0</text><text x=\"280\" y=\"72\" text-anchor=\"middle\" font-size=\"8\" class=\"good\">slope 1</text></svg>", "h": "Sigmoid goes flat at both ends and kills gradients. ReLU is a ramp: slope 1 for positives."}, {"id": "Q45", "t": "Training", "q": "Consequences of decaying the learning rate too quickly vs too slowly?", "a": "Too quickly (too early): steps get tiny while the loss is still falling, so training plateaus before reaching a good minimum.\nToo slowly: the model keeps bouncing around the minimum with big steps and wastes training time before settling.", "f": "fixed", "d": "<svg class=\"dg\" viewBox=\"0 0 320 110\" role=\"img\"><line x1=\"15\" y1=\"90\" x2=\"305\" y2=\"90\" class=\"ln\"/><line x1=\"15\" y1=\"90\" x2=\"15\" y2=\"15\" class=\"ln\"/><path d=\"M15,25 Q60,60 90,62 L90,75 Q140,78 170,80 L170,84 L300,85\" class=\"lna\"/><path d=\"M15,25 Q40,35 50,55 L50,52 L300,52\" class=\"lnr\"/><text x=\"200\" y=\"40\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">decayed too early: stuck high</text><text x=\"220\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">good: drop LR when it flattens</text><text x=\"60\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">time</text></svg>", "h": "Drop the LR only once the loss stops improving."}, {"id": "Q46", "t": "Backprop", "q": "If F = A(B + C), what are dF/dA, dF/dB, dF/dC?", "a": "dF/dA = B + C\ndF/dB = A\ndF/dC = A", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><circle cx=\"140\" cy=\"40\" r=\"16\" class=\"boxa\"/><text x=\"140\" y=\"44\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><circle cx=\"230\" cy=\"50\" r=\"16\" class=\"boxa\"/><text x=\"230\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" class=\"\">x</text><rect x=\"10\" y=\"10\" width=\"60\" height=\"22\" rx=\"4\" class=\"box\"/><text x=\"40.0\" y=\"24.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">B</text><rect x=\"10\" y=\"50\" width=\"60\" height=\"22\" rx=\"4\" class=\"box\"/><text x=\"40.0\" y=\"64.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">C</text><rect x=\"140\" y=\"80\" width=\"60\" height=\"22\" rx=\"4\" class=\"box\"/><text x=\"170.0\" y=\"94.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">A</text><line x1=\"70\" y1=\"21\" x2=\"124\" y2=\"36\" class=\"ln\"/><line x1=\"70\" y1=\"61\" x2=\"124\" y2=\"44\" class=\"ln\"/><line x1=\"156\" y1=\"40\" x2=\"214\" y2=\"48\" class=\"ln\"/><line x1=\"200\" y1=\"91\" x2=\"216\" y2=\"60\" class=\"ln\"/><line x1=\"246\" y1=\"50\" x2=\"270\" y2=\"50\" class=\"ln\"/><text x=\"290\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" class=\"\">F</text><text x=\"100\" y=\"10\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">dB = A</text><text x=\"100\" y=\"76\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">dC = A</text><text x=\"170\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">dA = B + C</text></svg><svg class=\"dg\" viewBox=\"0 0 320 108\" role=\"img\"><circle cx=\"55\" cy=\"40\" r=\"18\" class=\"boxa\"/><text x=\"55\" y=\"44\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>+</text><line x1=\"105\" y1=\"40\" x2=\"76\" y2=\"40\" class=\"lnr\"/><polygon points=\"76,40 81.40268261411606,37.39020679533262 81.40268261411606,42.60979320466738\" class=\"ah\"/><text x=\"100\" y=\"32\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">grad</text><line x1=\"37\" y1=\"34\" x2=\"13\" y2=\"24\" class=\"lnr\"/><polygon points=\"13,24 18.990858260979202,23.668914970351672 16.983325026619678,28.48699473281453\" class=\"ah\"/><line x1=\"37\" y1=\"46\" x2=\"13\" y2=\"56\" class=\"lnr\"/><polygon points=\"13,56 16.983325026619678,51.51300526718547 18.990858260979202,56.33108502964833\" class=\"ah\"/><text x=\"58\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\" font-weight=600>distributor</text><text x=\"58\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" class=\"\">copies grad</text><text x=\"58\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"\">to both</text><circle cx=\"159\" cy=\"40\" r=\"18\" class=\"boxa\"/><text x=\"159\" y=\"44\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>x</text><line x1=\"209\" y1=\"40\" x2=\"180\" y2=\"40\" class=\"lnr\"/><polygon points=\"180,40 185.40268261411606,37.39020679533262 185.40268261411606,42.60979320466738\" class=\"ah\"/><text x=\"204\" y=\"32\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">grad</text><line x1=\"141\" y1=\"34\" x2=\"117\" y2=\"24\" class=\"lnr\"/><polygon points=\"117,24 122.99085826097921,23.668914970351672 120.98332502661968,28.48699473281453\" class=\"ah\"/><line x1=\"141\" y1=\"46\" x2=\"117\" y2=\"56\" class=\"lnr\"/><polygon points=\"117,56 120.98332502661968,51.51300526718547 122.99085826097921,56.33108502964833\" class=\"ah\"/><text x=\"162\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\" font-weight=600>switcher</text><text x=\"162\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" class=\"\">each gets grad</text><text x=\"162\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x OTHER input</text><circle cx=\"263\" cy=\"40\" r=\"18\" class=\"boxa\"/><text x=\"263\" y=\"44\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>max</text><line x1=\"313\" y1=\"40\" x2=\"284\" y2=\"40\" class=\"lnr\"/><polygon points=\"284,40 289.4026826141161,37.39020679533262 289.4026826141161,42.60979320466738\" class=\"ah\"/><text x=\"308\" y=\"32\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">grad</text><line x1=\"245\" y1=\"34\" x2=\"221\" y2=\"24\" class=\"lnr\"/><polygon points=\"221,24 226.9908582609792,23.668914970351672 224.98332502661967,28.48699473281453\" class=\"ah\"/><line x1=\"245\" y1=\"46\" x2=\"221\" y2=\"56\" class=\"lnr\"/><polygon points=\"221,56 224.98332502661967,51.51300526718547 226.9908582609792,56.33108502964833\" class=\"ah\"/><text x=\"266\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\" font-weight=600>router</text><text x=\"266\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" class=\"\">all grad to</text><text x=\"266\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"\">the max, 0 else</text></svg>", "h": "Multiply: each input's gradient is the OTHER input. Add: copies it."}, {"id": "Q47", "t": "Optimization & NN", "q": "What are the four optimization ideas/methods?", "a": "1. Random search (bad).\n2. Follow the slope (use the gradient).\n3. Gradient descent over the full dataset (batch).\n4. SGD: estimate the gradient from a minibatch.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 88\" role=\"img\"><rect x=\"10\" y=\"16\" width=\"72\" height=\"48\" rx=\"4\" class=\"boxr\"/><text x=\"46.0\" y=\"32.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1.</text><text x=\"46.0\" y=\"43.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">random</text><text x=\"46.0\" y=\"54.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">search</text><line x1=\"82\" y1=\"40\" x2=\"87\" y2=\"40\" class=\"ln\"/><polygon points=\"87,40 81.59731738588394,42.60979320466738 81.59731738588394,37.39020679533262\" class=\"ah\"/><rect x=\"87\" y=\"16\" width=\"72\" height=\"48\" rx=\"4\" class=\"boxa\"/><text x=\"123.0\" y=\"32.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2.</text><text x=\"123.0\" y=\"43.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">follow</text><text x=\"123.0\" y=\"54.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">the slope</text><line x1=\"159\" y1=\"40\" x2=\"164\" y2=\"40\" class=\"ln\"/><polygon points=\"164,40 158.59731738588394,42.60979320466738 158.59731738588394,37.39020679533262\" class=\"ah\"/><rect x=\"164\" y=\"16\" width=\"72\" height=\"48\" rx=\"4\" class=\"boxa\"/><text x=\"200.0\" y=\"32.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3.</text><text x=\"200.0\" y=\"43.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">GD</text><text x=\"200.0\" y=\"54.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">on full data</text><line x1=\"236\" y1=\"40\" x2=\"241\" y2=\"40\" class=\"ln\"/><polygon points=\"241,40 235.59731738588394,42.60979320466738 235.59731738588394,37.39020679533262\" class=\"ah\"/><rect x=\"241\" y=\"16\" width=\"72\" height=\"48\" rx=\"4\" class=\"boxg\"/><text x=\"277.0\" y=\"32.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4.</text><text x=\"277.0\" y=\"43.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">SGD</text><text x=\"277.0\" y=\"54.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">on minibatch</text><text x=\"160\" y=\"80\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">bad  -&gt;  better  -&gt;  what we actually use</text></svg>"}, {"id": "Q48", "t": "Training", "q": "What is the problem with SGD?", "a": "Gets stuck at local minima and saddle points (zero gradient), zig-zags when the loss is steep in one direction and shallow in another, and gradients from minibatches are noisy.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><path d=\"M10,40 Q70,110 110,70 Q140,40 170,80 Q220,140 300,30\" class=\"ln\"/><circle cx=\"110\" cy=\"70\" r=\"5\" class=\"bad\"/><text x=\"110\" y=\"58\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">local min</text><circle cx=\"195\" cy=\"103\" r=\"5\" class=\"good\"/><text x=\"200\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">global min</text><text x=\"240\" y=\"20\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">+ noisy minibatch grads</text></svg>", "h": "SGD can get stuck where the slope is zero, and its gradients are noisy."}, {"id": "Q49", "t": "Hardware/PyTorch", "q": "Main differences between PyTorch and TensorFlow 1.0?", "a": "PyTorch: clean imperative API, dynamic graphs by default, easy to debug.\nTF 1.0: static graphs by default (define the graph, then run it), confusing to debug, messy API. (Static graphs can be optimized and serialized/deployed without the code.)", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 86\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Static (TF 1.0)</text><rect x=\"10\" y=\"24\" width=\"60\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"40.0\" y=\"40.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">build graph</text><line x1=\"70\" y1=\"37\" x2=\"84\" y2=\"37\" class=\"ln\"/><polygon points=\"84,37 78.59731738588394,39.60979320466738 78.59731738588394,34.39020679533262\" class=\"ah\"/><rect x=\"86\" y=\"24\" width=\"60\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"116.0\" y=\"40.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">run many x</text><text x=\"80\" y=\"68\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">optimize, deploy</text><text x=\"80\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">hard to debug</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Dynamic (PyTorch)</text><rect x=\"180\" y=\"24\" width=\"124\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"242.0\" y=\"40.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">build + run each step</text><text x=\"240\" y=\"68\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">easy to debug</text><text x=\"240\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">Python control flow</text></svg>", "h": "Static: define then run. Dynamic: define by running."}, {"id": "Q50", "t": "Detection & Segmentation", "q": "What methods can we use to downsample and upsample, and why?", "a": "Downsample: pooling or strided convolution. Reduces spatial size, cutting memory and computation and growing the receptive field.\nUpsample: unpooling (nearest neighbor, bed of nails, max unpooling) or transposed convolution (learnable). Used in decoders to get back to full resolution for dense per-pixel outputs like semantic segmentation.", "f": "fixed", "d": "<svg class=\"dg\" viewBox=\"0 0 320 124\" role=\"img\"><text x=\"160\" y=\"12\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>downsample -&gt; upsample</text><rect x=\"20\" y=\"30.0\" width=\"40\" height=\"80\" rx=\"2\" class=\"boxa\"/><rect x=\"80\" y=\"40.0\" width=\"40\" height=\"60\" rx=\"2\" class=\"boxa\"/><rect x=\"140\" y=\"50.0\" width=\"40\" height=\"40\" rx=\"2\" class=\"boxr\"/><rect x=\"200\" y=\"40.0\" width=\"40\" height=\"60\" rx=\"2\" class=\"boxg\"/><rect x=\"260\" y=\"30.0\" width=\"40\" height=\"80\" rx=\"2\" class=\"boxg\"/><text x=\"70\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">pool / strided conv</text><text x=\"250\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">unpool / transposed conv</text></svg>", "h": "Shrink to understand, grow back to label every pixel."}, {"id": "Q51", "t": "RNN/LSTM", "q": "What are the four gates in an LSTM and what is its main purpose?", "a": "Purpose: remember long-term information in sequences without vanishing gradients.\ni (input gate): whether to write to the cell\nf (forget gate): whether to erase the cell\no (output gate): how much of the cell to reveal\ng (gate gate): what/how much to write to the cell", "f": "fixed", "d": "<svg class=\"dg\" viewBox=\"0 0 320 172\" role=\"img\"><line x1=\"10\" y1=\"30\" x2=\"310\" y2=\"30\" class=\"lng\"/><line x1=\"290\" y1=\"30\" x2=\"310\" y2=\"30\" class=\"lng\"/><polygon points=\"310,30 304.5973173858839,32.60979320466738 304.5973173858839,27.390206795332617\" class=\"ahg\"/><text x=\"20\" y=\"22\" text-anchor=\"start\" font-size=\"9\" class=\"\">c(t-1)</text><text x=\"300\" y=\"22\" text-anchor=\"end\" font-size=\"9\" class=\"\">c(t)</text><circle cx=\"100\" cy=\"30\" r=\"10\" class=\"boxr\"/><text x=\"100\" y=\"34\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><circle cx=\"190\" cy=\"30\" r=\"10\" class=\"boxa\"/><text x=\"190\" y=\"34\" text-anchor=\"middle\" font-size=\"10\" class=\"\">+</text><text x=\"160\" y=\"16\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">cell highway: no matrix multiply</text><rect x=\"83\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxr\"/><text x=\"100.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">f</text><text x=\"100\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">forget</text><rect x=\"148\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"165.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">i</text><text x=\"165\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">input</text><rect x=\"198\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"215.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">g</text><text x=\"215\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">gate</text><rect x=\"253\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"270.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">o</text><text x=\"270\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">output</text><line x1=\"100\" y1=\"80\" x2=\"100\" y2=\"40\" class=\"ln\"/><polyline points=\"165,80 165,60 190,60 190,40\" class=\"ln\"/><polyline points=\"215,80 215,60 190,60\" class=\"ln\"/><circle cx=\"190\" cy=\"60\" r=\"6\" class=\"box\"/><text x=\"190\" y=\"63\" text-anchor=\"middle\" font-size=\"8\" class=\"\">x</text><polyline points=\"250,30 250,55\" class=\"ln\"/><rect x=\"236\" y=\"46\" width=\"28\" height=\"16\" rx=\"4\" class=\"box\"/><text x=\"250.0\" y=\"56.45\" text-anchor=\"middle\" font-size=\"7\" class=\"\">tanh</text><polyline points=\"250,62 250,70 270,70 270,80\" class=\"ln\"/><circle cx=\"270\" cy=\"70\" r=\"6\" class=\"box\"/><text x=\"270\" y=\"73\" text-anchor=\"middle\" font-size=\"8\" class=\"\">x</text><line x1=\"276\" y1=\"70\" x2=\"296\" y2=\"70\" class=\"ln\"/><polygon points=\"296,70 290.5973173858839,72.60979320466738 290.5973173858839,67.39020679533262\" class=\"ah\"/><text x=\"300\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" class=\"\">h(t)</text><rect x=\"30\" y=\"132\" width=\"260\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"160.0\" y=\"144.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">inputs: h(t-1) and x(t)</text><line x1=\"100\" y1=\"132\" x2=\"100\" y2=\"106\" class=\"ln\"/><line x1=\"165\" y1=\"132\" x2=\"165\" y2=\"106\" class=\"ln\"/><line x1=\"215\" y1=\"132\" x2=\"215\" y2=\"106\" class=\"ln\"/><line x1=\"270\" y1=\"132\" x2=\"270\" y2=\"106\" class=\"ln\"/><text x=\"160\" y=\"166\" text-anchor=\"middle\" font-size=\"10\" class=\"\">c = f*c + i*g      h = o*tanh(c)</text></svg>", "h": "f erases, i decides to write, g is what to write, o decides what to show. Top line = gradient highway."}, {"id": "Q52", "t": "Attention/Transformers", "q": "What are the three ways of processing sequences, with a strength and weakness of each?", "a": "RNN: good at long sequences (h_T sees the whole sequence), but not parallelizable.\n1D convolution: highly parallel, but bad at long sequences (must stack many layers to see everything).\nSelf-attention: one layer lets every output see all inputs and is highly parallel, but very memory intensive.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 116\" role=\"img\"><text x=\"56\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>RNN</text><circle cx=\"20\" cy=\"70\" r=\"6\" class=\"boxa\"/><circle cx=\"44\" cy=\"70\" r=\"6\" class=\"boxa\"/><circle cx=\"68\" cy=\"70\" r=\"6\" class=\"boxa\"/><circle cx=\"92\" cy=\"70\" r=\"6\" class=\"boxa\"/><line x1=\"26\" y1=\"70\" x2=\"38\" y2=\"70\" class=\"ln\"/><polygon points=\"38,70 32.59731738588394,72.60979320466738 32.59731738588394,67.39020679533262\" class=\"ah\"/><line x1=\"50\" y1=\"70\" x2=\"62\" y2=\"70\" class=\"ln\"/><polygon points=\"62,70 56.59731738588394,72.60979320466738 56.59731738588394,67.39020679533262\" class=\"ah\"/><line x1=\"74\" y1=\"70\" x2=\"86\" y2=\"70\" class=\"ln\"/><polygon points=\"86,70 80.59731738588394,72.60979320466738 80.59731738588394,67.39020679533262\" class=\"ah\"/><text x=\"56\" y=\"96\" text-anchor=\"middle\" font-size=\"8\" class=\"good\">+ long seqs</text><text x=\"56\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">- sequential</text><text x=\"160\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>1D conv</text><circle cx=\"124\" cy=\"70\" r=\"6\" class=\"boxa\"/><circle cx=\"148\" cy=\"70\" r=\"6\" class=\"boxa\"/><circle cx=\"172\" cy=\"70\" r=\"6\" class=\"boxa\"/><circle cx=\"196\" cy=\"70\" r=\"6\" class=\"boxa\"/><line x1=\"124\" y1=\"64\" x2=\"136\" y2=\"36\" class=\"ln\"/><line x1=\"148\" y1=\"64\" x2=\"136\" y2=\"36\" class=\"ln\"/><line x1=\"148\" y1=\"64\" x2=\"160\" y2=\"36\" class=\"ln\"/><line x1=\"172\" y1=\"64\" x2=\"160\" y2=\"36\" class=\"ln\"/><line x1=\"172\" y1=\"64\" x2=\"184\" y2=\"36\" class=\"ln\"/><line x1=\"196\" y1=\"64\" x2=\"184\" y2=\"36\" class=\"ln\"/><circle cx=\"136\" cy=\"32\" r=\"5\" class=\"boxg\"/><circle cx=\"160\" cy=\"32\" r=\"5\" class=\"boxg\"/><circle cx=\"184\" cy=\"32\" r=\"5\" class=\"boxg\"/><text x=\"160\" y=\"96\" text-anchor=\"middle\" font-size=\"8\" class=\"good\">+ parallel</text><text x=\"160\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">- short reach</text><text x=\"264\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>self-attn</text><circle cx=\"228\" cy=\"70\" r=\"6\" class=\"boxa\"/><circle cx=\"252\" cy=\"70\" r=\"6\" class=\"boxa\"/><circle cx=\"276\" cy=\"70\" r=\"6\" class=\"boxa\"/><circle cx=\"300\" cy=\"70\" r=\"6\" class=\"boxa\"/><path d=\"M228,64 Q240,34 252,64\" class=\"lnf\"/><path d=\"M228,64 Q252,28 276,64\" class=\"lnf\"/><path d=\"M228,64 Q264,22 300,64\" class=\"lnf\"/><path d=\"M252,64 Q264,34 276,64\" class=\"lnf\"/><path d=\"M252,64 Q276,28 300,64\" class=\"lnf\"/><path d=\"M276,64 Q288,34 300,64\" class=\"lnf\"/><text x=\"264\" y=\"96\" text-anchor=\"middle\" font-size=\"8\" class=\"good\">+ sees all, parallel</text><text x=\"264\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">- memory hungry</text></svg>", "h": "RNN = relay race, conv = local window, attention = everyone sees everyone."}, {"id": "Q53", "t": "Detection & Segmentation", "q": "Differences between semantic and instance segmentation?", "a": "Semantic: labels every pixel by class, does not separate objects of the same class (two touching cows = one cow region), includes background like sky/grass.\nInstance: detects each object and gives it its own mask, separating instances (cow 1 vs cow 2), focuses on countable objects.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 116\" role=\"img\"><rect x=\"8\" y=\"20\" width=\"70\" height=\"60\" rx=\"2\" class=\"box\"/><text x=\"43\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>classify</text><text x=\"43\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">CAT</text><circle cx=\"43\" cy=\"50\" r=\"14\" class=\"boxa\"/><text x=\"43\" y=\"54\" text-anchor=\"middle\" font-size=\"8\" class=\"\">CAT</text><rect x=\"86\" y=\"20\" width=\"70\" height=\"60\" rx=\"2\" class=\"box\"/><text x=\"121\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>semantic seg</text><text x=\"121\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">per pixel</text><rect x=\"86\" y=\"60\" width=\"70\" height=\"20\" rx=\"0\" class=\"boxg\"/><polygon points=\"101,60 111,35 131,35 141,60\" class=\"boxa\"/><polygon points=\"91,60 98,45 106,60\" class=\"boxa\"/><rect x=\"164\" y=\"20\" width=\"70\" height=\"60\" rx=\"2\" class=\"box\"/><text x=\"199\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>detection</text><text x=\"199\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">boxes</text><rect x=\"172\" y=\"30\" width=\"28\" height=\"40\" rx=\"1\" class=\"boxi\"/><rect x=\"202\" y=\"40\" width=\"26\" height=\"32\" rx=\"1\" class=\"boxi\"/><rect x=\"242\" y=\"20\" width=\"70\" height=\"60\" rx=\"2\" class=\"box\"/><text x=\"277\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>instance seg</text><text x=\"277\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">masks</text><polygon points=\"252,70 262,35 272,70\" class=\"boxa\"/><polygon points=\"282,72 294,42 306,72\" class=\"boxr\"/></svg>", "h": "Semantic: color every pixel (cows merge). Instance: each cow gets its own color."}, {"id": "Q54", "t": "Backprop", "q": "What can biological neurons do that artificial neurons cannot?", "a": "Many different types of neurons; dendrites perform complex nonlinear computations; synapses are complex nonlinear dynamical systems, not a single weight; complex connectivity patterns rather than neat layers.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 126\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Biological</text><path d=\"M20,50 L50,40 M20,30 L50,40 M25,65 L50,40\" class=\"ln\"/><circle cx=\"65\" cy=\"40\" r=\"14\" class=\"boxa\"/><text x=\"65\" y=\"44\" text-anchor=\"middle\" font-size=\"8\" class=\"\">body</text><line x1=\"79\" y1=\"40\" x2=\"140\" y2=\"40\" class=\"ln\"/><text x=\"110\" y=\"32\" text-anchor=\"middle\" font-size=\"9\" class=\"\">axon</text><text x=\"30\" y=\"85\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">dendrites</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Artificial</text><rect x=\"165\" y=\"22\" width=\"40\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"185.0\" y=\"33.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">x1 w1</text><rect x=\"165\" y=\"46\" width=\"40\" height=\"18\" rx=\"4\" class=\"box\"/><text x=\"185.0\" y=\"57.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">x2 w2</text><line x1=\"205\" y1=\"31\" x2=\"228\" y2=\"40\" class=\"ln\"/><polygon points=\"228,40 222.01778388085197,40.461617053200484 223.91979776827324,35.60091489645721\" class=\"ah\"/><line x1=\"205\" y1=\"55\" x2=\"228\" y2=\"44\" class=\"ln\"/><polygon points=\"228,44 224.25206475015034,48.685400875371755 222.0000455001896,43.97663335272654\" class=\"ah\"/><circle cx=\"242\" cy=\"42\" r=\"13\" class=\"boxa\"/><text x=\"242\" y=\"46\" text-anchor=\"middle\" font-size=\"8\" class=\"\">sum</text><line x1=\"255\" y1=\"42\" x2=\"272\" y2=\"42\" class=\"ln\"/><polygon points=\"272,42 266.5973173858839,44.60979320466738 266.5973173858839,39.39020679533262\" class=\"ah\"/><rect x=\"274\" y=\"32\" width=\"40\" height=\"20\" rx=\"4\" class=\"box\"/><text x=\"294.0\" y=\"45.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">f()</text><text x=\"160\" y=\"108\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">real neurons: many types, nonlinear dendrites,</text><text x=\"160\" y=\"120\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">synapses are dynamical systems, not 1 weight</text></svg>", "h": "Be careful with brain analogies: a real synapse is not one number."}, {"id": "Q55", "t": "RNN/LSTM", "q": "Give an example of one-to-one, one-to-many, many-to-one, and many-to-many problems for an RNN.", "a": "One-to-one: image classification.\nOne-to-many: image captioning.\nMany-to-one: video classification (sequence of frames to one label) or sentiment.\nMany-to-many: machine translation, or per-frame video classification.", "f": "fixed", "d": "<svg class=\"dg\" viewBox=\"0 0 320 134\" role=\"img\"><text x=\"43\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>one-to-one</text><rect x=\"32\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><rect x=\"32\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"40\" y1=\"84\" x2=\"40\" y2=\"61\" class=\"ln\"/><polygon points=\"40,61 42.60979320466738,66.40268261411606 37.39020679533262,66.40268261411606\" class=\"ah\"/><rect x=\"32\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"40\" y1=\"47\" x2=\"40\" y2=\"33\" class=\"ln\"/><polygon points=\"40,33 42.60979320466738,38.40268261411606 37.39020679533262,38.40268261411606\" class=\"ah\"/><text x=\"43\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">image class.</text><text x=\"121\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>one-to-many</text><rect x=\"86\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"102\" y1=\"54\" x2=\"110\" y2=\"54\" class=\"ln\"/><polygon points=\"110,54 104.59731738588394,56.60979320466738 104.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"86\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"94\" y1=\"84\" x2=\"94\" y2=\"61\" class=\"ln\"/><polygon points=\"94,61 96.60979320466738,66.40268261411606 91.39020679533262,66.40268261411606\" class=\"ah\"/><rect x=\"86\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"94\" y1=\"47\" x2=\"94\" y2=\"33\" class=\"ln\"/><polygon points=\"94,33 96.60979320466738,38.40268261411606 91.39020679533262,38.40268261411606\" class=\"ah\"/><rect x=\"110\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"126\" y1=\"54\" x2=\"134\" y2=\"54\" class=\"ln\"/><polygon points=\"134,54 128.59731738588394,56.60979320466738 128.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"110\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"118\" y1=\"47\" x2=\"118\" y2=\"33\" class=\"ln\"/><polygon points=\"118,33 120.60979320466738,38.40268261411606 115.39020679533262,38.40268261411606\" class=\"ah\"/><rect x=\"134\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><rect x=\"134\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"142\" y1=\"47\" x2=\"142\" y2=\"33\" class=\"ln\"/><polygon points=\"142,33 144.60979320466737,38.40268261411606 139.39020679533263,38.40268261411606\" class=\"ah\"/><text x=\"121\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">captioning</text><text x=\"199\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>many-to-one</text><rect x=\"164\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"180\" y1=\"54\" x2=\"188\" y2=\"54\" class=\"ln\"/><polygon points=\"188,54 182.59731738588394,56.60979320466738 182.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"164\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"172\" y1=\"84\" x2=\"172\" y2=\"61\" class=\"ln\"/><polygon points=\"172,61 174.60979320466737,66.40268261411606 169.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"188\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"204\" y1=\"54\" x2=\"212\" y2=\"54\" class=\"ln\"/><polygon points=\"212,54 206.59731738588394,56.60979320466738 206.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"188\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"196\" y1=\"84\" x2=\"196\" y2=\"61\" class=\"ln\"/><polygon points=\"196,61 198.60979320466737,66.40268261411606 193.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"212\" y=\"48\" width=\"16\"

height=\"12\" rx=\"2\" class=\"boxa\"/><rect x=\"212\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"220\" y1=\"84\" x2=\"220\" y2=\"61\" class=\"ln\"/><polygon points=\"220,61 222.60979320466737,66.40268261411606 217.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"212\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"220\" y1=\"47\" x2=\"220\" y2=\"33\" class=\"ln\"/><polygon points=\"220,33 222.60979320466737,38.40268261411606 217.39020679533263,38.40268261411606\" class=\"ah\"/><text x=\"199\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">video class.</text><text x=\"277\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>many-to-many</text><rect x=\"242\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"258\" y1=\"54\" x2=\"266\" y2=\"54\" class=\"ln\"/><polygon points=\"266,54 260.5973173858839,56.60979320466738 260.5973173858839,51.39020679533262\" class=\"ah\"/><rect x=\"242\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"250\" y1=\"84\" x2=\"250\" y2=\"61\" class=\"ln\"/><polygon points=\"250,61 252.60979320466737,66.40268261411606 247.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"242\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"250\" y1=\"47\" x2=\"250\" y2=\"33\" class=\"ln\"/><polygon points=\"250,33 252.60979320466737,38.40268261411606 247.39020679533263,38.40268261411606\" class=\"ah\"/><rect x=\"266\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><line x1=\"282\" y1=\"54\" x2=\"290\" y2=\"54\" class=\"ln\"/><polygon points=\"290,54 284.5973173858839,56.60979320466738 284.5973173858839,51.39020679533262\" class=\"ah\"/><rect x=\"266\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"274\" y1=\"84\" x2=\"274\" y2=\"61\" class=\"ln\"/><polygon points=\"274,61 276.60979320466737,66.40268261411606 271.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"266\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"274\" y1=\"47\" x2=\"274\" y2=\"33\" class=\"ln\"/><polygon points=\"274,33 276.60979320466737,38.40268261411606 271.39020679533263,38.40268261411606\" class=\"ah\"/><rect x=\"290\" y=\"48\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxa\"/><rect x=\"290\" y=\"84\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxr\"/><line x1=\"298\" y1=\"84\" x2=\"298\" y2=\"61\" class=\"ln\"/><polygon points=\"298,61 300.60979320466737,66.40268261411606 295.39020679533263,66.40268261411606\" class=\"ah\"/><rect x=\"290\" y=\"20\" width=\"16\" height=\"12\" rx=\"2\" class=\"boxg\"/><line x1=\"298\" y1=\"47\" x2=\"298\" y2=\"33\" class=\"ln\"/><polygon points=\"298,33 300.60979320466737,38.40268261411606 295.39020679533263,38.40268261411606\" class=\"ah\"/><text x=\"277\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">translation</text><text x=\"160\" y=\"128\" text-anchor=\"middle\" font-size=\"8\" class=\"\">red = input   blue = hidden   green = output</text></svg>", "h": "Count the arrows in and out: captioning = 1 in, many out; video label = many in, 1 out."}, {"id": "Q56", "t": "Loss", "q": "Given scores s = f(x, W), compute the SVM loss. (Slide example: cat 3.2/1.3/2.2, car 5.1/4.9/2.5, frog -1.7/2.0/-3.1 for the cat, car, frog images.)", "a": "L_i = sum over wrong classes j of max(0, s_j - s_correct + 1).\nCat image: max(0, 5.1-3.2+1) + max(0, -1.7-3.2+1) = 2.9 + 0 = 2.9\nCar image: max(0, 1.3-4.9+1) + max(0, 2.0-4.9+1) = 0\nFrog image: max(0, 2.2+3.1+1) + max(0, 2.5+3.1+1) = 6.3 + 6.6 = 12.9\nTotal loss = average = (2.9 + 0 + 12.9)/3 = 5.27", "f": "filled", "d": "<svg class=\"dg\" viewBox=\"0 0 320 154\" role=\"img\"><text x=\"160\" y=\"13\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Cat image: correct class = cat (3.2)</text><line x1=\"20\" y1=\"70\" x2=\"300\" y2=\"70\" class=\"ln\"/><line x1=\"20\" y1=\"66\" x2=\"20\" y2=\"74\" class=\"ln\"/><text x=\"20\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">-2</text><line x1=\"55\" y1=\"66\" x2=\"55\" y2=\"74\" class=\"ln\"/><text x=\"55\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">-1</text><line x1=\"90\" y1=\"66\" x2=\"90\" y2=\"74\" class=\"ln\"/><text x=\"90\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">0</text><line x1=\"125\" y1=\"66\" x2=\"125\" y2=\"74\" class=\"ln\"/><text x=\"125\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">1</text><line x1=\"160\" y1=\"66\" x2=\"160\" y2=\"74\" class=\"ln\"/><text x=\"160\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">2</text><line x1=\"195\" y1=\"66\" x2=\"195\" y2=\"74\" class=\"ln\"/><text x=\"195\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">3</text><line x1=\"230\" y1=\"66\" x2=\"230\" y2=\"74\" class=\"ln\"/><text x=\"230\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">4</text><line x1=\"265\" y1=\"66\" x2=\"265\" y2=\"74\" class=\"ln\"/><text x=\"265\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">5</text><line x1=\"300\" y1=\"66\" x2=\"300\" y2=\"74\" class=\"ln\"/><text x=\"300\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">6</text><rect x=\"167.0\" y=\"50\" width=\"133.0\" height=\"14\" rx=\"2\" class=\"boxr\"/><text x=\"233.5\" y=\"44\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">danger zone: above 3.2 - 1 = 2.2</text><circle cx=\"202.0\" cy=\"70\" r=\"6\" class=\"good\"/><circle cx=\"268.5\" cy=\"70\" r=\"6\" class=\"bad\"/><circle cx=\"30.5\" cy=\"70\" r=\"6\" class=\"acc\"/><text x=\"30.5\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">frog -1.7</text><text x=\"30.5\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">safe: 0</text><text x=\"190.0\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">cat 3.2</text><text x=\"190.0\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">correct</text><text x=\"280.5\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">car 5.1</text><text x=\"280.5\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">pays 2.9</text><text x=\"160\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" class=\"\">loss = 2.9 + 0 = 2.9 (car img 0, frog img 12.9)</text><text x=\"160\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">overall = (2.9 + 0 + 12.9) / 3 = 5.27</text></svg>", "h": "Correct must win by 1. Penalty = how far each wrong class gets into the danger zone."}, {"id": "Q57", "t": "Training", "q": "Explain overfitting and underfitting, with a fix for each.", "a": "Overfitting: the model fits (memorizes) the training data including noise and does poorly on new data. Fix: regularization (L2, dropout), more data/augmentation.\nUnderfitting: the model does poorly on both training and validation data. Fix: bigger model (more layers/params) or train longer.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 138\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Overfitting</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Underfitting</text><line x1=\"15\" y1=\"90\" x2=\"150\" y2=\"90\" class=\"ln\"/><line x1=\"15\" y1=\"90\" x2=\"15\" y2=\"20\" class=\"ln\"/><line x1=\"175\" y1=\"90\" x2=\"310\" y2=\"90\" class=\"ln\"/><line x1=\"175\" y1=\"90\" x2=\"175\" y2=\"20\" class=\"ln\"/><path d=\"M15,85 Q50,30 145,25\" class=\"lng\"/><path d=\"M15,85 Q50,50 145,60\" class=\"lnr\"/><text x=\"110\" y=\"34\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">train</text><text x=\"130\" y=\"72\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">val</text><line x1=\"140\" y1=\"28\" x2=\"140\" y2=\"58\" class=\"lnd\"/><text x=\"110\" y=\"45\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">big gap</text><path d=\"M175,85 Q210,65 305,62\" class=\"lng\"/><path d=\"M175,86 Q210,70 305,66\" class=\"lnr\"/><text x=\"290\" y=\"55\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">both low</text><text x=\"80\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fix: regularize,</text><text x=\"80\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">more data</text><text x=\"240\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fix: bigger model,</text><text x=\"240\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">train longer</text><text x=\"80\" y=\"132\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">(accuracy curves)</text><text x=\"240\" y=\"132\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">(no gap, both bad)</text></svg>", "h": "Gap = overfit. No gap but bad = underfit."}, {"id": "Q58", "t": "CNN layers", "q": "Given input channels, height/width, number of filters, kernel, stride, and padding, find the output shape and parameter count.", "a": "Output H' = (H - K + 2P)/S + 1 (same for W). Output channels = number of filters.\nParams = Cout x (Cin x K x K + 1).\nExample: 3x32x32 input, 10 filters 5x5, stride 1, pad 2: (32 - 5 + 4)/1 + 1 = 32, so 10x32x32. Params = 10 x (3*5*5 + 1) = 760.", "f": "filled", "d": "<svg class=\"dg\" viewBox=\"0 0 320 152\" role=\"img\"><text x=\"70\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>input 5x5, filter 3x3</text><rect x=\"10\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"28\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"46\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"64\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"82\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"10\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"28\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"46\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"64\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"82\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"10\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"28\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"46\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"64\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"82\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"10\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"28\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"46\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"64\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"82\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"10\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"28\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"46\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"64\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"82\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><line x1=\"110\" y1=\"67\" x2=\"150\" y2=\"67\" class=\"ln\"/><polygon points=\"150,67 144.59731738588394,69.60979320466738 144.59731738588394,64.39020679533262\" class=\"ah\"/><text x=\"130\" y=\"60\" text-anchor=\"middle\" font-size=\"9\" class=\"\">dot</text><text x=\"220\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>output 3x3</text><rect x=\"160\" y=\"31\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><rect x=\"182\" y=\"31\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"204\" y=\"31\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"160\" y=\"53\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"182\" y=\"53\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"204\" y=\"53\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"160\" y=\"75\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"182\" y=\"75\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"204\" y=\"75\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"160\" y=\"130\" text-anchor=\"middle\" font-size=\"10\" class=\"\">H&#x27; = (H - K + 2P) / S + 1 = (5 - 3 + 0)/1 + 1 = 3</text><text x=\"160\" y=\"146\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">params = Cout x (Cin x K x K + 1)</text></svg>", "h": "(H - K + 2P)/S + 1. Params: each filter is Cin x K x K, plus 1 bias."}, {"id": "Q59", "t": "Attention/Transformers", "q": "What are the query, key, and value in self-attention?", "a": "Each input vector is projected three ways: query Q = X W_Q (what it's looking for), key K = X W_K (what it offers to match against), value V = X W_V (what it contributes). Scores = Q K^T / sqrt(D_Q), weights = softmax, output = weights x V.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 134\" role=\"img\"><rect x=\"5\" y=\"40\" width=\"40\" height=\"40\" rx=\"4\" class=\"box\"/><text x=\"25.0\" y=\"57.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">X</text><text x=\"25.0\" y=\"68.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">N x D</text><line x1=\"45\" y1=\"60\" x2=\"70\" y2=\"22\" class=\"ln\"/><polygon points=\"70,22 69.21086230734612,27.94787875650075 64.85033065873954,25.07910793504906\" class=\"ah\"/><rect x=\"72\" y=\"10\" width=\"30\" height=\"24\" rx=\"4\" class=\"boxa\"/><text x=\"87.0\" y=\"25.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">Q</text><line x1=\"45\" y1=\"60\" x2=\"70\" y2=\"60\" class=\"ln\"/><polygon points=\"70,60 64.59731738588394,62.60979320466738 64.59731738588394,57.39020679533262\" class=\"ah\"/><rect x=\"72\" y=\"48\" width=\"30\" height=\"24\" rx=\"4\" class=\"boxg\"/><text x=\"87.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">K</text><line x1=\"45\" y1=\"60\" x2=\"70\" y2=\"98\" class=\"ln\"/><polygon points=\"70,98 64.85033065873954,94.92089206495095 69.21086230734612,92.05212124349924\" class=\"ah\"/><rect x=\"72\" y=\"86\" width=\"30\" height=\"24\" rx=\"4\" class=\"boxr\"/><text x=\"87.0\" y=\"101.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">V</text><line x1=\"102\" y1=\"22\" x2=\"125\" y2=\"45\" class=\"ln\"/><polygon points=\"125,45 119.33432401444499,43.02512895947475 123.02512895947474,39.334324014444995\" class=\"ah\"/><line x1=\"102\" y1=\"60\" x2=\"125\" y2=\"52\" class=\"ln\"/><polygon points=\"125,52 120.75455447191214,56.2398339906226 119.03981268278251,51.30995134687492\" class=\"ah\"/><rect x=\"127\" y=\"32\" width=\"70\" height=\"34\" rx=\"4\" class=\"boxa\"/><text x=\"162.0\" y=\"46.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">QK^T / sqrt d</text><text x=\"162.0\" y=\"56.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">N x N</text><line x1=\"197\" y1=\"49\" x2=\"212\" y2=\"49\" class=\"ln\"/><polygon points=\"212,49 206.59731738588394,51.60979320466738 206.59731738588394,46.39020679533262\" class=\"ah\"/><rect x=\"214\" y=\"36\" width=\"46\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"237.0\" y=\"51.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">softmax</text><line x1=\"260\" y1=\"49\" x2=\"272\" y2=\"49\" class=\"ln\"/><polygon points=\"272,49 266.5973173858839,51.60979320466738 266.5973173858839,46.39020679533262\" class=\"ah\"/><line x1=\"102\" y1=\"98\" x2=\"280\" y2=\"64\" class=\"lnf\"/><polygon points=\"280,64 275.1829064907683,67.57709520747181 274.2036117222575,62.45019906644462\" class=\"ah\"/><rect x=\"274\" y=\"36\" width=\"42\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"295.0\" y=\"51.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">Y = AV</text><text x=\"160\" y=\"128\" text-anchor=\"middle\" font-size=\"9\" class=\"\">each token: query asks, key matches, value is what it gives</text></svg>", "h": "Q asks, K matches, V answers. Divide by sqrt(d) so softmax doesn't saturate."}, {"id": "Q60", "t": "Training", "q": "Why does weight initialization matter, and what's the difference between Xavier and He (Kaiming) init?", "a": "Too small: activations and gradients shrink to zero in deep nets. Too large: activations saturate (tanh) and gradients die. All zeros: no symmetry breaking.\nXavier: std = 1/sqrt(D_in), keeps activations well scaled for tanh.\nHe/Kaiming: std = sqrt(2/D_in), corrects for ReLU zeroing half the activations.\n(For conv, D_in = K x K x Cin.)", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 138\" role=\"img\"><text x=\"8\" y=\"14\" text-anchor=\"start\" font-size=\"9\" class=\"\" font-weight=600>std too small</text><line x1=\"95\" y1=\"32\" x2=\"225\" y2=\"32\" class=\"ln\"/><rect x=\"97\" y=\"32\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"107\" y=\"32\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"117\" y=\"32\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"127\" y=\"32\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"137\" y=\"30\" width=\"8\" height=\"2\" rx=\"1\" class=\"boxr\"/><rect x=\"147\" y=\"10\" width=\"8\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"157\" y=\"10\" width=\"8\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"167\" y=\"30\" width=\"8\" height=\"2\" rx=\"1\" class=\"boxr\"/><rect x=\"177\" y=\"32\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"187\" y=\"32\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"197\" y=\"32\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"207\" y=\"32\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><text x=\"232\" y=\"24\" text-anchor=\"start\" font-size=\"9\" class=\"bad\">all near 0:</text><text x=\"232\" y=\"36\" text-anchor=\"start\" font-size=\"9\" class=\"bad\">no learning</text><text x=\"8\" y=\"52\" text-anchor=\"start\" font-size=\"9\" class=\"\" font-weight=600>std too big</text><line x1=\"95\" y1=\"70\" x2=\"225\" y2=\"70\" class=\"ln\"/><rect x=\"97\" y=\"48\" width=\"8\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"107\" y=\"68\" width=\"8\" height=\"2\" rx=\"1\" class=\"boxr\"/><rect x=\"117\" y=\"70\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"127\" y=\"70\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"137\" y=\"70\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"147\" y=\"70\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"157\" y=\"70\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"167\" y=\"70\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"177\" y=\"70\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"187\" y=\"70\" width=\"8\" height=\"0\" rx=\"1\" class=\"boxr\"/><rect x=\"197\" y=\"68\" width=\"8\" height=\"2\" rx=\"1\" class=\"boxr\"/><rect x=\"207\" y=\"48\" width=\"8\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"232\" y=\"62\" text-anchor=\"start\" font-size=\"9\" class=\"bad\">saturate</text><text x=\"232\" y=\"74\" text-anchor=\"start\" font-size=\"9\" class=\"bad\">at -1 / +1</text><text x=\"8\" y=\"90\" text-anchor=\"start\" font-size=\"9\" class=\"\" font-weight=600>Xavier / He</text><line x1=\"95\" y1=\"108\" x2=\"225\" y2=\"108\" class=\"ln\"/><rect x=\"97\" y=\"106\" width=\"8\" height=\"2\" rx=\"1\" class=\"boxg\"/><rect x=\"107\" y=\"103\" width=\"8\" height=\"5\" rx=\"1\" class=\"boxg\"/><rect x=\"117\" y=\"99\" width=\"8\" height=\"9\" rx=\"1\" class=\"boxg\"/><rect x=\"127\" y=\"95\" width=\"8\" height=\"13\" rx=\"1\" class=\"boxg\"/><rect x=\"137\" y=\"92\" width=\"8\" height=\"16\" rx=\"1\" class=\"boxg\"/><rect x=\"147\" y=\"90\" width=\"8\" height=\"18\" rx=\"1\" class=\"boxg\"/><rect x=\"157\" y=\"90\" width=\"8\" height=\"18\" rx=\"1\" class=\"boxg\"/><rect x=\"167\" y=\"92\" width=\"8\" height=\"16\" rx=\"1\" class=\"boxg\"/><rect x=\"177\" y=\"95\" width=\"8\" height=\"13\" rx=\"1\" class=\"boxg\"/><rect x=\"187\" y=\"99\" width=\"8\" height=\"9\" rx=\"1\" class=\"boxg\"/><rect x=\"197\" y=\"103\" width=\"8\" height=\"5\" rx=\"1\" class=\"boxg\"/><rect x=\"207\" y=\"106\" width=\"8\" height=\"2\" rx=\"1\" class=\"boxg\"/><text x=\"232\" y=\"100\" text-anchor=\"start\" font-size=\"9\" class=\"good\">nicely spread</text><text x=\"160\" y=\"132\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">Xavier std = 1/sqrt(Din)    He std = sqrt(2/Din) (ReLU)</text></svg>", "h": "He has the 2 because ReLU kills half the activations."}, {"id": "Q61", "t": "Training", "q": "Why do we normalize/standardize inputs before training?", "a": "Zero-mean, unit-variance inputs make the loss much less sensitive to small changes in the weights, so it's easier to optimize. If inputs are all positive, gradients on the weights all have the same sign, causing zig-zag updates.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><circle cx=\"127.37410169338212\" cy=\"42.253609677821885\" r=\"3\" class=\"bad\"/><circle cx=\"137.7116139339418\" cy=\"48.27350851331151\" r=\"3\" class=\"bad\"/><circle cx=\"134.39391448439585\" cy=\"47.66974989996251\" r=\"3\" class=\"bad\"/><circle cx=\"91.74031369701689\" cy=\"33.968679631343164\" r=\"3\" class=\"bad\"/><circle cx=\"146.60140301989884\" cy=\"39.46923659410773\" r=\"3\" class=\"bad\"/><circle cx=\"144.05402950503736\" cy=\"23.396178939594332\" r=\"3\" class=\"bad\"/><circle cx=\"118.14414286692983\" cy=\"27.397184978594908\" r=\"3\" class=\"bad\"/><circle cx=\"122.62565155415582\" cy=\"37.21823563784302\" r=\"3\" class=\"bad\"/><circle cx=\"90.78685137533414\" cy=\"26.501894013915447\" r=\"3\" class=\"bad\"/><circle cx=\"106.76894196066662\" cy=\"47.49036115425656\" r=\"3\" class=\"bad\"/><circle cx=\"135.9435270977485\" cy=\"24.788126370741146\" r=\"3\" class=\"bad\"/><circle cx=\"137.82881948587226\" cy=\"24.163022551967096\" r=\"3\" class=\"bad\"/><circle cx=\"127.04715122796699\" cy=\"23.800976976508093\" r=\"3\" class=\"bad\"/><circle cx=\"90.10649173215208\" cy=\"46.14214234172846\" r=\"3\" class=\"bad\"/><line x1=\"10\" y1=\"90\" x2=\"160\" y2=\"90\" class=\"ln\"/><line x1=\"20\" y1=\"100\" x2=\"20\" y2=\"10\" class=\"ln\"/><text x=\"110\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">raw: off-center</text><line x1=\"160\" y1=\"50\" x2=\"185\" y2=\"50\" class=\"ln\"/><polygon points=\"185,50 179.59731738588394,52.60979320466738 179.59731738588394,47.39020679533262\" class=\"ah\"/><line x1=\"190\" y1=\"60\" x2=\"310\" y2=\"60\" class=\"ln\"/><line x1=\"250\" y1=\"110\" x2=\"250\" y2=\"10\" class=\"ln\"/><circle cx=\"241.28369147485353\" cy=\"51.464435076741964\" r=\"3\" class=\"acc\"/><circle cx=\"264.47263326477776\" cy=\"71.17223296310405\" r=\"3\" class=\"acc\"/><circle cx=\"243.6791550324078\" cy=\"73.8443396685025\" r=\"3\" class=\"acc\"/><circle cx=\"251.17670406612433\" cy=\"65.33491431751777\" r=\"3\" class=\"acc\"/><circle cx=\"241.14338543601377\" cy=\"73.22928003263996\" r=\"3\" class=\"acc\"/><circle cx=\"255.71925823320726\" cy=\"73.99692936951587\" r=\"3\" class=\"acc\"/><circle cx=\"261.81225032729435\" cy=\"53.96366693561603\" r=\"3\" class=\"acc\"/><circle cx=\"245.83569804167152\" cy=\"49.97868171389237\" r=\"3\" class=\"acc\"/><circle cx=\"239.37105728622046\" cy=\"46.954191401270286\" r=\"3\" class=\"acc\"/><circle cx=\"244.0407730230839\" cy=\"63.09329992222963\" r=\"3\" class=\"acc\"/><circle cx=\"235.1014935812307\" cy=\"65.33802748643073\" r=\"3\" class=\"acc\"/><circle cx=\"245.13690584883597\" cy=\"54.298737948093866\" r=\"3\" class=\"acc\"/><circle cx=\"259.55554223941215\" cy=\"59.42235559890117\" r=\"3\" class=\"acc\"/><circle cx=\"244.47379317539333\" cy=\"59.43655158710592\" r=\"3\" class=\"acc\"/><text x=\"250\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">zero mean, unit variance</text><text x=\"110\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"\">subtract mean, divide std</text></svg>", "h": "Center it and scale it, so one learning rate fits all weights."}, {"id": "Q62", "t": "Basics/KNN/Linear", "q": "In 3-nearest neighbors, the three closest training samples are Cat, Dog, Cat. Prediction?", "a": "Cat, by majority vote (2 of 3).", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 124\" role=\"img\"><circle cx=\"160\" cy=\"60\" r=\"6\" class=\"acc\"/><text x=\"160\" y=\"64\" text-anchor=\"middle\" font-size=\"9\" class=\"\">?</text><circle cx=\"160\" cy=\"60\" r=\"44\" class=\"ring\"/><circle cx=\"135\" cy=\"45\" r=\"9\" class=\"boxa\"/><text x=\"135\" y=\"49\" text-anchor=\"middle\" font-size=\"9\" class=\"\">C</text><circle cx=\"185\" cy=\"70\" r=\"9\" class=\"boxa\"/><text x=\"185\" y=\"74\" text-anchor=\"middle\" font-size=\"9\" class=\"\">C</text><circle cx=\"170\" cy=\"30\" r=\"9\" class=\"boxr\"/><text x=\"170\" y=\"34\" text-anchor=\"middle\" font-size=\"9\" class=\"\">D</text><circle cx=\"60\" cy=\"30\" r=\"9\" class=\"boxr\"/><text x=\"60\" y=\"34\" text-anchor=\"middle\" font-size=\"9\" class=\"\">D</text><circle cx=\"250\" cy=\"95\" r=\"9\" class=\"boxa\"/><text x=\"250\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" class=\"\">C</text><circle cx=\"60\" cy=\"95\" r=\"9\" class=\"boxr\"/><text x=\"60\" y=\"99\" text-anchor=\"middle\" font-size=\"9\" class=\"\">D</text><circle cx=\"270\" cy=\"25\" r=\"9\" class=\"boxr\"/><text x=\"270\" y=\"29\" text-anchor=\"middle\" font-size=\"9\" class=\"\">D</text><text x=\"160\" y=\"118\" text-anchor=\"middle\" font-size=\"11\" class=\"good\">3 nearest: C, C, D  -&gt;  vote = Cat</text></svg>", "h": "K neighbors vote. Majority wins."}, {"id": "Q63", "t": "Attention/Transformers", "q": "Why does a Transformer use positional encodings?", "a": "Self-attention is permutation equivariant: it doesn't know the order of its inputs. Positional encodings (learned or fixed) are added/concatenated to tell the model where each token is.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 114\" role=\"img\"><rect x=\"20\" y=\"20\" width=\"60\" height=\"22\" rx=\"4\" class=\"boxa\"/><text x=\"50.0\" y=\"34.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">the</text><text x=\"50\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><rect x=\"20\" y=\"64\" width=\"60\" height=\"22\" rx=\"4\" class=\"boxg\"/><text x=\"50.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">pos E(1)</text><rect x=\"110\" y=\"20\" width=\"60\" height=\"22\" rx=\"4\" class=\"boxa\"/><text x=\"140.0\" y=\"34.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">cat</text><text x=\"140\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><rect x=\"110\" y=\"64\" width=\"60\" height=\"22\" rx=\"4\" class=\"boxg\"/><text x=\"140.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">pos E(2)</text><rect x=\"200\" y=\"20\" width=\"60\" height=\"22\" rx=\"4\" class=\"boxa\"/><text x=\"230.0\" y=\"34.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">sat</text><text x=\"230\" y=\"58\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><rect x=\"200\" y=\"64\" width=\"60\" height=\"22\" rx=\"4\" class=\"boxg\"/><text x=\"230.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">pos E(3)</text><text x=\"160\" y=\"108\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">attention alone ignores order: add position info</text></svg>", "h": "Without positions, 'cat sat the' looks the same as 'the cat sat'."}, {"id": "Q64", "t": "RNN/LSTM", "q": "What two states does a standard LSTM pass to the next time step?", "a": "The hidden state h_t (the output) and the cell state c_t (long-term memory).", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 172\" role=\"img\"><line x1=\"10\" y1=\"30\" x2=\"310\" y2=\"30\" class=\"lng\"/><line x1=\"290\" y1=\"30\" x2=\"310\" y2=\"30\" class=\"lng\"/><polygon points=\"310,30 304.5973173858839,32.60979320466738 304.5973173858839,27.390206795332617\" class=\"ahg\"/><text x=\"20\" y=\"22\" text-anchor=\"start\" font-size=\"9\" class=\"\">c(t-1)</text><text x=\"300\" y=\"22\" text-anchor=\"end\" font-size=\"9\" class=\"\">c(t)</text><circle cx=\"100\" cy=\"30\" r=\"10\" class=\"boxr\"/><text x=\"100\" y=\"34\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><circle cx=\"190\" cy=\"30\" r=\"10\" class=\"boxa\"/><text x=\"190\" y=\"34\" text-anchor=\"middle\" font-size=\"10\" class=\"\">+</text><text x=\"160\" y=\"16\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">cell highway: no matrix multiply</text><rect x=\"83\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxr\"/><text x=\"100.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">f</text><text x=\"100\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">forget</text><rect x=\"148\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"165.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">i</text><text x=\"165\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">input</text><rect x=\"198\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"215.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">g</text><text x=\"215\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">gate</text><rect x=\"253\" y=\"80\" width=\"34\" height=\"26\" rx=\"4\" class=\"boxa\"/><text x=\"270.0\" y=\"96.85\" text-anchor=\"middle\" font-size=\"11\" class=\"\">o</text><text x=\"270\" y=\"120\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">output</text><line x1=\"100\" y1=\"80\" x2=\"100\" y2=\"40\" class=\"ln\"/><polyline points=\"165,80 165,60 190,60 190,40\" class=\"ln\"/><polyline points=\"215,80 215,60 190,60\" class=\"ln\"/><circle cx=\"190\" cy=\"60\" r=\"6\" class=\"box\"/><text x=\"190\" y=\"63\" text-anchor=\"middle\" font-size=\"8\" class=\"\">x</text><polyline points=\"250,30 250,55\" class=\"ln\"/><rect x=\"236\" y=\"46\" width=\"28\" height=\"16\" r <text x=\"296.0\" y=\"41.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">-ln(0.13)</text><text x=\"296.0\" y=\"52.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">= 2.04</text><text x=\"40\" y=\"108\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">cat</text><text x=\"160\" y=\"108\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">probabilities sum to 1</text></svg>", "h": "Exp, normalize, minus ln of the right answer. Use ln, not log10."}, {"id": "Q66", "t": "CNN layers", "q": "How large an area of the input do two stacked 3x3 conv layers (stride 1) see?", "a": "5x5. Receptive field = 1 + L(K - 1) = 1 + 2 x 2 = 5. (Three layers: 7x7.)", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 142\" role=\"img\"><rect x=\"10\" y=\"20\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"22\" y=\"20\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"34\" y=\"20\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"46\" y=\"20\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"58\" y=\"20\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"70\" y=\"20\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"82\" y=\"20\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"10\" y=\"32\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"22\" y=\"32\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"34\" y=\"32\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"46\" y=\"32\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"58\" y=\"32\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"70\" y=\"32\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"82\" y=\"32\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"10\" y=\"44\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"22\" y=\"44\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"34\" y=\"44\" width=\"12\" height=\"12\" rx=\"1\" c " text-anchor=\"middle\" font-size=\"10\" class=\"acc\">same label &#x27;cat&#x27;, more variety, less overfitting</text></svg>", "h": "Change the picture, keep the label."}, {"id": "Q68", "t": "Generative", "q": "What are the two main problems in GAN training?", "a": "Stability: parameters oscillate or diverge, generator loss doesn't correlate with sample quality, very sensitive to hyperparameters.\nMode collapse: the generator produces only a few kinds of samples (one mode), so outputs lack diversity.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 122\" role=\"img\"><line x1=\"10\" y1=\"55\" x2=\"240\" y2=\"55\" class=\"ln\"/><path d=\"M22,55 Q40,5 58,55\" class=\"lng\"/><path d=\"M77,55 Q95,5 113,55\" class=\"lng\"/><path d=\"M132,55 Q150,5 168,55\" class=\"lng\"/><path d=\"M187,55 Q205,5 223,55\" class=\"lng\"/><text x=\"282\" y=\"41\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">real: 4 modes</text><line x1=\"10\" y1=\"115\" x2=\"240\" y2=\"115\" class=\"ln\"/><path d=\"M77,115 Q95,65 113,115\" class=\"lnr\"/><text x=\"282\" y=\"101\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">G: 1 mode</text></svg>", "h": "Mode collapse = the generator finds one trick that works and only does that."}, {"id": "Q69", "t": "Generative", "q": "Strengths and weaknesses of PixelRNN and PixelCNN?", "a": "Strengths: explicitly compute the likelihood p(x), which gives a good evaluation metric; good samples.\nWeakness: generation is sequential (pixel by pixel), so slow. PixelCNN trains faster than PixelRNN (convolutions can be parallel at training) but generation is still sequential.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>PixelRNN</text><rect x=\"30\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"48\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"66\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"84\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"30\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"48\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"66\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxr\"/><rect x=\"84\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"30\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"48\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"66\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"84\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"30\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"48\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"66\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"84\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><text x=\"70\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">one pixel at a time</text><text x=\"70\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">slow train + generate</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>PixelCNN</text><rect x=\"200\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxg\"/><rect x=\"218\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxg\"/><rect x=\"236\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxg\"/><rect x=\"254\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"200\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxg\"/><rect x=\"218\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxr\"/><rect x=\"236\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"254\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"200\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"218\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"236\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"254\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"200\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"218\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"236\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"254\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><text x=\"240\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">conv over context</text><text x=\"240\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"\">faster train, gen still slow</text></svg>", "h": "Both write pixels in reading order. Explicit p(x), but sequential = slow."}, {"id": "Q70", "t": "Detection & Segmentation", "q": "Among R-CNN, Fast R-CNN, and Faster R-CNN, which use traditional region proposal methods, and what does that mean?", "a": "R-CNN and Fast R-CNN use a traditional, non-learned heuristic (Selective Search, ~2000 proposals on CPU) to propose regions. Faster R-CNN replaces it with a learned Region Proposal Network (RPN) inside the CNN.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"160\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\">R-CNN: ~2000 Selective Search regions, CNN on EACH (slow)</text><text x=\"160\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" class=\"\">Fast R-CNN: CNN once, crop features (RoI pool)</text><text x=\"160\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">Faster R-CNN: learned Region Proposal Network</text><text x=\"160\" y=\"68\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">YOLO: one pass, S x S grid, B boxes per cell</text><rect x=\"110\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"110\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"110\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"110\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"84\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxi\"/><text x=\"240\" y=\"100\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">cell: x, y, w, h,</text><text x=\"240\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">confidence + class</text></svg>", "h": "R-CNN family: propose then classify. YOLO: you only look once."}, {"id": "Q71", "t": "CNN layers", "q": "Conv layer vs fully connected layer in terms of parameter sharing and spatial structure?", "a": "Conv: small filters with shared weights slide across the image, preserving spatial structure with far fewer parameters. FC: every input connects to every output, requires flattening, loses spatial structure.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Fully connected</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Conv: shared filter</text><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"96\" class=\"lnf\"/><circle cx=\"30\" cy=\"30\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"48\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"66\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"84\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"102\" r=\"5\" class=\"acc\"/><circle cx=\"130\" cy=\"36\" r=\"5\" class=\"good\"/><circle cx=\"130\" cy=\"56\" r=\"5\" class=\"good\"/><circle cx=\"130\" cy=\"76\" r=\"5\" class=\"good\"/><circle cx=\"130\" cy=\"96\" r=\"5\" class=\"good\"/><line x1=\"190\" y1=\"30\" x2=\"290\" y2=\"48\" class=\"lna\"/><line x1=\"190\" y1=\"48\" x2=\"290\" y2=\"48\" class=\"lng\"/><line x1=\"190\" y1=\"66\" x2=\"290\" y2=\"48\" class=\"lnr\"/><line x1=\"190\" y1=\"48\" x2=\"290\" y2=\"66\" class=\"lna\"/><line x1=\"190\" y1=\"66\" x2=\"290\" y2=\"66\" class=\"lng\"/><line x1=\"190\" y1=\"84\" x2=\"290\" y2=\"66\" class=\"lnr\"/><line x1=\"190\" y1=\"66\" x2=\"290\" y2=\"84\" class=\"lna\"/><line x1=\"190\" y1=\"84\" x2=\"290\" y2=\"84\" class=\"lng\"/><line x1=\"190\" y1=\"102\" x2=\"290\" y2=\"84\" class=\"lnr\"/><circle cx=\"190\" cy=\"30\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"48\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"66\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"84\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"102\" r=\"5\" class=\"acc\"/><circle cx=\"290\" cy=\"48\" r=\"5\" class=\"good\"/><circle cx=\"290\" cy=\"66\" r=\"5\" class=\"good\"/><circle cx=\"290\" cy=\"84\" r=\"5\" class=\"good\"/><text x=\"80\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">every input to every output</text><text x=\"240\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">same 3 weights reused, local</text></svg>", "h": "FC: everyone talks to everyone (huge). Conv: one small filter slides and is reused."}, {"id": "Q72", "t": "Generative", "q": "Encoder vs decoder in an autoencoder?", "a": "Encoder compresses the input into lower-dimensional features (latent z). Decoder reconstructs the input from z. Trained with L2 reconstruction loss, no labels.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 110\" role=\"img\"><polygon points=\"10,20 70,40 70,70 10,90\" class=\"boxa\"/><text x=\"38\" y=\"58\" text-anchor=\"middle\" font-size=\"9\" class=\"\">enc</text><rect x=\"74\" y=\"42\" width=\"22\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"85.0\" y=\"58.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">z</text><polygon points=\"100,40 160,20 160,90 100,70\" class=\"boxg\"/><text x=\"132\" y=\"58\" text-anchor=\"middle\" font-size=\"9\" class=\"\">dec</text><text x=\"30\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x</text><text x=\"150\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x-hat</text><text x=\"240\" y=\"40\" text-anchor=\"middle\" font-size=\"9\" class=\"\">loss = ||x-hat - x||^2</text><text x=\"240\" y=\"56\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">no labels</text><text x=\"240\" y=\"72\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">z smaller than x</text></svg>", "h": "Hourglass: squeeze to z, rebuild. The squeeze forces useful features."}, {"id": "Q73", "t": "Training", "q": "Difference between validation loss and training loss?", "a": "Training loss: on the data the model learns from. Validation loss: on held-out data not used for training. Training loss falling while validation loss rises (big gap) means overfitting.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 138\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Overfitting</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Underfitting</text><line x1=\"15\" y1=\"90\" x2=\"150\" y2=\"90\" class=\"ln\"/><line x1=\"15\" y1=\"90\" x2=\"15\" y2=\"20\" class=\"ln\"/><line x1=\"175\" y1=\"90\" x2=\"310\" y2=\"90\" class=\"ln\"/><line x1=\"175\" y1=\"90\" x2=\"175\" y2=\"20\" class=\"ln\"/><path d=\"M15,85 Q50,30 145,25\" class=\"lng\"/><path d=\"M15,85 Q50,50 145,60\" class=\"lnr\"/><text x=\"110\" y=\"34\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">train</text><text x=\"130\" y=\"72\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">val</text><line x1=\"140\" y1=\"28\" x2=\"140\" y2=\"58\" class=\"lnd\"/><text x=\"110\" y=\"45\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">big gap</text><path d=\"M175,85 Q210,65 305,62\" class=\"lng\"/><path d=\"M175,86 Q210,70 305,66\" class=\"lnr\"/><text x=\"290\" y=\"55\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">both low</text><text x=\"80\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fix: regularize,</text><text x=\"80\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">more data</text><text x=\"240\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fix: bigger model,</text><text x=\"240\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">train longer</text><text x=\"80\" y=\"132\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">(accuracy curves)</text><text x=\"240\" y=\"132\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">(no gap, both bad)</text></svg>", "h": "Gap = overfit. No gap but bad = underfit."}, {"id": "Q74", "t": "Basics/KNN/Linear", "q": "Difference between supervised and self-supervised learning?", "a": "Supervised uses manually labeled data. Self-supervised creates its own targets from the data (use part of the data to predict another part), e.g. predicting future video frames.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 120\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Supervised</text><rect x=\"10\" y=\"22\" width=\"60\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"40.0\" y=\"40.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">photo</text><line x1=\"70\" y1=\"37\" x2=\"90\" y2=\"37\" class=\"ln\"/><polygon points=\"90,37 84.59731738588394,39.60979320466738 84.59731738588394,34.39020679533262\" class=\"ah\"/><rect x=\"92\" y=\"22\" width=\"80\" height=\"30\" rx=\"4\" class=\"boxr\"/><text x=\"132.0\" y=\"34.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">human label</text><text x=\"132.0\" y=\"46.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">&#x27;cat&#x27;</text><text x=\"80\" y=\"74\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Self-supervised</text><rect x=\"10\" y=\"82\" width=\"34\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"27.0\" y=\"94.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">frame</text><text x=\"27.0\" y=\"105.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"50\" y=\"82\" width=\"34\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"67.0\" y=\"94.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">frame</text><text x=\"67.0\" y=\"105.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"90\" y=\"82\" width=\"34\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"107.0\" y=\"94.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">frame</text><text x=\"107.0\" y=\"105.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><line x1=\"126\" y1=\"97\" x2=\"146\" y2=\"97\" class=\"ln\"/><polygon points=\"146,97 140.59731738588394,99.60979320466738 140.59731738588394,94.39020679533262\" class=\"ah\"/><rect x=\"148\" y=\"82\" width=\"56\" height=\"30\" rx=\"4\" class=\"boxg\"/><text x=\"176.0\" y=\"94.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">predict</text><text x=\"176.0\" y=\"105.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">frame 4</text><text x=\"262\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" class=\"good\">data labels</text><text x=\"262\" y=\"103\" text-anchor=\"middle\" font-size=\"10\" class=\"good\">itself</text><text x=\"255\" y=\"37\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">costly human labels</text></svg>", "h": "Self-supervised: hide part of the data, predict it from the rest."}, {"id": "Q75", "t": "Basics/KNN/Linear", "q": "What happens to KNN's decision boundaries and noise sensitivity as K increases?", "a": "Boundaries get smoother and the model is less sensitive to noise/outliers. K too large underfits.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>K = 1: jagged</text><rect x=\"10\" y=\"20\" width=\"140\" height=\"90\" rx=\"2\" class=\"boxa\"/><rect x=\"85\" y=\"20\" width=\"65\" height=\"90\" rx=\"2\" class=\"boxr\"/><circle cx=\"25\" cy=\"35\" r=\"4\" class=\"acc\"/><circle cx=\"45\" cy=\"60\" r=\"4\" class=\"acc\"/><circle cx=\"30\" cy=\"90\" r=\"4\" class=\"acc\"/><circle cx=\"65\" cy=\"40\" r=\"4\" class=\"acc\"/><circle cx=\"60\" cy=\"80\" r=\"4\" class=\"acc\"/><circle cx=\"105\" cy=\"35\" r=\"4\" class=\"bad\"/><circle cx=\"125\" cy=\"65\" r=\"4\" class=\"bad\"/><circle cx=\"110\" cy=\"95\" r=\"4\" class=\"bad\"/><circle cx=\"135\" cy=\"45\" r=\"4\" class=\"bad\"/><circle cx=\"45\" cy=\"40\" r=\"4\" class=\"bad\"/><circle cx=\"45\" cy=\"40\" r=\"11\" class=\"islandc\"/><text x=\"45\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">outlier island</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>K = 5: smooth</text><rect x=\"170\" y=\"20\" width=\"140\" height=\"90\" rx=\"2\" class=\"boxa\"/><rect x=\"245\" y=\"20\" width=\"65\" height=\"90\" rx=\"2\" class=\"boxr\"/><circle cx=\"185\" cy=\"35\" r=\"4\" class=\"acc\"/><circle cx=\"205\" cy=\"60\" r=\"4\" class=\"acc\"/><circle cx=\"190\" cy=\"90\" r=\"4\" class=\"acc\"/><circle cx=\"225\" cy=\"40\" r=\"4\" class=\"acc\"/><circle cx=\"220\" cy=\"80\" r=\"4\" class=\"acc\"/><circle cx=\"265\" cy=\"35\" r=\"4\" class=\"bad\"/><circle cx=\"285\" cy=\"65\" r=\"4\" class=\"bad\"/><circle cx=\"270\" cy=\"95\" r=\"4\" class=\"bad\"/><circle cx=\"295\" cy=\"45\" r=\"4\" class=\"bad\"/><circle cx=\"205\" cy=\"40\" r=\"4\" class=\"bad\"/><text x=\"205\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">outlier outvoted</text></svg>", "h": "Bigger K = smoother, ignores noise. Too big = everything is the majority class."}, {"id": "Q76", "t": "Optimization & NN", "q": "W = [2, -1], gradients = [4, -2], learning rate 0.25. Updated weights after one gradient descent step?", "a": "W_new = W - lr x grad = [2, -1] - 0.25 x [4, -2] = [2 - 1, -1 + 0.5] = [1, -0.5]", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 122\" role=\"img\"><path d=\"M20,20 Q160,170 300,20\" class=\"ln\"/><line x1=\"40\" y1=\"41\" x2=\"80\" y2=\"72\" class=\"lna\"/><polygon points=\"80,72 74.13095296985101,70.75328954528358 77.32832370950334,66.62764988121604\" class=\"ah\"/><line x1=\"80\" y1=\"72\" x2=\"115\" y2=\"88\" class=\"lna\"/><polygon points=\"115,88 109.00135106564925,88.12732227775437 111.1714450598913,83.38024166534987\" class=\"ah\"/><line x1=\"115\" y1=\"88\" x2=\"145\" y2=\"94\" class=\"lna\"/><polygon points=\"145,94 139.19041127489723,95.49955955038762 140.21405638851576,90.38133398229499\" class=\"ah\"/><circle cx=\"40\" cy=\"41\" r=\"6\" class=\"bad\"/><circle cx=\"160\" cy=\"95\" r=\"4\" class=\"good\"/><text x=\"160\" y=\"116\" text-anchor=\"middle\" font-size=\"10\" class=\"\">W = W - lr x gradient</text><text x=\"255\" y=\"60\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">step opposite</text><text x=\"255\" y=\"72\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">the slope</text></svg>", "h": "Gradient points uphill, so subtract it."}, {"id": "Q77", "t": "Architectures & BatchNorm", "q": "Why are skip connections useful in deep neural networks?", "a": "They let information and gradients flow directly across layers (F(x) + x), making very deep networks easy to optimize; extra layers can learn identity. Reduces vanishing gradients.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 162\" role=\"img\"><rect x=\"110\" y=\"10\" width=\"100\" height=\"24\" rx=\"4\" class=\"box\"/><text x=\"160.0\" y=\"25.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><line x1=\"160\" y1=\"34\" x2=\"160\" y2=\"46\" class=\"ln\"/><polygon points=\"160,46 157.39020679533263,40.59731738588394 162.60979320466737,40.59731738588394\" class=\"ah\"/><rect x=\"110\" y=\"46\" width=\"100\" height=\"24\" rx=\"4\" class=\"boxa\"/><text x=\"160.0\" y=\"61.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">conv 3x3 + ReLU</text><line x1=\"160\" y1=\"70\" x2=\"160\" y2=\"80\" class=\"ln\"/><polygon points=\"160,80 157.39020679533263,74.59731738588394 162.60979320466737,74.59731738588394\" class=\"ah\"/><rect x=\"110\" y=\"80\" width=\"100\" height= cy=\"95\" r=\"6\" class=\"good\"/><text x=\"160\" y=\"116\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">good W: low loss</text><text x=\"270\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">loss = how wrong</text></svg>", "h": "Loss is the height. Training walks downhill."}, {"id": "Q84", "t": "Hardware/PyTorch", "q": "Two features of Tensors that make them efficient for deep learning?", "a": "They can run on GPUs, which are very fast at parallel matrix multiplication. With autograd, operations on tensors build a computational graph so gradients are computed automatically.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 102\" role=\"img\"><text x=\"70\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>CPU: few smart cores</text><rect x=\"40\" y=\"24\" width=\"20\" height=\"20\" rx=\"1\" class=\"boxa\"/><rect x=\"60\" y=\"24\" width=\"20\" height=\"20\" rx=\"1\" class=\"boxa\"/><rect x=\"80\" y=\"24\" width=\"20\" height=\"20\" rx=\"1\" class=\"boxa\"/><rect x=\"40\" y=\"44\" width=\"20\" height=\"20\" rx=\"1\" class=\"boxa\"/><rect x=\"60\" y=\"44\" width=\"20\" height=\"20\" rx=\"1\" class=\"boxa\"/><rect x=\"80\" y=\"44\" width=\"20\" height=\"20\" rx=\"1\" class=\"boxa\"/><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>GPU: many simple cores</text><rect x=\"180\" y=\"24\" width=\"10\" height=\"10\" rx=\"1\" class=\"boxg\"/><rect x=\"190\" y=\"24\" width=\"10\" height=\"10\" rx=\"1\" class=\"boxg\"/><rect x=\"200\" y=\"24\" width=\"10\" height=\"10\" rx=\"1\" class=\"boxg\"/><rect x=\"210\" y=\"24\" width=\"10\" height=\"10\" rx=\"1\" class=\"boxg\"/><rect x=\"220\" y=\"24\" width=\"10\" height=\"10\" rx=\"1\" class=\"boxg\"/><rect x=\"230\" y=\"24\" width=\"10\" height=\"10\" rx=\"1\" class=\"boxg\"/><rect x=\"240\" y=\"24\" width=\"10\" height=\"10\" rx=\"1\" class=\"boxg\"/><rect x=\"250\" y=\"24\" width=\"10\" height=\"10\" rx=\"1\" class=\"boxg\"/><rect x=\"26

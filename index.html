<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}*{box-sizing:border-box}</style>
<title>DL Exam Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: toolbar (progress, filters) above one big flip card; list view swaps the card for a scannable Q&A list */
:root{--bg:#f4f6f8;--surface:#fff;--ink:#14202a;--muted:#5a6773;--line:#dce2e8;--accent:#0f6e6a;--accent-soft:#e2f0ee;--got:#2f7d4f;--got-soft:#e3f3e9;--again:#b4372a;--again-soft:#fbe8e5;--back:#f9fbfc;
--f-head:"Space Grotesk",system-ui,sans-serif;--f-body:"Inter",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1317;--surface:#161d23;--ink:#e3e9ee;--muted:#93a0ab;--line:#2a343c;--accent:#4fc2b8;--accent-soft:#163130;--got:#6fcf97;--got-soft:#173023;--again:#f08a7c;--again-soft:#3a1e1a;--back:#12191e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1317;--surface:#161d23;--ink:#e3e9ee;--muted:#93a0ab;--line:#2a343c;--accent:#4fc2b8;--accent-soft:#163130;--got:#6fcf97;--got-soft:#173023;--again:#f08a7c;--again-soft:#3a1e1a;--back:#12191e;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-head);font-size:1.6rem;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;margin:10px 0 0;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font:inherit;font-size:.78rem;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{font:inherit;font-size:.85rem;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
button:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;min-height:300px;padding:22px 22px 18px;cursor:pointer;display:flex;flex-direction:column;gap:12px}
.card.flipped{background:var(--back)}
.meta{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.meta .tag{color:var(--accent)}
.state{padding:1px 7px;border-radius:4px}
.state.got{color:var(--got);background:var(--got-soft)}.state.again{color:var(--again);background:var(--again-soft)}
.q{font-family:var(--f-head);font-size:1.18rem;font-weight:600;white-space:pre-line;text-wrap:pretty;min-width:0;overflow-wrap:anywhere}
.a{white-space:pre-line;border-top:1px dashed var(--line);padding-top:12px;min-width:0;overflow-wrap:anywhere}
.hint{margin-top:auto;font-size:.8rem;color:var(--muted)}
.nav{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin-top:12px}
.nav .got{color:var(--got)}.nav .again{color:var(--again)}
.empty{margin-top:18px;padding:30px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.list{margin-top:18px;display:grid;gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.item .q{font-size:1rem}
.item .a{margin-top:8px;font-size:.92rem}
.viz{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
svg.dg{width:100%;max-width:440px;height:auto;display:block}
.dg text{fill:var(--ink);font-family:var(--f-mono)}
.dg .mut{fill:var(--muted)}.dg .acc{fill:var(--accent)}.dg .bad{fill:var(--again)}.dg .good{fill:var(--got)}
.dg .box{fill:var(--surface);stroke:var(--muted);stroke-width:1}
.dg .boxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1}
.dg .boxg{fill:var(--got-soft);stroke:var(--got);stroke-width:1}
.dg .boxr{fill:var(--again-soft);stroke:var(--again);stroke-width:1}
.dg .boxi{fill:none;stroke:var(--again);stroke-width:2}
.dg circle.dot{fill:var(--muted)}.dg circle.acc{fill:var(--accent)}.dg circle.bad{fill:var(--again)}.dg circle.good{fill:var(--got)}
.dg .ring{fill:none;stroke:var(--line);stroke-width:1.2}.dg .islandc{fill:none;stroke:var(--again);stroke-width:1.5;stroke-dasharray:3 2}
.dg .ln{stroke:var(--muted);stroke-width:1.4;fill:none}.dg .lna{stroke:var(--accent);stroke-width:1.8;fill:none}
.dg .lng{stroke:var(--got);stroke-width:1.8;fill:none}.dg .lnr{stroke:var(--again);stroke-width:1.8;fill:none}
.dg .lnf{stroke:var(--line);stroke-width:1;fill:none}.dg .lnd{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 2;fill:none}.dg .none{fill:none;stroke:none}
.dg .ah{fill:var(--muted)}.dg .ahg{fill:var(--got)}
.hook{font-size:.86rem;color:var(--ink);background:var(--accent-soft);border-radius:6px;padding:6px 10px}
.hook b{color:var(--accent);font-weight:600}
kbd{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}
@media (max-width:480px){.nav{grid-template-columns:1fr 1fr}.card{padding:18px 16px 14px;min-height:260px}.q{font-size:1.06rem}}
</style>
</head>
<body>

<div class="wrap">
<div class="eyebrow">CSE 330 · Deep Learning</div>
<h1>Exam flashcards</h1>
<div class="stats" id="stats"></div>
<div class="chips" id="chips" aria-label="Filter by topic"></div>
<div class="tools">
 <button class="btn" id="shuffle" type="button">Shuffle</button>
 <button class="btn" id="onlyAgain" type="button" aria-pressed="false">Only "Again" cards</button>
 <button class="btn" id="listView" type="button" aria-pressed="false">List view</button>
 <button class="btn" id="reset" type="button">Reset progress</button>
</div>
<div id="cardView">
 <div class="card" id="card" tabindex="0" role="button" aria-label="Flashcard, press to flip">
  <div class="meta"><span><span class="tag" id="tag"></span> · <span id="num"></span></span><span id="pos"></span></div>
  <div class="q" id="q"></div>
  <div class="a" id="a" hidden></div>
  <div class="viz" id="viz" hidden></div>
  <div class="hint" id="hint">Tap or press <kbd>Space</kbd> to show the answer · <kbd>←</kbd> <kbd>→</kbd> to move</div>
 </div>
 <div class="nav">
  <button class="btn" id="prev" type="button">← Prev</button>
  <button class="btn again" id="again" type="button">Again</button>
  <button class="btn got" id="got" type="button">Got it</button>
  <button class="btn" id="next" type="button">Next →</button>
 </div>
</div>
<div class="empty" id="empty" hidden>No cards match. Turn off "Only Again" or pick another topic.</div>
<div class="list" id="list" hidden></div>
</div>
<script>
var DATA={"cards": [{"id": "Quiz 1", "t": "Basics/KNN/Linear", "q": "What is the difference between deep learning and traditional (shallow) machine learning?", "a": "Shallow / traditional ML: a fixed, hand-crafted feature extractor (e.g. SIFT, HOG) followed by a simple trainable classifier. Only the classifier learns.\nDeep learning is end-to-end: a hierarchy of trainable feature transforms learns the features directly from raw data (edges, then parts, then objects) together with the classifier.", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 152\" role=\"img\"><text x=\"10\" y=\"16\" text-anchor=\"start\" font-size=\"11\" class=\"\" font-weight=600>Traditional ML</text><rect x=\"10\" y=\"24\" width=\"60\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"40.0\" y=\"42.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">image</text><line x1=\"70\" y1=\"39\" x2=\"86\" y2=\"39\" class=\"ln\"/><polygon points=\"86,39 80.59731738588394,41.60979320466738 80.59731738588394,36.39020679533262\" class=\"ah\"/><rect x=\"88\" y=\"24\" width=\"92\" height=\"30\" rx=\"4\" class=\"boxr\"/><text x=\"134.0\" y=\"36.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">hand-made</text><text x=\"134.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">features</text><line x1=\"180\" y1=\"39\" x2=\"196\" y2=\"39\" class=\"ln\"/><polygon points=\"196,39 190.59731738588394,41.60979320466738 190.59731738588394,36.39020679533262\" class=\"ah\"/><rect x=\"198\" y=\"24\" width=\"70\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"233.0\" y=\"42.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">classifier</text><text x=\"134\" y=\"66\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">human designs</text><text x=\"233\" y=\"66\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">learned</text><text x=\"10\" y=\"92\" text-anchor=\"start\" font-size=\"11\" class=\"\" font-weight=600>Deep learning (end-to-end)</text><rect x=\"10\" y=\"100\" width=\"50\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"35.0\" y=\"118.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">image</text><line x1=\"60\" y1=\"115\" x2=\"68\" y2=\"115\" class=\"ln\"/><polygon points=\"68,115 62.59731738588394,117.60979320466738 62.59731738588394,112.39020679533262\" class=\"ah\"/><rect x=\"70\" y=\"100\" width=\"52\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"96.0\" y=\"118.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">edges</text><line x1=\"120\" y1=\"115\" x2=\"128\" y2=\"115\" class=\"ln\"/><polygon points=\"128,115 122.59731738588394,117.60979320466738 122.59731738588394,112.39020679533262\" class=\"ah\"/><rect x=\"130\" y=\"100\" width=\"52\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"156.0\" y=\"118.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">parts</text><line x1=\"180\" y1=\"115\" x2=\"188\" y2=\"115\" class=\"ln\"/><polygon points=\"188,115 182.59731738588394,117.60979320466738 182.59731738588394,112.39020679533262\" class=\"ah\"/><rect x=\"190\" y=\"100\" width=\"52\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"216.0\" y=\"118.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">objects</text><line x1=\"242\" y1=\"115\" x2=\"250\" y2=\"115\" class=\"ln\"/><polygon points=\"250,115 244.59731738588394,117.60979320466738 244.59731738588394,112.39020679533262\" class=\"ah\"/><rect x=\"252\" y=\"100\" width=\"64\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"284.0\" y=\"118.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">classifier</text><text x=\"160\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">every box learned together</text></svg>", "h": "Shallow = human picks features. Deep = the net learns features too, all the way from pixels to answer."}, {"id": "Quiz 2", "t": "Loss", "q": "Calculate the SVM loss for each image (cat, car, frog) and the overall loss.\nScores (cat img / car img / frog img):\ncat: 3.2 / 1.3 / 2.2\ncar: 5.1 / 4.9 / 2.5\nfrog: -1.7 / 2.0 / -3.1", "a": "Rule: L_i = sum over wrong classes of max(0, wrong - correct + 1).\nCat image (correct 3.2): max(0, 5.1-3.2+1) + max(0, -1.7-3.2+1) = 2.9 + 0 = 2.9\nCar image (correct 4.9): max(0, 1.3-4.9+1) + max(0, 2.0-4.9+1) = 0 + 0 = 0\nFrog image (correct -3.1): max(0, 2.2+3.1+1) + max(0, 2.5+3.1+1) = 6.3 + 6.6 = 12.9\nOverall = (2.9 + 0 + 12.9) / 3 = 5.27", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 154\" role=\"img\"><text x=\"160\" y=\"13\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Cat image: correct class = cat (3.2)</text><line x1=\"20\" y1=\"70\" x2=\"300\" y2=\"70\" class=\"ln\"/><line x1=\"20\" y1=\"66\" x2=\"20\" y2=\"74\" class=\"ln\"/><text x=\"20\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">-2</text><line x1=\"55\" y1=\"66\" x2=\"55\" y2=\"74\" class=\"ln\"/><text x=\"55\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">-1</text><line x1=\"90\" y1=\"66\" x2=\"90\" y2=\"74\" class=\"ln\"/><text x=\"90\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">0</text><line x1=\"125\" y1=\"66\" x2=\"125\" y2=\"74\" class=\"ln\"/><text x=\"125\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">1</text><line x1=\"160\" y1=\"66\" x2=\"160\" y2=\"74\" class=\"ln\"/><text x=\"160\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">2</text><line x1=\"195\" y1=\"66\" x2=\"195\" y2=\"74\" class=\"ln\"/><text x=\"195\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">3</text><line x1=\"230\" y1=\"66\" x2=\"230\" y2=\"74\" class=\"ln\"/><text x=\"230\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">4</text><line x1=\"265\" y1=\"66\" x2=\"265\" y2=\"74\" class=\"ln\"/><text x=\"265\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">5</text><line x1=\"300\" y1=\"66\" x2=\"300\" y2=\"74\" class=\"ln\"/><text x=\"300\" y=\"86\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">6</text><rect x=\"167.0\" y=\"50\" width=\"133.0\" height=\"14\" rx=\"2\" class=\"boxr\"/><text x=\"233.5\" y=\"44\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">danger zone: above 3.2 - 1 = 2.2</text><circle cx=\"202.0\" cy=\"70\" r=\"6\" class=\"good\"/><circle cx=\"268.5\" cy=\"70\" r=\"6\" class=\"bad\"/><circle cx=\"30.5\" cy=\"70\" r=\"6\" class=\"acc\"/><text x=\"30.5\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">frog -1.7</text><text x=\"30.5\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">safe: 0</text><text x=\"190.0\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">cat 3.2</text><text x=\"190.0\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">correct</text><text x=\"280.5\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">car 5.1</text><text x=\"280.5\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">pays 2.9</text><text x=\"160\" y=\"134\" text-anchor=\"middle\" font-size=\"9\" class=\"\">loss = 2.9 + 0 = 2.9 (car img 0, frog img 12.9)</text><text x=\"160\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">overall = (2.9 + 0 + 12.9) / 3 = 5.27</text></svg>", "h": "Correct must win by 1. Penalty = how far each wrong class gets into the danger zone."}, {"id": "Quiz 3", "t": "Backprop", "q": "Backprop: f = (x + y) * z with x = -2, y = 5, z = -4. Find df/dx, df/dy, df/dz.", "a": "Forward: q = x + y = 3, f = q * z = -12.\ndf/dz = q = 3\ndf/dq = z = -4\nAdd gate copies the gradient: df/dx = df/dq * 1 = -4, df/dy = -4.\nRule: downstream gradient = upstream gradient x local gradient.\n(Also know the sigmoid example: sigma'(x) = sigma(x)(1 - sigma(x)), e.g. 0.73 x 0.27 = 0.20.)", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 154\" role=\"img\"><rect x=\"10\" y=\"20\" width=\"40\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"30.0\" y=\"36.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x = -2</text><rect x=\"10\" y=\"80\" width=\"40\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"30.0\" y=\"96.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">y = 5</text><rect x=\"130\" y=\"104\" width=\"40\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"150.0\" y=\"120.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">z = -4</text><circle cx=\"110\" cy=\"63\" r=\"16\" class=\"boxa\"/><text x=\"110\" y=\"67\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><circle cx=\"210\" cy=\"80\" r=\"16\" class=\"boxa\"/><text x=\"210\" y=\"84\" text-anchor=\"middle\" font-size=\"11\" class=\"\">x</text><line x1=\"50\" y1=\"33\" x2=\"96\" y2=\"55\" class=\"ln\"/><line x1=\"50\" y1=\"93\" x2=\"96\" y2=\"71\" class=\"ln\"/><line x1=\"126\" y1=\"63\" x2=\"195\" y2=\"76\" class=\"ln\"/><line x1=\"170\" y1=\"117\" x2=\"197\" y2=\"90\" class=\"ln\"/><line x1=\"226\" y1=\"80\" x2=\"262\" y2=\"80\" class=\"ln\"/><rect x=\"264\" y=\"67\" width=\"48\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"288.0\" y=\"83.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">f = -12</text><text x=\"160\" y=\"62\" text-anchor=\"middle\" font-size=\"10\" class=\"good\">q = 3</text><text x=\"73\" y=\"32\" text-anchor=\"start\" font-size=\"9\" class=\"bad\">dx = -4</text><text x=\"73\" y=\"108\" text-anchor=\"start\" font-size=\"9\" class=\"bad\">dy = -4</text><text x=\"160\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">dq = z = -4</text><text x=\"150\" y=\"148\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">dz = q = 3</text><text x=\"245\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">df = 1</text><text x=\"160\" y=\"14\" text-anchor=\"middle\" font-size=\"9\" class=\"\">forward values (green), gradients (red), go right to left</text></svg><svg class=\"dg\" viewBox=\"0 0 320 108\" role=\"img\"><circle cx=\"55\" cy=\"40\" r=\"18\" class=\"boxa\"/><text x=\"55\" y=\"44\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>+</text><line x1=\"105\" y1=\"40\" x2=\"76\" y2=\"40\" class=\"lnr\"/><polygon points=\"76,40 81.40268261411606,37.39020679533262 81.40268261411606,42.60979320466738\" class=\"ah\"/><text x=\"100\" y=\"32\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">grad</text><line x1=\"37\" y1=\"34\" x2=\"13\" y2=\"24\" class=\"lnr\"/><polygon points=\"13,24 18.990858260979202,23.668914970351672 16.983325026619678,28.48699473281453\" class=\"ah\"/><line x1=\"37\" y1=\"46\" x2=\"13\" y2=\"56\" class=\"lnr\"/><polygon points=\"13,56 16.983325026619678,51.51300526718547 18.990858260979202,56.33108502964833\" class=\"ah\"/><text x=\"58\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\" font-weight=600>distributor</text><text x=\"58\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" class=\"\">copies grad</text><text x=\"58\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"\">to both</text><circle cx=\"159\" cy=\"40\" r=\"18\" class=\"boxa\"/><text x=\"159\" y=\"44\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>x</text><line x1=\"209\" y1=\"40\" x2=\"180\" y2=\"40\" class=\"lnr\"/><polygon points=\"180,40 185.40268261411606,37.39020679533262 185.40268261411606,42.60979320466738\" class=\"ah\"/><text x=\"204\" y=\"32\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">grad</text><line x1=\"141\" y1=\"34\" x2=\"117\" y2=\"24\" class=\"lnr\"/><polygon points=\"117,24 122.99085826097921,23.668914970351672 120.98332502661968,28.48699473281453\" class=\"ah\"/><line x1=\"141\" y1=\"46\" x2=\"117\" y2=\"56\" class=\"lnr\"/><polygon points=\"117,56 120.98332502661968,51.51300526718547 122.99085826097921,56.33108502964833\" class=\"ah\"/><text x=\"162\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\" font-weight=600>switcher</text><text x=\"162\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" class=\"\">each gets grad</text><text x=\"162\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x OTHER input</text><circle cx=\"263\" cy=\"40\" r=\"18\" class=\"boxa\"/><text x=\"263\" y=\"44\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>max</text><line x1=\"313\" y1=\"40\" x2=\"284\" y2=\"40\" class=\"lnr\"/><polygon points=\"284,40 289.4026826141161,37.39020679533262 289.4026826141161,42.60979320466738\" class=\"ah\"/><text x=\"308\" y=\"32\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">grad</text><line x1=\"245\" y1=\"34\" x2=\"221\" y2=\"24\" class=\"lnr\"/><polygon points=\"221,24 226.9908582609792,23.668914970351672 224.98332502661967,28.48699473281453\" class=\"ah\"/><line x1=\"245\" y1=\"46\" x2=\"221\" y2=\"56\" class=\"lnr\"/><polygon points=\"221,56 224.98332502661967,51.51300526718547 226.9908582609792,56.33108502964833\" class=\"ah\"/><text x=\"266\" y=\"76\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\" font-weight=600>router</text><text x=\"266\" y=\"90\" text-anchor=\"middle\" font-size=\"9\" class=\"\">all grad to</text><text x=\"266\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"\">the max, 0 else</text></svg>", "h": "Downstream = upstream x local. Plus copies, times swaps."}, {"id": "Quiz 5", "t": "Architectures & BatchNorm", "q": "AlexNet conv1: input 3x227x227, 64 filters 11x11, stride 4, pad 2. Output size, params, memory, FLOPs? Then max pool 3x3 stride 2?", "a": "Output: (227 - 11 + 2*2)/4 + 1 = 56, so 64x56x56.\nMemory: 64*56*56 = 200,704 values x 4 bytes / 1024 = 784 KB.\nParams: 64 x (3*11*11) + 64 = 23,296.\nFLOPs: (64*56*56) x (3*11*11) = 200,704 x 363 = 72.9 M.\nPool: floor((56 - 3)/2) + 1 = 27, so 64x27x27, 0 params.", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 116\" role=\"img\"><rect x=\"10\" y=\"44\" width=\"90\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"55.0\" y=\"62.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">3x227x227</text><rect x=\"115\" y=\"44\" width=\"90\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"160.0\" y=\"62.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">64x56x56</text><line x1=\"100\" y1=\"59\" x2=\"114\" y2=\"59\" class=\"ln\"/><polygon points=\"114,59 108.59731738588394,61.60979320466738 108.59731738588394,56.39020679533262\" class=\"ah\"/><text x=\"160\" y=\"34\" text-anchor=\"middle\" font-size=\"8\" class=\"acc\">conv 64 @ 11x11 s4 p2</text><rect x=\"220\" y=\"44\" width=\"90\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"265.0\" y=\"62.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">64x27x27</text><line x1=\"205\" y1=\"59\" x2=\"219\" y2=\"59\" class=\"ln\"/><polygon points=\"219,59 213.59731738588394,61.60979320466738 213.59731738588394,56.39020679533262\" class=\"ah\"/><text x=\"265\" y=\"34\" text-anchor=\"middle\" font-size=\"8\" class=\"acc\">maxpool 3 s2</text><text x=\"160\" y=\"94\" text-anchor=\"middle\" font-size=\"9\" class=\"\">(227 - 11 + 4)/4 + 1 = 56      floor((56 - 3)/2) + 1 = 27</text><text x=\"160\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">params 64 x (3x11x11) + 64 = 23,296   pool: 0</text></svg>", "h": "227, 11, 4, 2 -> 56. Then pool 3, stride 2 -> 27."}, {"id": "Quiz 6", "t": "Architectures & BatchNorm", "q": "What were the 4 techniques GoogLeNet used for efficiency?", "a": "1. Aggressive stem: downsamples the input quickly at the start.\n2. Inception module: parallel branches with different filter sizes, using 1x1 convs to reduce channels first.\n3. Global average pooling instead of big fully connected layers at the end.\n4. Auxiliary classifiers in the middle of the network to help gradients flow (a hack from before BatchNorm).", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 112\" role=\"img\"><rect x=\"5\" y=\"30\" width=\"48\" height=\"30\" rx=\"4\" class=\"boxr\"/><text x=\"29.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">stem</text><text x=\"29\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>1</text><line x1=\"53\" y1=\"45\" x2=\"62\" y2=\"45\" class=\"ln\"/><polygon points=\"62,45 56.59731738588394,47.60979320466738 56.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"68\" y=\"8\" width=\"40\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"88.0\" y=\"20.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1x1</text><line x1=\"62\" y1=\"45\" x2=\"68\" y2=\"17\" class=\"ln\"/><line x1=\"108\" y1=\"17\" x2=\"118\" y2=\"45\" class=\"ln\"/><rect x=\"68\" y=\"29\" width=\"40\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"88.0\" y=\"41.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3x3</text><line x1=\"62\" y1=\"45\" x2=\"68\" y2=\"38\" class=\"ln\"/><line x1=\"108\" y1=\"38\" x2=\"118\" y2=\"45\" class=\"ln\"/><rect x=\"68\" y=\"50\" width=\"40\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"88.0\" y=\"62.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">5x5</text><line x1=\"62\" y1=\"45\" x2=\"68\" y2=\"59\" class=\"ln\"/><line x1=\"108\" y1=\"59\" x2=\"118\" y2=\"45\" class=\"ln\"/><rect x=\"68\" y=\"71\" width=\"40\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"88.0\" y=\"83.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">pool</text><line x1=\"62\" y1=\"45\" x2=\"68\" y2=\"80\" class=\"ln\"/><line x1=\"108\" y1=\"80\" x2=\"118\" y2=\"45\" class=\"ln\"/><rect x=\"118\" y=\"34\" width=\"34\" height=\"22\" rx=\"4\" class=\"box\"/><text x=\"135.0\" y=\"47.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">concat</text><text x=\"88\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2 inception</text><line x1=\"152\" y1=\"45\" x2=\"162\" y2=\"45\" class=\"ln\"/><polygon points=\"162,45 156.59731738588394,47.60979320466738 156.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"164\" y=\"30\" width=\"44\" height=\"30\" rx=\"4\" class=\"boxg\"/><text x=\"186.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">GAP</text><text x=\"186\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>3</text><line x1=\"208\" y1=\"45\" x2=\"216\" y2=\"45\" class=\"ln\"/><polygon points=\"216,45 210.59731738588394,47.60979320466738 210.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"218\" y=\"30\" width=\"30\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"233.0\" y=\"48.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">FC</text><rect x=\"258\" y=\"12\" width=\"58\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"287.0\" y=\"28.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">aux</text><rect x=\"258\" y=\"52\" width=\"58\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"287.0\" y=\"68.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">aux</text><text x=\"287\" y=\"92\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4 aux</text><text x=\"287\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"\">classifiers</text><text x=\"29\" y=\"76\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">downsample</text><text x=\"29\" y=\"86\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">fast</text><text x=\"186\" y=\"76\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">no big FC</text></svg>", "h": "S-I-G-A: Stem, Inception, Global avg pool, Aux classifiers."}, {"id": "Quiz 7", "t": "Training", "q": "How do you know from the loss/accuracy curves if a model is overfitting or underfitting? Remedy?", "a": "Overfitting: huge gap between train and validation (train keeps improving, val stalls or gets worse). Fix: more regularization, more data.\nUnderfitting: no gap, both are bad. Fix: train longer, use a bigger model.", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 138\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Overfitting</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Underfitting</text><line x1=\"15\" y1=\"90\" x2=\"150\" y2=\"90\" class=\"ln\"/><line x1=\"15\" y1=\"90\" x2=\"15\" y2=\"20\" class=\"ln\"/><line x1=\"175\" y1=\"90\" x2=\"310\" y2=\"90\" class=\"ln\"/><line x1=\"175\" y1=\"90\" x2=\"175\" y2=\"20\" class=\"ln\"/><path d=\"M15,85 Q50,30 145,25\" class=\"lng\"/><path d=\"M15,85 Q50,50 145,60\" class=\"lnr\"/><text x=\"110\" y=\"34\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">train</text><text x=\"130\" y=\"72\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">val</text><line x1=\"140\" y1=\"28\" x2=\"140\" y2=\"58\" class=\"lnd\"/><text x=\"110\" y=\"45\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">big gap</text><path d=\"M175,85 Q210,65 305,62\" class=\"lng\"/><path d=\"M175,86 Q210,70 305,66\" class=\"lnr\"/><text x=\"290\" y=\"55\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">both low</text><text x=\"80\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fix: regularize,</text><text x=\"80\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">more data</text><text x=\"240\" y=\"106\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fix: bigger model,</text><text x=\"240\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">train longer</text><text x=\"80\" y=\"132\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">(accuracy curves)</text><text x=\"240\" y=\"132\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">(no gap, both bad)</text></svg>", "h": "Gap = overfit. No gap but bad = underfit."}, {"id": "Q7", "t": "RNN/LSTM", "q": "For RNNs, how do you fix exploding gradients and how do you fix vanishing gradients?", "a": "Exploding: gradient clipping (scale the gradient down if its norm is too big).\nVanishing: change the architecture, e.g. use an LSTM (or GRU), whose additive cell state lets gradients flow without repeated matrix multiplies.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 152\" role=\"img\"><rect x=\"20\" y=\"40\" width=\"50\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"45.0\" y=\"58.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">h1</text><rect x=\"20\" y=\"90\" width=\"50\" height=\"20\" rx=\"4\" class=\"boxr\"/><text x=\"45.0\" y=\"103.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x1</text><line x1=\"45\" y1=\"90\" x2=\"45\" y2=\"71\" class=\"ln\"/><polygon points=\"45,71 47.60979320466738,76.40268261411606 42.39020679533262,76.40268261411606\" class=\"ah\"/><line x1=\"70\" y1=\"55\" x2=\"95\" y2=\"55\" class=\"ln\"/><polygon points=\"95,55 89.59731738588394,57.60979320466738 89.59731738588394,52.39020679533262\" class=\"ah\"/><text x=\"82\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\" font-weight=600>W</text><rect x=\"95\" y=\"40\" width=\"50\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"120.0\" y=\"58.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">h2</text><rect x=\"95\" y=\"90\" width=\"50\" height=\"20\" rx=\"4\" class=\"boxr\"/><text x=\"120.0\" y=\"103.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x2</text><line x1=\"120\" y1=\"90\" x2=\"120\" y2=\"71\" class=\"ln\"/><polygon points=\"120,71 122.60979320466738,76.40268261411606 117.39020679533262,76.40268261411606\" class=\"ah\"/><line x1=\"145\" y1=\"55\" x2=\"170\" y2=\"55\" class=\"ln\"/><polygon points=\"170,55 164.59731738588394,57.60979320466738 164.59731738588394,52.39020679533262\" class=\"ah\"/><text x=\"157\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\" font-weight=600>W</text><rect x=\"170\" y=\"40\" width=\"50\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"195.0\" y=\"58.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">h3</text><rect x=\"170\" y=\"90\" width=\"50\" height=\"20\" rx=\"4\" class=\"boxr\"/><text x=\"195.0\" y=\"103.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x3</text><line x1=\"195\" y1=\"90\" x2=\"195\" y2=\"71\" class=\"ln\"/><polygon points=\"195,71 197.60979320466737,76.40268261411606 192.39020679533263,76.40268261411606\" class=\"ah\"/><line x1=\"220\" y1=\"55\" x2=\"245\" y2=\"55\" class=\"ln\"/><polygon points=\"245,55 239.59731738588394,57.60979320466738 239.59731738588394,52.39020679533262\" class=\"ah\"/><text x=\"232\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\" font-weight=600>W</text><rect x=\"245\" y=\"40\" width=\"50\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"270.0\" y=\"58.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">h4</text><rect x=\"245\" y=\"90\" width=\"50\" height=\"20\" rx=\"4\" class=\"boxr\"/><text x=\"270.0\" y=\"103.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x4</text><line x1=\"270\" y1=\"90\" x2=\"270\" y2=\"71\" class=\"ln\"/><polygon points=\"270,71 272.60979320466737,76.40268261411606 267.39020679533263,76.40268261411606\" class=\"ah\"/><text x=\"160\" y=\"20\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>same W at every step</text><text x=\"160\" y=\"132\" text-anchor=\"middle\" font-size=\"9\" class=\"\">backprop multiplies by W again and again:</text><text x=\"160\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">|W| &gt; 1 explodes (clip it)   |W| &lt; 1 vanishes (LSTM)</text></svg>", "h": "Explode: clip. Vanish: LSTM. RNN must go step by step, so no parallelism."}, {"id": "Q8", "t": "CNN layers", "q": "How many learnable parameters does a 2x2 max pooling layer with stride 2 have?", "a": "0. Pooling applies a fixed operation (take the max), so there are no weights to learn.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><rect x=\"10\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"21.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"32\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"43.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"54\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"65.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"76\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"87.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4</text><rect x=\"10\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"21.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">5</text><rect x=\"32\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"43.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">6</text><rect x=\"54\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"65.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">7</text><rect x=\"76\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"87.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">8</text><rect x=\"10\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"21.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><rect x=\"32\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"43.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"54\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"65.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"76\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"87.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">0</text><rect x=\"10\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"21.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"32\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"43.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"54\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"65.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><rect x=\"76\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"87.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4</text><line x1=\"102\" y1=\"64\" x2=\"122\" y2=\"64\" class=\"ln\"/><polygon points=\"122,64 116.59731738588394,66.60979320466738 116.59731738588394,61.39020679533262\" class=\"ah\"/><text x=\"160\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>max</text><rect x=\"130\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"141.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">6</text><rect x=\"152\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"163.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">8</text><rect x=\"130\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"141.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><rect x=\"152\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"163.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4</text><text x=\"260\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>average</text><rect x=\"225\" y=\"42\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxa\"/><text x=\"240.0\" y=\"60.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3.25</text><rect x=\"255\" y=\"42\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxg\"/><text x=\"270.0\" y=\"60.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">5.25</text><rect x=\"225\" y=\"72\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxr\"/><text x=\"240.0\" y=\"90.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"255\" y=\"72\" width=\"30\" height=\"30\" rx=\"1\" class=\"box\"/><text x=\"270.0\" y=\"90.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><text x=\"160\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">2x2, stride 2: 4x4 -&gt; 2x2.  0 learnable parameters</text></svg>", "h": "Pooling just picks the max (or mean) of each block. Nothing to learn."}, {"id": "Q9", "t": "Detection & Segmentation", "q": "Explain the output of each computer vision task: classification, semantic segmentation, object detection, instance segmentation.", "a": "Classification: one label for the whole image.\nSemantic segmentation: a label for every pixel (doesn't separate different objects of the same class).\nObject detection: for each object, a class label + bounding box (variable number of objects).\nInstance segmentation: detect each object and give its own pixel mask (separates instances, e.g. dog 1 vs dog 2).", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 116\" role=\"img\"><rect x=\"8\" y=\"20\" width=\"70\" height=\"60\" rx=\"2\" class=\"box\"/><text x=\"43\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>classify</text><text x=\"43\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">CAT</text><circle cx=\"43\" cy=\"50\" r=\"14\" class=\"boxa\"/><text x=\"43\" y=\"54\" text-anchor=\"middle\" font-size=\"8\" class=\"\">CAT</text><rect x=\"86\" y=\"20\" width=\"70\" height=\"60\" rx=\"2\" class=\"box\"/><text x=\"121\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>semantic seg</text><text x=\"121\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">per pixel</text><rect x=\"86\" y=\"60\" width=\"70\" height=\"20\" rx=\"0\" class=\"boxg\"/><polygon points=\"101,60 111,35 131,35 141,60\" class=\"boxa\"/><polygon points=\"91,60 98,45 106,60\" class=\"boxa\"/><rect x=\"164\" y=\"20\" width=\"70\" height=\"60\" rx=\"2\" class=\"box\"/><text x=\"199\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>detection</text><text x=\"199\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">boxes</text><rect x=\"172\" y=\"30\" width=\"28\" height=\"40\" rx=\"1\" class=\"boxi\"/><rect x=\"202\" y=\"40\" width=\"26\" height=\"32\" rx=\"1\" class=\"boxi\"/><rect x=\"242\" y=\"20\" width=\"70\" height=\"60\" rx=\"2\" class=\"box\"/><text x=\"277\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"\" font-weight=600>instance seg</text><text x=\"277\" y=\"110\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">masks</text><polygon points=\"252,70 262,35 272,70\" class=\"boxa\"/><polygon points=\"282,72 294,42 306,72\" class=\"boxr\"/></svg>", "h": "Semantic: color every pixel (cows merge). Instance: each cow gets its own color."}, {"id": "Q10", "t": "Generative", "q": "Match each model to its probability distribution: discriminative, generative, conditional generative.", "a": "Discriminative: p(y|x)\nGenerative: p(x)\nConditional generative: p(x|y)", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Discriminative p(y|x)</text><rect x=\"10\" y=\"26\" width=\"50\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"35.0\" y=\"38.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">one</text><text x=\"35.0\" y=\"49.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">image</text><rect x=\"80\" y=\"40\" width=\"18\" height=\"40\" rx=\"1\" class=\"boxa\"/><text x=\"89\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">cat</text><rect x=\"106\" y=\"65\" width=\"18\" height=\"15\" rx=\"1\" class=\"boxa\"/><text x=\"115\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">dog</text><rect x=\"132\" y=\"75\" width=\"18\" height=\"5\" rx=\"1\" class=\"boxa\"/><text x=\"141\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">ship</text><text x=\"80\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">labels compete</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Generative p(x)</text><rect x=\"185\" y=\"40\" width=\"20\" height=\"40\" rx=\"1\" class=\"boxg\"/><text x=\"195\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">dog</text><rect x=\"215\" y=\"50\" width=\"20\" height=\"30\" rx=\"1\" class=\"boxg\"/><text x=\"225\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">cat</text><rect x=\"245\" y=\"74\" width=\"20\" height=\"6\" rx=\"1\" class=\"boxg\"/><text x=\"255\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">3-leg</text><rect x=\"275\" y=\"78\" width=\"20\" height=\"2\" rx=\"1\" class=\"boxg\"/><text x=\"285\" y=\"94\" text-anchor=\"middle\" font-size=\"8\" class=\"\">noise</text><text x=\"240\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">all images compete</text><text x=\"160\" y=\"126\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">conditional p(x|y): images compete within each label</text></svg>", "h": "Discriminative: given x, which y? Generative: how likely is x at all?"}, {"id": "Q11", "t": "RNN/LSTM", "q": "Explain one shortcoming of RNNs.", "a": "Not parallelizable: hidden states must be computed one step after another. (Also: vanishing/exploding gradients over long sequences.)", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 152\" role=\"img\"><rect x=\"20\" y=\"40\" width=\"50\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"45.0\" y=\"58.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">h1</text><rect x=\"20\" y=\"90\" width=\"50\" height=\"20\" rx=\"4\" class=\"boxr\"/><text x=\"45.0\" y=\"103.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x1</text><line x1=\"45\" y1=\"90\" x2=\"45\" y2=\"71\" class=\"ln\"/><polygon points=\"45,71 47.60979320466738,76.40268261411606 42.39020679533262,76.40268261411606\" class=\"ah\"/><line x1=\"70\" y1=\"55\" x2=\"95\" y2=\"55\" class=\"ln\"/><polygon points=\"95,55 89.59731738588394,57.60979320466738 89.59731738588394,52.39020679533262\" class=\"ah\"/><text x=\"82\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\" font-weight=600>W</text><rect x=\"95\" y=\"40\" width=\"50\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"120.0\" y=\"58.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">h2</text><rect x=\"95\" y=\"90\" width=\"50\" height=\"20\" rx=\"4\" class=\"boxr\"/><text x=\"120.0\" y=\"103.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x2</text><line x1=\"120\" y1=\"90\" x2=\"120\" y2=\"71\" class=\"ln\"/><polygon points=\"120,71 122.60979320466738,76.40268261411606 117.39020679533262,76.40268261411606\" class=\"ah\"/><line x1=\"145\" y1=\"55\" x2=\"170\" y2=\"55\" class=\"ln\"/><polygon points=\"170,55 164.59731738588394,57.60979320466738 164.59731738588394,52.39020679533262\" class=\"ah\"/><text x=\"157\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\" font-weight=600>W</text><rect x=\"170\" y=\"40\" width=\"50\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"195.0\" y=\"58.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">h3</text><rect x=\"170\" y=\"90\" width=\"50\" height=\"20\" rx=\"4\" class=\"boxr\"/><text x=\"195.0\" y=\"103.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x3</text><line x1=\"195\" y1=\"90\" x2=\"195\" y2=\"71\" class=\"ln\"/><polygon points=\"195,71 197.60979320466737,76.40268261411606 192.39020679533263,76.40268261411606\" class=\"ah\"/><line x1=\"220\" y1=\"55\" x2=\"245\" y2=\"55\" class=\"ln\"/><polygon points=\"245,55 239.59731738588394,57.60979320466738 239.59731738588394,52.39020679533262\" class=\"ah\"/><text x=\"232\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\" font-weight=600>W</text><rect x=\"245\" y=\"40\" width=\"50\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"270.0\" y=\"58.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">h4</text><rect x=\"245\" y=\"90\" width=\"50\" height=\"20\" rx=\"4\" class=\"boxr\"/><text x=\"270.0\" y=\"103.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x4</text><line x1=\"270\" y1=\"90\" x2=\"270\" y2=\"71\" class=\"ln\"/><polygon points=\"270,71 272.60979320466737,76.40268261411606 267.39020679533263,76.40268261411606\" class=\"ah\"/><text x=\"160\" y=\"20\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>same W at every step</text><text x=\"160\" y=\"132\" text-anchor=\"middle\" font-size=\"9\" class=\"\">backprop multiplies by W again and again:</text><text x=\"160\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">|W| &gt; 1 explodes (clip it)   |W| &lt; 1 vanishes (LSTM)</text></svg>", "h": "Explode: clip. Vanish: LSTM. RNN must go step by step, so no parallelism."}, {"id": "Q12", "t": "Architectures & BatchNorm", "q": "What problem motivated the development of residual blocks (ResNet)?", "a": "Deeper plain networks did worse than shallower ones even on TRAINING error, so it was an optimization problem, not overfitting. Deep nets struggle to learn identity mappings. Residual blocks output F(x) + x, so extra layers can easily act like identity and a deep model can at least match a shallower one.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 162\" role=\"img\"><rect x=\"110\" y=\"10\" width=\"100\" height=\"24\" rx=\"4\" class=\"box\"/><text x=\"160.0\" y=\"25.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><line x1=\"160\" y1=\"34\" x2=\"160\" y2=\"46\" class=\"ln\"/><polygon points=\"160,46 157.39020679533263,40.59731738588394 162.60979320466737,40.59731738588394\" class=\"ah\"/><rect x=\"110\" y=\"46\" width=\"100\" height=\"24\" rx=\"4\" class=\"boxa\"/><text x=\"160.0\" y=\"61.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">conv 3x3 + ReLU</text><line x1=\"160\" y1=\"70\" x2=\"160\" y2=\"80\" class=\"ln\"/><polygon points=\"160,80 157.39020679533263,74.59731738588394 162.60979320466737,74.59731738588394\" class=\"ah\"/><rect x=\"110\" y=\"80\" width=\"100\" height=\"24\" rx=\"4\" class=\"boxa\"/><text x=\"160.0\" y=\"95.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">conv 3x3</text><line x1=\"160\" y1=\"104\" x2=\"160\" y2=\"114\" class=\"ln\"/><polygon points=\"160,114 157.39020679533263,108.59731738588394 162.60979320466737,108.59731738588394\" class=\"ah\"/><circle cx=\"160\" cy=\"124\" r=\"10\" class=\"boxg\"/><text x=\"160\" y=\"128\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><line x1=\"160\" y1=\"134\" x2=\"160\" y2=\"146\" class=\"ln\"/><polygon points=\"160,146 157.39020679533263,140.59731738588394 162.60979320466737,140.59731738588394\" class=\"ah\"/><text x=\"160\" y=\"156\" text-anchor=\"middle\" font-size=\"10\" class=\"\">ReLU( F(x) + x )</text><path d=\"M210,22 Q270,22 270,70 Q270,124 172,124\" class=\"lng\"/><text x=\"285\" y=\"70\" text-anchor=\"middle\" font-size=\"9\" class=\"\">skip</text><text x=\"285\" y=\"82\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">(identity)</text><text x=\"60\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">F(x)</text></svg>", "h": "If extra layers are useless, set F(x)=0 and the block just passes x through."}, {"id": "Q13", "t": "Loss", "q": "What is the purpose of regularization?", "a": "To prevent overfitting. It adds a penalty (e.g. on large weights) so the model prefers simpler solutions that generalize better instead of fitting noise in the training data.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>no reg: wiggly</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>with reg: simple</text><circle cx=\"20\" cy=\"80\" r=\"3.5\" class=\"acc\"/><circle cx=\"180\" cy=\"80\" r=\"3.5\" class=\"acc\"/><circle cx=\"40\" cy=\"40\" r=\"3.5\" class=\"acc\"/><circle cx=\"200\" cy=\"40\" r=\"3.5\" class=\"acc\"/><circle cx=\"60\" cy=\"70\" r=\"3.5\" class=\"acc\"/><circle cx=\"220\" cy=\"70\" r=\"3.5\" class=\"acc\"/><circle cx=\"80\" cy=\"30\" r=\"3.5\" class=\"acc\"/><circle cx=\"240\" cy=\"30\" r=\"3.5\" class=\"acc\"/><circle cx=\"100\" cy=\"60\" r=\"3.5\" class=\"acc\"/><circle cx=\"260\" cy=\"60\" r=\"3.5\" class=\"acc\"/><circle cx=\"120\" cy=\"35\" r=\"3.5\" class=\"acc\"/><circle cx=\"280\" cy=\"35\" r=\"3.5\" class=\"acc\"/><circle cx=\"140\" cy=\"55\" r=\"3.5\" class=\"acc\"/><circle cx=\"300\" cy=\"55\" r=\"3.5\" class=\"acc\"/><polyline points=\"20,80 40,40 60,70 80,30 100,60 120,35 140,55\" class=\"lnr\"/><polyline points=\"170,85 310,30\" class=\"lng\"/><text x=\"80\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">fits noise: overfits</text><text x=\"240\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">generalizes</text><text x=\"160\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"\">loss = data loss + lambda x R(W)</text></svg>", "h": "Regularization = a tax on complexity. Prefer the simpler curve."}, {"id": "Q14", "t": "Training", "q": "Explain one result of momentum on the training process.", "a": "Momentum keeps a velocity (a running average of past gradients) and steps along it. It carries the weights through local minima and saddle points where the gradient is ~0, smooths out noisy minibatch gradients, and damps zig-zagging, so training converges faster.", "f": "fixed", "d": "<svg class=\"dg\" viewBox=\"0 0 320 118\" role=\"img\"><ellipse cx=\"160\" cy=\"60\" rx=\"156.0\" ry=\"60\" class=\"ring\"/><ellipse cx=\"160\" cy=\"60\" rx=\"104.0\" ry=\"40\" class=\"ring\"/><ellipse cx=\"160\" cy=\"60\" rx=\"52.0\" ry=\"20\" class=\"ring\"/><circle cx=\"160\" cy=\"60\" r=\"4\" class=\"good\"/><polyline points=\"20,30 45,90 70,32 95,86 120,40 140,78\" class=\"lnr\"/><text x=\"60\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">SGD: zig-zag</text><polyline points=\"300,92 255,78 215,68 178,62\" class=\"lng\"/><text x=\"250\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" class=\"good\">momentum: smooth</text></svg>", "h": "Momentum = a rolling ball. Zig-zags cancel, steady direction builds speed."}, {"id": "Q15", "t": "Hardware/PyTorch", "q": "Match the three core PyTorch concepts: Tensor, Autograd, Module.", "a": "Tensor: like a numpy array but can run on a GPU.\nAutograd: with requires_grad=True, PyTorch builds a computational graph and computes gradients automatically.\nModule: a neural network layer; may hold state or learnable weights.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 72\" role=\"img\"><rect x=\"10\" y=\"20\" width=\"95\" height=\"44\" rx=\"4\" class=\"boxa\"/><text x=\"57.5\" y=\"39.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">Tensor</text><text x=\"57.5\" y=\"50.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">numpy on GPU</text><rect x=\"112\" y=\"20\" width=\"95\" height=\"44\" rx=\"4\" class=\"boxg\"/><text x=\"159.5\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">Autograd</text><text x=\"159.5\" y=\"45.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">builds graph,</text><text x=\"159.5\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">auto gradients</text><rect x=\"214\" y=\"20\" width=\"95\" height=\"44\" rx=\"4\" class=\"box\"/><text x=\"261.5\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">Module</text><text x=\"261.5\" y=\"45.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">a layer with</text><text x=\"261.5\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">weights</text></svg>", "h": "T-A-M: Tensor holds numbers, Autograd gets gradients, Module is a layer."}, {"id": "Q16", "t": "Optimization & NN", "q": "What happens if you build a multi-layer neural network with no activation functions?", "a": "It collapses into a linear classifier: W2(W1 x) = (W2 W1) x = W x. Depth adds nothing without nonlinearity.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 118\" role=\"img\"><rect x=\"10\" y=\"20\" width=\"40\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"30.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><line x1=\"50\" y1=\"35\" x2=\"70\" y2=\"35\" class=\"ln\"/><polygon points=\"70,35 64.59731738588394,37.60979320466738 64.59731738588394,32.39020679533262\" class=\"ah\"/><rect x=\"72\" y=\"20\" width=\"40\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"92.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">W1</text><line x1=\"112\" y1=\"35\" x2=\"132\" y2=\"35\" class=\"ln\"/><polygon points=\"132,35 126.59731738588394,37.60979320466738 126.59731738588394,32.39020679533262\" class=\"ah\"/><rect x=\"134\" y=\"20\" width=\"40\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"154.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">W2</text><line x1=\"174\" y1=\"35\" x2=\"194\" y2=\"35\" class=\"ln\"/><polygon points=\"194,35 188.59731738588394,37.60979320466738 188.59731738588394,32.39020679533262\" class=\"ah\"/><rect x=\"196\" y=\"20\" width=\"40\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"216.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">out</text><text x=\"160\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">no activation in between, so:</text><rect x=\"10\" y=\"82\" width=\"40\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"30.0\" y=\"100.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><line x1=\"50\" y1=\"97\" x2=\"70\" y2=\"97\" class=\"ln\"/><polygon points=\"70,97 64.59731738588394,99.60979320466738 64.59731738588394,94.39020679533262\" class=\"ah\"/><rect x=\"72\" y=\"82\" width=\"104\" height=\"30\" rx=\"4\" class=\"boxr\"/><text x=\"124.0\" y=\"100.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">W = W2 x W1</text><line x1=\"176\" y1=\"97\" x2=\"196\" y2=\"97\" class=\"ln\"/><polygon points=\"196,97 190.59731738588394,99.60979320466738 190.59731738588394,94.39020679533262\" class=\"ah\"/><rect x=\"198\" y=\"82\" width=\"40\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"218.0\" y=\"100.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">out</text><text x=\"282\" y=\"97\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">still linear</text></svg>", "h": "Matrix times matrix is just one matrix. ReLU breaks the chain."}, {"id": "Q17", "t": "Optimization & NN", "q": "Which statement about computing gradients is true?", "a": "Use the analytic gradient (fast, exact) in practice, and check it against the numerical gradient (slow, approximate, easy to write). This is called a gradient check.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 116\" role=\"img\"><path d=\"M20,90 Q120,0 220,60\" class=\"ln\"/><text x=\"260\" y=\"40\" text-anchor=\"middle\" font-size=\"9\" class=\"\">numeric:</text><text x=\"260\" y=\"52\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">(L(W+h)-L(W))/h</text><text x=\"260\" y=\"64\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">slow, approximate</text><text x=\"260\" y=\"84\" text-anchor=\"middle\" font-size=\"9\" class=\"\">analytic: calculus</text><text x=\"260\" y=\"96\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">fast, exact</text><circle cx=\"70\" cy=\"52\" r=\"4\" class=\"acc\"/><circle cx=\"85\" cy=\"45\" r=\"4\" class=\"acc\"/><line x1=\"40\" y1=\"66\" x2=\"120\" y2=\"30\" class=\"lna\"/><text x=\"78\" y=\"108\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">tiny nudge h</text></svg>", "h": "Use analytic (fast). Check it with numeric (gradient check)."}, {"id": "Q18", "t": "CNN layers", "q": "What are the five components of a CNN?", "a": "1. Convolution layers  2. Pooling layers  3. Fully connected layers  4. Activation functions  5. Normalization", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 88\" role=\"img\"><rect x=\"8\" y=\"30\" width=\"56\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"36.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">conv</text><line x1=\"64\" y1=\"45\" x2=\"70\" y2=\"45\" class=\"ln\"/><polygon points=\"70,45 64.59731738588394,47.60979320466738 64.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"70\" y=\"30\" width=\"56\" height=\"30\" rx=\"4\" class=\"boxg\"/><text x=\"98.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">ReLU</text><line x1=\"126\" y1=\"45\" x2=\"132\" y2=\"45\" class=\"ln\"/><polygon points=\"132,45 126.59731738588394,47.60979320466738 126.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"132\" y=\"30\" width=\"56\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"160.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">pool</text><line x1=\"188\" y1=\"45\" x2=\"194\" y2=\"45\" class=\"ln\"/><polygon points=\"194,45 188.59731738588394,47.60979320466738 188.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"194\" y=\"30\" width=\"56\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"222.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">norm</text><line x1=\"250\" y1=\"45\" x2=\"256\" y2=\"45\" class=\"ln\"/><polygon points=\"256,45 250.59731738588394,47.60979320466738 250.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"256\" y=\"30\" width=\"56\" height=\"30\" rx=\"4\" class=\"boxr\"/><text x=\"284.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">FC</text><text x=\"160\" y=\"82\" text-anchor=\"middle\" font-size=\"10\" class=\"mut\">the 5 building blocks of a CNN</text></svg>", "h": "C-A-P-N-F: Conv, Activation, Pool, Norm, Fully connected."}, {"id": "Q19", "t": "CNN layers", "q": "True or false: pooling has learnable parameters.", "a": "False.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><rect x=\"10\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"21.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"32\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"43.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"54\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"65.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"76\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"87.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4</text><rect x=\"10\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"21.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">5</text><rect x=\"32\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"43.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">6</text><rect x=\"54\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"65.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">7</text><rect x=\"76\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"87.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">8</text><rect x=\"10\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"21.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><rect x=\"32\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"43.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"54\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"65.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"76\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"87.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">0</text><rect x=\"10\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"21.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"32\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"43.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"54\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"65.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><rect x=\"76\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"87.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4</text><line x1=\"102\" y1=\"64\" x2=\"122\" y2=\"64\" class=\"ln\"/><polygon points=\"122,64 116.59731738588394,66.60979320466738 116.59731738588394,61.39020679533262\" class=\"ah\"/><text x=\"160\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>max</text><rect x=\"130\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"141.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">6</text><rect x=\"152\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"163.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">8</text><rect x=\"130\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"141.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><rect x=\"152\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"163.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4</text><text x=\"260\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>average</text><rect x=\"225\" y=\"42\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxa\"/><text x=\"240.0\" y=\"60.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3.25</text><rect x=\"255\" y=\"42\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxg\"/><text x=\"270.0\" y=\"60.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">5.25</text><rect x=\"225\" y=\"72\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxr\"/><text x=\"240.0\" y=\"90.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"255\" y=\"72\" width=\"30\" height=\"30\" rx=\"1\" class=\"box\"/><text x=\"270.0\" y=\"90.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><text x=\"160\" y=\"124\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">2x2, stride 2: 4x4 -&gt; 2x2.  0 learnable parameters</text></svg>", "h": "Pooling just picks the max (or mean) of each block. Nothing to learn."}, {"id": "Q20", "t": "Basics/KNN/Linear", "q": "What is the difference between deep learning and traditional machine learning?", "a": "Traditional ML needs hand-crafted features fed to a trainable classifier. Deep learning is end-to-end: the network learns the relevant features directly from raw data, layer by layer, together with the classifier.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 152\" role=\"img\"><text x=\"10\" y=\"16\" text-anchor=\"start\" font-size=\"11\" class=\"\" font-weight=600>Traditional ML</text><rect x=\"10\" y=\"24\" width=\"60\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"40.0\" y=\"42.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">image</text><line x1=\"70\" y1=\"39\" x2=\"86\" y2=\"39\" class=\"ln\"/><polygon points=\"86,39 80.59731738588394,41.60979320466738 80.59731738588394,36.39020679533262\" class=\"ah\"/><rect x=\"88\" y=\"24\" width=\"92\" height=\"30\" rx=\"4\" class=\"boxr\"/><text x=\"134.0\" y=\"36.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">hand-made</text><text x=\"134.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">features</text><line x1=\"180\" y1=\"39\" x2=\"196\" y2=\"39\" class=\"ln\"/><polygon points=\"196,39 190.59731738588394,41.60979320466738 190.59731738588394,36.39020679533262\" class=\"ah\"/><rect x=\"198\" y=\"24\" width=\"70\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"233.0\" y=\"42.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">classifier</text><text x=\"134\" y=\"66\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">human designs</text><text x=\"233\" y=\"66\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">learned</text><text x=\"10\" y=\"92\" text-anchor=\"start\" font-size=\"11\" class=\"\" font-weight=600>Deep learning (end-to-end)</text><rect x=\"10\" y=\"100\" width=\"50\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"35.0\" y=\"118.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">image</text><line x1=\"60\" y1=\"115\" x2=\"68\" y2=\"115\" class=\"ln\"/><polygon points=\"68,115 62.59731738588394,117.60979320466738 62.59731738588394,112.39020679533262\" class=\"ah\"/><rect x=\"70\" y=\"100\" width=\"52\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"96.0\" y=\"118.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">edges</text><line x1=\"120\" y1=\"115\" x2=\"128\" y2=\"115\" class=\"ln\"/><polygon points=\"128,115 122.59731738588394,117.60979320466738 122.59731738588394,112.39020679533262\" class=\"ah\"/><rect x=\"130\" y=\"100\" width=\"52\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"156.0\" y=\"118.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">parts</text><line x1=\"180\" y1=\"115\" x2=\"188\" y2=\"115\" class=\"ln\"/><polygon points=\"188,115 182.59731738588394,117.60979320466738 182.59731738588394,112.39020679533262\" class=\"ah\"/><rect x=\"190\" y=\"100\" width=\"52\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"216.0\" y=\"118.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">objects</text><line x1=\"242\" y1=\"115\" x2=\"250\" y2=\"115\" class=\"ln\"/><polygon points=\"250,115 244.59731738588394,117.60979320466738 244.59731738588394,112.39020679533262\" class=\"ah\"/><rect x=\"252\" y=\"100\" width=\"64\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"284.0\" y=\"118.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">classifier</text><text x=\"160\" y=\"146\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">every box learned together</text></svg>", "h": "Shallow = human picks features. Deep = the net learns features too, all the way from pixels to answer."}, {"id": "Q21", "t": "Architectures & BatchNorm", "q": "What are the 4 techniques GoogLeNet uses for efficiency?", "a": "Aggressive stem, inception module (with 1x1 bottleneck convs), global average pooling instead of FC layers, auxiliary classifiers.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 112\" role=\"img\"><rect x=\"5\" y=\"30\" width=\"48\" height=\"30\" rx=\"4\" class=\"boxr\"/><text x=\"29.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">stem</text><text x=\"29\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>1</text><line x1=\"53\" y1=\"45\" x2=\"62\" y2=\"45\" class=\"ln\"/><polygon points=\"62,45 56.59731738588394,47.60979320466738 56.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"68\" y=\"8\" width=\"40\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"88.0\" y=\"20.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1x1</text><line x1=\"62\" y1=\"45\" x2=\"68\" y2=\"17\" class=\"ln\"/><line x1=\"108\" y1=\"17\" x2=\"118\" y2=\"45\" class=\"ln\"/><rect x=\"68\" y=\"29\" width=\"40\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"88.0\" y=\"41.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3x3</text><line x1=\"62\" y1=\"45\" x2=\"68\" y2=\"38\" class=\"ln\"/><line x1=\"108\" y1=\"38\" x2=\"118\" y2=\"45\" class=\"ln\"/><rect x=\"68\" y=\"50\" width=\"40\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"88.0\" y=\"62.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">5x5</text><line x1=\"62\" y1=\"45\" x2=\"68\" y2=\"59\" class=\"ln\"/><line x1=\"108\" y1=\"59\" x2=\"118\" y2=\"45\" class=\"ln\"/><rect x=\"68\" y=\"71\" width=\"40\" height=\"18\" rx=\"4\" class=\"boxa\"/><text x=\"88.0\" y=\"83.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">pool</text><line x1=\"62\" y1=\"45\" x2=\"68\" y2=\"80\" class=\"ln\"/><line x1=\"108\" y1=\"80\" x2=\"118\" y2=\"45\" class=\"ln\"/><rect x=\"118\" y=\"34\" width=\"34\" height=\"22\" rx=\"4\" class=\"box\"/><text x=\"135.0\" y=\"47.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">concat</text><text x=\"88\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2 inception</text><line x1=\"152\" y1=\"45\" x2=\"162\" y2=\"45\" class=\"ln\"/><polygon points=\"162,45 156.59731738588394,47.60979320466738 156.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"164\" y=\"30\" width=\"44\" height=\"30\" rx=\"4\" class=\"boxg\"/><text x=\"186.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">GAP</text><text x=\"186\" y=\"22\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>3</text><line x1=\"208\" y1=\"45\" x2=\"216\" y2=\"45\" class=\"ln\"/><polygon points=\"216,45 210.59731738588394,47.60979320466738 210.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"218\" y=\"30\" width=\"30\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"233.0\" y=\"48.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">FC</text><rect x=\"258\" y=\"12\" width=\"58\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"287.0\" y=\"28.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">aux</text><rect x=\"258\" y=\"52\" width=\"58\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"287.0\" y=\"68.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">aux</text><text x=\"287\" y=\"92\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4 aux</text><text x=\"287\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"\">classifiers</text><text x=\"29\" y=\"76\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">downsample</text><text x=\"29\" y=\"86\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">fast</text><text x=\"186\" y=\"76\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">no big FC</text></svg>", "h": "S-I-G-A: Stem, Inception, Global avg pool, Aux classifiers."}, {"id": "Q22", "t": "Generative", "q": "What are the two networks in a GAN and the role of each?", "a": "Generator: turns random noise z into fake data, trying to fool the discriminator.\nDiscriminator: classifies inputs as real or fake.\nThey are trained together as a minimax game.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 124\" role=\"img\"><rect x=\"5\" y=\"20\" width=\"30\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"20.0\" y=\"36.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">z</text><line x1=\"35\" y1=\"33\" x2=\"52\" y2=\"33\" class=\"ln\"/><polygon points=\"52,33 46.59731738588394,35.60979320466738 46.59731738588394,30.390206795332617\" class=\"ah\"/><rect x=\"54\" y=\"18\" width=\"52\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"80.0\" y=\"37.2\" text-anchor=\"middle\" font-size=\"12\" class=\"\">G</text><line x1=\"106\" y1=\"33\" x2=\"124\" y2=\"33\" class=\"ln\"/><polygon points=\"124,33 118.59731738588394,35.60979320466738 118.59731738588394,30.390206795332617\" class=\"ah\"/><rect x=\"126\" y=\"20\" width=\"44\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"148.0\" y=\"36.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fake</text><rect x=\"126\" y=\"70\" width=\"44\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"148.0\" y=\"86.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">real</text><line x1=\"170\" y1=\"33\" x2=\"200\" y2=\"50\" class=\"ln\"/><polygon points=\"200,50 194.01288540244917,49.60698753735583 196.58620712279173,45.065831560280685\" class=\"ah\"/><line x1=\"170\" y1=\"83\" x2=\"200\" y2=\"64\" class=\"ln\"/><polygon points=\"200,64 196.8320859540476,69.09551965921608 194.03933538281152,64.68591349410647\" class=\"ah\"/><rect x=\"202\" y=\"40\" width=\"52\" height=\"34\" rx=\"4\" class=\"boxg\"/><text x=\"228.0\" y=\"61.2\" text-anchor=\"middle\" font-size=\"12\" class=\"\">D</text><line x1=\"254\" y1=\"57\" x2=\"268\" y2=\"57\" class=\"ln\"/><polygon points=\"268,57 262.5973173858839,59.60979320466738 262.5973173858839,54.39020679533262\" class=\"ah\"/><rect x=\"270\" y=\"44\" width=\"46\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"293.0\" y=\"54.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">real?</text><text x=\"293.0\" y=\"64.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">fake?</text><path d=\"M228,40 Q180,0 80,18\" class=\"lnr\"/><text x=\"150\" y=\"8\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">G wants D(fake) = 1</text><text x=\"228\" y=\"96\" text-anchor=\"middle\" font-size=\"8\" class=\"good\">D wants real=1, fake=0</text><text x=\"160\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">min_G max_D E[log D(x)] + E[log(1 - D(G(z)))]</text></svg>", "h": "Counterfeiter (G) vs police (D). G improves by fooling D."}, {"id": "Q23", "t": "Optimization & NN", "q": "Is the result of Laplacian filtering an enhanced image compared to the original?", "a": "No. It highlights edges and discontinuities only. To get the sharpened (enhanced) image: original - Laplacian, g(x,y) = f(x,y) - Laplacian of f.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 116\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Laplacian kernel</text><rect x=\"40\" y=\"22\" width=\"24\" height=\"24\" rx=\"1\" class=\"box\"/><text x=\"52.0\" y=\"37.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">0</text><rect x=\"64\" y=\"22\" width=\"24\" height=\"24\" rx=\"1\" class=\"boxa\"/><text x=\"76.0\" y=\"37.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"88\" y=\"22\" width=\"24\" height=\"24\" rx=\"1\" class=\"box\"/><text x=\"100.0\" y=\"37.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">0</text><rect x=\"40\" y=\"46\" width=\"24\" height=\"24\" rx=\"1\" class=\"boxa\"/><text x=\"52.0\" y=\"61.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"64\" y=\"46\" width=\"24\" height=\"24\" rx=\"1\" class=\"boxr\"/><text x=\"76.0\" y=\"61.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">-4</text><rect x=\"88\" y=\"46\" width=\"24\" height=\"24\" rx=\"1\" class=\"boxa\"/><text x=\"100.0\" y=\"61.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"40\" y=\"70\" width=\"24\" height=\"24\" rx=\"1\" class=\"box\"/><text x=\"52.0\" y=\"85.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">0</text><rect x=\"64\" y=\"70\" width=\"24\" height=\"24\" rx=\"1\" class=\"boxa\"/><text x=\"76.0\" y=\"85.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"88\" y=\"70\" width=\"24\" height=\"24\" rx=\"1\" class=\"box\"/><text x=\"100.0\" y=\"85.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">0</text><text x=\"100\" y=\"108\" text-anchor=\"middle\" font-size=\"9\" class=\"\">(up+down+left+right) - 4 x center</text><text x=\"235\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>sharpen</text><rect x=\"160\" y=\"30\" width=\"46\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"183.0\" y=\"46.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">original</text><text x=\"213\" y=\"47\" text-anchor=\"middle\" font-size=\"11\" class=\"\">-</text><rect x=\"220\" y=\"30\" width=\"40\" height=\"26\" rx=\"4\" class=\"boxr\"/><text x=\"240.0\" y=\"46.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">edges</text><text x=\"266\" y=\"47\" text-anchor=\"middle\" font-size=\"11\" class=\"\">=</text><rect x=\"274\" y=\"30\" width=\"42\" height=\"26\" rx=\"4\" class=\"boxg\"/><text x=\"295.0\" y=\"46.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">sharp</text><text x=\"240\" y=\"80\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">Laplacian alone =</text><text x=\"240\" y=\"92\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">edge map, not enhanced</text></svg>", "h": "Plus sign of 1s, -4 in the middle. Sharpened = original MINUS Laplacian."}, {"id": "Q24", "t": "CNN layers", "q": "Can pooling layers help control overfitting? (Y/N)", "a": "Yes. Pooling downsamples, reducing the size of the feature maps, so later layers need fewer parameters and less computation, which helps control overfitting.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><rect x=\"10\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"21.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"32\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"43.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"54\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"65.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"76\" y=\"20\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"87.0\" y=\"34.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4</text><rect x=\"10\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"21.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">5</text><rect x=\"32\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><text x=\"43.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">6</text><rect x=\"54\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"65.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">7</text><rect x=\"76\" y=\"42\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><text x=\"87.0\" y=\"56.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">8</text><rect x=\"10\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"21.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><rect x=\"32\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"43.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"54\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"65.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"76\" y=\"64\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"87.0\" y=\"78.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">0</text><rect x=\"10\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"21.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1</text><rect x=\"32\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><text x=\"43.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2</text><rect x=\"54\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"65.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">3</text><rect x=\"76\" y=\"86\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"87.0\" y=\"100.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">4</text><line x1=\"102\" y1=\"64\

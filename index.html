\"160\" y=\"96\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">matrix multiply = many independent dot products</text></svg>", "h": "GPU wins at many small identical jobs at once, like matrix multiplies."}, {"id": "Q85", "t": "CNN layers", "q": "Why do fully connected layers have more parameters than conv layers in CNNs?", "a": "FC: one weight per (input, output) pair plus a bias per output. Conv: weights only for the small filter (Cin x K x K per filter) shared across all positions, plus one bias per output channel. E.g. AlexNet: nearly all parameters are in the FC layers.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Fully connected</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"11\" class=\"\" font-weight=600>Conv: shared filter</text><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"30\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"48\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"66\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"84\" x2=\"130\" y2=\"96\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"36\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"56\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"76\" class=\"lnf\"/><line x1=\"30\" y1=\"102\" x2=\"130\" y2=\"96\" class=\"lnf\"/><circle cx=\"30\" cy=\"30\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"48\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"66\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"84\" r=\"5\" class=\"acc\"/><circle cx=\"30\" cy=\"102\" r=\"5\" class=\"acc\"/><circle cx=\"130\" cy=\"36\" r=\"5\" class=\"good\"/><circle cx=\"130\" cy=\"56\" r=\"5\" class=\"good\"/><circle cx=\"130\" cy=\"76\" r=\"5\" class=\"good\"/><circle cx=\"130\" cy=\"96\" r=\"5\" class=\"good\"/><line x1=\"190\" y1=\"30\" x2=\"290\" y2=\"48\" class=\"lna\"/><line x1=\"190\" y1=\"48\" x2=\"290\" y2=\"48\" class=\"lng\"/><line x1=\"190\" y1=\"66\" x2=\"290\" y2=\"48\" class=\"lnr\"/><line x1=\"190\" y1=\"48\" x2=\"290\" y2=\"66\" class=\"lna\"/><line x1=\"190\" y1=\"66\" x2=\"290\" y2=\"66\" class=\"lng\"/><line x1=\"190\" y1=\"84\" x2=\"290\" y2=\"66\" class=\"lnr\"/><line x1=\"190\" y1=\"66\" x2=\"290\" y2=\"84\" class=\"lna\"/><line x1=\"190\" y1=\"84\" x2=\"290\" y2=\"84\" class=\"lng\"/><line x1=\"190\" y1=\"102\" x2=\"290\" y2=\"84\" class=\"lnr\"/><circle cx=\"190\" cy=\"30\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"48\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"66\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"84\" r=\"5\" class=\"acc\"/><circle cx=\"190\" cy=\"102\" r=\"5\" class=\"acc\"/><circle cx=\"290\" cy=\"48\" r=\"5\" class=\"good\"/><circle cx=\"290\" cy=\"66\" r=\"5\" class=\"good\"/><circle cx=\"290\" cy=\"84\" r=\"5\" class=\"good\"/><text x=\"80\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">every input to every output</text><text x=\"240\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">same 3 weights reused, local</text></svg>", "h": "FC: everyone talks to everyone (huge). Conv: one small filter slides and is reused."}, {"id": "Q86", "t": "Basics/KNN/Linear", "q": "How do neural networks and SVMs compare in performance?", "a": "Not directly from the slides. Common answer: SVMs are expensive to train on large data; neural networks are more flexible and scalable; SVMs overfit less easily. Slides' angle: a linear (SVM) classifier learns one template per class with straight boundaries, while a neural net's hidden layer learns many templates and nonlinear boundaries.", "f": "fixed", "d": "<svg class=\"dg\" viewBox=\"0 0 320 108\" role=\"img\"><text x=\"90\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Linear: 1 template/class</text><rect x=\"20\" y=\"22\" width=\"46\" height=\"40\" rx=\"4\" class=\"box\"/><text x=\"43.0\" y=\"39.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">horse</text><text x=\"43.0\" y=\"50.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">left</text><text x=\"76\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><rect x=\"86\" y=\"22\" width=\"46\" height=\"40\" rx=\"4\" class=\"box\"/><text x=\"109.0\" y=\"39.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">horse</text><text x=\"109.0\" y=\"50.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">right</text><line x1=\"136\" y1=\"42\" x2=\"150\" y2=\"42\" class=\"ln\"/><polygon points=\"150,42 144.59731738588394,44.60979320466738 144.59731738588394,39.39020679533262\" class=\"ah\"/><rect x=\"152\" y=\"22\" width=\"60\" height=\"40\" rx=\"4\" class=\"boxr\"/><text x=\"182.0\" y=\"39.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2-headed</text><text x=\"182.0\" y=\"50.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">template</text><text x=\"258\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>XOR: no line</text><circle cx=\"230\" cy=\"35\" r=\"8\" class=\"acc\"/><circle cx=\"280\" cy=\"70\" r=\"8\" class=\"acc\"/><circle cx=\"280\" cy=\"35\" r=\"8\" class=\"bad\"/><circle cx=\"230\" cy=\"70\" r=\"8\" class=\"bad\"/><line x1=\"215\" y1=\"90\" x2=\"300\" y2=\"20\" class=\"lnr\"/><text x=\"255\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">any line mixes them</text><text x=\"80\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" class=\"good\">Neural net: many templates</text><text x=\"80\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">(left horse AND right horse)</text></svg>", "h": "One line, one template: can't do OR / XOR / rings. Hidden layer = many templates."}, {"id": "Q87", "t": "Optimization & NN", "q": "How do a high and a low learning rate affect your network?", "a": "High: overshoots the minimum, oscillates, loss can explode to Inf/NaN. Low: very slow convergence, loss barely goes down.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 108\" role=\"img\"><text x=\"55\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>too high</text><path d=\"M5,24 Q55,120 105,24\" class=\"ln\"/><line x1=\"18\" y1=\"40\" x2=\"88\" y2=\"46\" class=\"lnr\"/><polygon points=\"88,46 82.39417596323257,48.13886345258422 82.8399345999461,42.938346024259666\" class=\"ah\"/><line x1=\"88\" y1=\"46\" x2=\"16\" y2=\"36\" class=\"lnr\"/><polygon points=\"16,36 21.710340384243572,34.15825824392317 20.992290383183896,39.32821825155286\" class=\"ah\"/><line x1=\"16\" y1=\"36\" x2=\"94\" y2=\"30\" class=\"lnr\"/><polygon points=\"94,30 88.81339306746534,33.0164728620333 88.413069064243,27.81226082014298\" class=\"ah\"/><text x=\"162\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>too low</text><path d=\"M112,24 Q162,120 212,24\" class=\"ln\"/><line x1=\"125\" y1=\"42\" x2=\"129\" y2=\"49\" class=\"lnr\"/><polygon points=\"129,49 124.05358373123806,45.60397790111324 128.585453835869,43.01433784132413\" class=\"ah\"/><line x1=\"129\" y1=\"49\" x2=\"133\" y2=\"55\" class=\"lnr\"/><polygon points=\"133,55 127.8316516897028,51.952349143447044 132.1746100979116,49.057043537974515\" class=\"ah\"/><line x1=\"133\" y1=\"55\" x2=\"137\" y2=\"60\" class=\"lnr\"/><polygon points=\"137,60 131.5870648148322,57.411538549413535 135.66287704007442,54.150888769219726\" class=\"ah\"/><text x=\"269\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>just right</text><path d=\"M219,24 Q269,120 319,24\" class=\"ln\"/><line x1=\"232\" y1=\"42\" x2=\"255\" y2=\"63\" class=\"lng\"/><polygon points=\"255,63 249.25049365683932,61.28443105356991 252.76990086551587,57.429842205971795\" class=\"ah\"/><line x1=\"255\" y1=\"63\" x2=\"269\" y2=\"71\" class=\"lng\"/><polygon points=\"269,71 263.0143378413241,70.585453835869 265.60397790111324,66.05358373123806\" class=\"ah\"/><text x=\"55\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">overshoots</text><text x=\"162\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">crawls</text><text x=\"269\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">converges</text></svg>", "h": "Learning rate = step size. Too big bounces out, too small takes forever."}, {"id": "Q88", "t": "Optimization & NN", "q": "Why are hidden layers necessary in a network?", "a": "Hidden layers with nonlinear activations let the network learn intermediate features (many templates) and nonlinear boundaries. Without them it's just a linear classifier.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 108\" role=\"img\"><text x=\"90\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>Linear: 1 template/class</text><rect x=\"20\" y=\"22\" width=\"46\" height=\"40\" rx=\"4\" class=\"box\"/><text x=\"43.0\" y=\"39.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">horse</text><text x=\"43.0\" y=\"50.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">left</text><text x=\"76\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><rect x=\"86\" y=\"22\" width=\"46\" height=\"40\" rx=\"4\" class=\"box\"/><text x=\"109.0\" y=\"39.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">horse</text><text x=\"109.0\" y=\"50.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">right</text><line x1=\"136\" y1=\"42\" x2=\"150\" y2=\"42\" class=\"ln\"/><polygon points=\"150,42 144.59731738588394,44.60979320466738 144.59731738588394,39.39020679533262\" class=\"ah\"/><rect x=\"152\" y=\"22\" width=\"60\" height=\"40\" rx=\"4\" class=\"boxr\"/><text x=\"182.0\" y=\"39.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">2-headed</text><text x=\"182.0\" y=\"50.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">template</text><text x=\"258\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>XOR: no line</text><circle cx=\"230\" cy=\"35\" r=\"8\" class=\"acc\"/><circle cx=\"280\" cy=\"70\" r=\"8\" class=\"acc\"/><circle cx=\"280\" cy=\"35\" r=\"8\" class=\"bad\"/><circle cx=\"230\" cy=\"70\" r=\"8\" class=\"bad\"/><line x1=\"215\" y1=\"90\" x2=\"300\" y2=\"20\" class=\"lnr\"/><text x=\"255\" y=\"102\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">any line mixes them</text><text x=\"80\" y=\"84\" text-anchor=\"middle\" font-size=\"10\" class=\"good\">Neural net: many templates</text><text x=\"80\" y=\"98\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">(left horse AND right horse)</text></svg>", "h": "One line, one template: can't do OR / XOR / rings. Hidden layer = many templates."}, {"id": "Q92", "t": "Detection & Segmentation", "q": "Three limitations of the original YOLO model?", "a": "Struggles with small objects, struggles with unusual aspect ratios, poor localization.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"160\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\">R-CNN: ~2000 Selective Search regions, CNN on EACH (slow)</text><text x=\"160\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" class=\"\">Fast R-CNN: CNN once, crop features (RoI pool)</text><text x=\"160\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">Faster R-CNN: learned Region Proposal Network</text><text x=\"160\" y=\"68\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">YOLO: one pass, S x S grid, B boxes per cell</text><rect x=\"110\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"110\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"110\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"110\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"84\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxi\"/><text x=\"240\" y=\"100\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">cell: x, y, w, h,</text><text x=\"240\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">confidence + class</text></svg>", "h": "R-CNN family: propose then classify. YOLO: you only look once."}, {"id": "Q93", "t": "Detection & Segmentation", "q": "Compare the object detection mechanisms of YOLO and R-CNN.", "a": "R-CNN: two stages. Propose ~2000 regions (Selective Search), resize each, run a CNN on each region to classify and refine the box. Accurate but very slow.\nYOLO: single stage. Split the image into an SxS grid; each cell predicts B boxes (x, y, w, h, confidence) and class scores in one forward pass. Fast, looks at the whole image.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><text x=\"160\" y=\"12\" text-anchor=\"middle\" font-size=\"9\" class=\"\">R-CNN: ~2000 Selective Search regions, CNN on EACH (slow)</text><text x=\"160\" y=\"30\" text-anchor=\"middle\" font-size=\"9\" class=\"\">Fast R-CNN: CNN once, crop features (RoI pool)</text><text x=\"160\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">Faster R-CNN: learned Region Proposal Network</text><text x=\"160\" y=\"68\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">YOLO: one pass, S x S grid, B boxes per cell</text><rect x=\"110\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"76\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"110\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"88\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"110\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"100\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"110\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"134\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"146\" y=\"112\" width=\"12\" height=\"12\" rx=\"1\" class=\"box\"/><rect x=\"122\" y=\"84\" width=\"30\" height=\"30\" rx=\"1\" class=\"boxi\"/><text x=\"240\" y=\"100\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">cell: x, y, w, h,</text><text x=\"240\" y=\"112\" text-anchor=\"middle\" font-size=\"8\" class=\"mut\">confidence + class</text></svg>", "h": "R-CNN family: propose then classify. YOLO: you only look once."}, {"id": "Q94", "t": "Generative", "q": "Two advantages and two disadvantages of VAEs?", "a": "Advantages: principled probabilistic approach to generative models; learns useful latent features q(z|x) for other tasks; fast generation.\nDisadvantages: maximizes only a lower bound on likelihood (worse evaluation than PixelRNN/PixelCNN); samples blurrier and lower quality than GANs.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 114\" role=\"img\"><rect x=\"5\" y=\"30\" width=\"30\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"20.0\" y=\"48.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><line x1=\"35\" y1=\"45\" x2=\"48\" y2=\"45\" class=\"ln\"/><polygon points=\"48,45 42.59731738588394,47.60979320466738 42.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"50\" y=\"25\" width=\"46\" height=\"40\" rx=\"4\" class=\"boxa\"/><text x=\"73.0\" y=\"48.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">encoder</text><line x1=\"96\" y1=\"38\" x2=\"108\" y2=\"30\" class=\"ln\"/><polygon points=\"108,30 104.95234914344705,35.16834831029721 102.05704353797451,30.825389902088414\" class=\"ah\"/><line x1=\"96\" y1=\"52\" x2=\"108\" y2=\"60\" class=\"ln\"/><polygon points=\"108,60 102.05704353797451,59.17461009791159 104.95234914344705,54.83165168970279\" class=\"ah\"/><rect x=\"110\" y=\"18\" width=\"34\" height=\"22\" rx=\"4\" class=\"box\"/><text x=\"127.0\" y=\"32.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">mu</text><rect x=\"110\" y=\"50\" width=\"34\" height=\"22\" rx=\"4\" class=\"box\"/><text x=\"127.0\" y=\"64.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">sigma</text><line x1=\"144\" y1=\"45\" x2=\"158\" y2=\"45\" class=\"ln\"/><polygon points=\"158,45 152.59731738588394,47.60979320466738 152.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"160\" y=\"32\" width=\"44\" height=\"26\" rx=\"4\" class=\"boxr\"/><text x=\"182.0\" y=\"47.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">sample z</text><line x1=\"204\" y1=\"45\" x2=\"216\" y2=\"45\" class=\"ln\"/><polygon points=\"216,45 210.59731738588394,47.60979320466738 210.59731738588394,42.39020679533262\" class=\"ah\"/><rect x=\"218\" y=\"25\" width=\"46\" height=\"40\" rx=\"4\" class=\"boxg\"/><text x=\"241.0\" y=\"48.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">decoder</text><line x1=\"264\" y1=\"45\" x2=\"276\" y2=\"45\" class=\"ln\"/><polygon points=\"276,45 270.5973173858839,47.60979320466738 270.5973173858839,42.39020679533262\" class=\"ah\"/><rect x=\"278\" y=\"30\" width=\"36\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"296.0\" y=\"48.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">x-hat</text><text x=\"160\" y=\"92\" text-anchor=\"middle\" font-size=\"9\" class=\"\">loss = reconstruction - KL(q(z|x) || p(z))  (lower bound)</text><text x=\"160\" y=\"108\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">+ fast sampling, latent z   - blurry samples</text></svg>", "h": "VAE encodes a cloud (mu, sigma), not a point, so you can sample new z."}, {"id": "Q95", "t": "Optimization & NN", "q": "(a) Show two linear layers without activation equal one linear layer. Why are nonlinear activations necessary? (b) Why do deep sigmoid networks train slowly, and how does ReLU help?", "a": "(a) W2(W1 x + b1) + b2 = (W2 W1) x + (W2 b1 + b2) = W'x + b'. Any stack of linear layers collapses to one linear map, so depth adds nothing without nonlinearity.\n(b) Sigmoid's derivative is at most 0.25 and ~0 when saturated, so backprop multiplies many small numbers and gradients vanish. ReLU's derivative is 1 for positive inputs, so gradients pass through without shrinking.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 118\" role=\"img\"><rect x=\"10\" y=\"20\" width=\"40\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"30.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><line x1=\"50\" y1=\"35\" x2=\"70\" y2=\"35\" class=\"ln\"/><polygon points=\"70,35 64.59731738588394,37.60979320466738 64.59731738588394,32.39020679533262\" class=\"ah\"/><rect x=\"72\" y=\"20\" width=\"40\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"92.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">W1</text><line x1=\"112\" y1=\"35\" x2=\"132\" y2=\"35\" class=\"ln\"/><polygon points=\"132,35 126.59731738588394,37.60979320466738 126.59731738588394,32.39020679533262\" class=\"ah\"/><rect x=\"134\" y=\"20\" width=\"40\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"154.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">W2</text><line x1=\"174\" y1=\"35\" x2=\"194\" y2=\"35\" class=\"ln\"/><polygon points=\"194,35 188.59731738588394,37.60979320466738 188.59731738588394,32.39020679533262\" class=\"ah\"/><rect x=\"196\" y=\"20\" width=\"40\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"216.0\" y=\"38.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">out</text><text x=\"160\" y=\"72\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">no activation in between, so:</text><rect x=\"10\" y=\"82\" width=\"40\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"30.0\" y=\"100.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">x</text><line x1=\"50\" y1=\"97\" x2=\"70\" y2=\"97\" class=\"ln\"/><polygon points=\"70,97 64.59731738588394,99.60979320466738 64.59731738588394,94.39020679533262\" class=\"ah\"/><rect x=\"72\" y=\"82\" width=\"104\" height=\"30\" rx=\"4\" class=\"boxr\"/><text x=\"124.0\" y=\"100.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">W = W2 x W1</text><line x1=\"176\" y1=\"97\" x2=\"196\" y2=\"97\" class=\"ln\"/><polygon points=\"196,97 190.59731738588394,99.60979320466738 190.59731738588394,94.39020679533262\" class=\"ah\"/><rect x=\"198\" y=\"82\" width=\"40\" height=\"30\" rx=\"4\" class=\"box\"/><text x=\"218.0\" y=\"100.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">out</text><text x=\"282\" y=\"97\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">still linear</text></svg><svg class=\"dg\" viewBox=\"0 0 320 110\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>sigmoid</text><line x1=\"10\" y1=\"90\" x2=\"150\" y2=\"90\" class=\"ln\"/><path d=\"M10,86 C60,86 60,24 80,24 S100,24 150,24\" class=\"lna\"/><path d=\"M10,86 C60,86 70,24 150,24\" class=\"none\"/><rect x=\"10\" y=\"18\" width=\"35\" height=\"74\" rx=\"2\" class=\"boxr\"/><rect x=\"115\" y=\"18\" width=\"35\" height=\"74\" rx=\"2\" class=\"boxr\"/><text x=\"80\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">flat ends: grad ~ 0</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>ReLU</text><line x1=\"170\" y1=\"90\" x2=\"310\" y2=\"90\" class=\"ln\"/><polyline points=\"170,80 240,80 310,20\" class=\"lng\"/><text x=\"205\" y=\"72\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">x&lt;0: output 0</text><text x=\"240\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">dead if always below 0</text><text x=\"280\" y=\"72\" text-anchor=\"middle\" font-size=\"8\" class=\"good\">slope 1</text></svg>", "h": "Matrix times matrix is just one matrix. ReLU breaks the chain."}, {"id": "Q96", "t": "Training", "q": "(a) With dropout keep probability p, how do training and test differ? Describe inverted dropout. (b) How does SGD+momentum differ from plain SGD?", "a": "(a) Inverted dropout: during training keep each unit with probability p and divide survivors by p so the expected value is unchanged; at test time use all units with no scaling. (Standard dropout instead multiplies by p at test time.)\n(b) Momentum keeps a velocity v = rho v + grad (rho ~0.9) and steps along it. Oscillations cancel, consistent directions build up, so it moves faster through ravines and flat regions and past local minima.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 118\" role=\"img\"><ellipse cx=\"160\" cy=\"60\" rx=\"156.0\" ry=\"60\" class=\"ring\"/><ellipse cx=\"160\" cy=\"60\" rx=\"104.0\" ry=\"40\" class=\"ring\"/><ellipse cx=\"160\" cy=\"60\" rx=\"52.0\" ry=\"20\" class=\"ring\"/><circle cx=\"160\" cy=\"60\" r=\"4\" class=\"good\"/><polyline points=\"20,30 45,90 70,32 95,86 120,40 140,78\" class=\"lnr\"/><text x=\"60\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">SGD: zig-zag</text><polyline points=\"300,92 255,78 215,68 178,62\" class=\"lng\"/><text x=\"250\" y=\"112\" text-anchor=\"middle\" font-size=\"10\" class=\"good\">momentum: smooth</text></svg>", "h": "Momentum = a rolling ball. Zig-zags cancel, steady direction builds speed."}, {"id": "Q97", "t": "CNN layers", "q": "64x64 RGB image, conv 16 filters 3x3 s1 p1 (with bias), then 2x2 max pool s2, then FC to 10 classes. (a) Output shapes? (b) Params of conv and FC? (c) Where do most params live?", "a": "(a) Conv: 64x64x16. Pool: 32x32x16.\n(b) Conv: 16 x (3*3*3) + 16 = 448. FC: (32*32*16 = 16,384) x 10 + 10 = 163,850.\n(c) Fully connected layers dominate the parameter count because conv layers share weights. That's why modern CNNs use global average pooling before the classifier.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 100\" role=\"img\"><rect x=\"6\" y=\"40\" width=\"58\" height=\"28\" rx=\"4\" class=\"box\"/><text x=\"35.0\" y=\"57.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">64x64x3</text><line x1=\"64\" y1=\"54\" x2=\"69\" y2=\"54\" class=\"ln\"/><polygon points=\"69,54 63.59731738588394,56.60979320466738 63.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"69\" y=\"40\" width=\"58\" height=\"28\" rx=\"4\" class=\"box\"/><text x=\"98.0\" y=\"57.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">64x64x16</text><text x=\"67\" y=\"26\" text-anchor=\"middle\" font-size=\"8\" class=\"acc\">conv 448</text><line x1=\"127\" y1=\"54\" x2=\"132\" y2=\"54\" class=\"ln\"/><polygon points=\"132,54 126.59731738588394,56.60979320466738 126.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"132\" y=\"40\" width=\"58\" height=\"28\" rx=\"4\" class=\"box\"/><text x=\"161.0\" y=\"57.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">32x32x16</text><text x=\"130\" y=\"26\" text-anchor=\"middle\" font-size=\"8\" class=\"acc\">pool 0</text><line x1=\"190\" y1=\"54\" x2=\"195\" y2=\"54\" class=\"ln\"/><polygon points=\"195,54 189.59731738588394,56.60979320466738 189.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"195\" y=\"40\" width=\"58\" height=\"28\" rx=\"4\" class=\"box\"/><text x=\"224.0\" y=\"57.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">16,384</text><text x=\"193\" y=\"26\" text-anchor=\"middle\" font-size=\"8\" class=\"acc\">flatten</text><line x1=\"253\" y1=\"54\" x2=\"258\" y2=\"54\" class=\"ln\"/><polygon points=\"258,54 252.59731738588394,56.60979320466738 252.59731738588394,51.39020679533262\" class=\"ah\"/><rect x=\"258\" y=\"40\" width=\"58\" height=\"28\" rx=\"4\" class=\"boxr\"/><text x=\"287.0\" y=\"57.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">10</text><text x=\"256\" y=\"26\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">FC 163,850</text><text x=\"160\" y=\"94\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">conv shares weights; the FC layer holds the params</text></svg>", "h": "Spatial size shrinks, channels grow, FC layers eat the parameters."}, {"id": "Q98", "t": "Attention/Transformers", "q": "Self-attention with n = 10 tokens, d_k = d_v = 64. (a) Formula and shapes? (b) Why divide by sqrt(d_k)? (c) Why can Transformers run in parallel, and why does that need positional encodings?", "a": "(a) Attention(Q, K, V) = softmax(Q K^T / sqrt(d_k)) V. Weight matrix 10x10, output 10x64.\n(b) Dot products grow with dimension; large scores saturate softmax and give vanishing gradients. Scaling keeps them moderate.\n(c) Each output is computed from all positions at once with matrix multiplies (no step-by-step dependence like an RNN). Attention ignores order (permutation equivariant), so positional encodings add order information.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 134\" role=\"img\"><rect x=\"5\" y=\"40\" width=\"40\" height=\"40\" rx=\"4\" class=\"box\"/><text x=\"25.0\" y=\"57.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">X</text><text x=\"25.0\" y=\"68.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">N x D</text><line x1=\"45\" y1=\"60\" x2=\"70\" y2=\"22\" class=\"ln\"/><polygon points=\"70,22 69.21086230734612,27.94787875650075 64.85033065873954,25.07910793504906\" class=\"ah\"/><rect x=\"72\" y=\"10\" width=\"30\" height=\"24\" rx=\"4\" class=\"boxa\"/><text x=\"87.0\" y=\"25.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">Q</text><line x1=\"45\" y1=\"60\" x2=\"70\" y2=\"60\" class=\"ln\"/><polygon points=\"70,60 64.59731738588394,62.60979320466738 64.59731738588394,57.39020679533262\" class=\"ah\"/><rect x=\"72\" y=\"48\" width=\"30\" height=\"24\" rx=\"4\" class=\"boxg\"/><text x=\"87.0\" y=\"63.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">K</text><line x1=\"45\" y1=\"60\" x2=\"70\" y2=\"98\" class=\"ln\"/><polygon points=\"70,98 64.85033065873954,94.92089206495095 69.21086230734612,92.05212124349924\" class=\"ah\"/><rect x=\"72\" y=\"86\" width=\"30\" height=\"24\" rx=\"4\" class=\"boxr\"/><text x=\"87.0\" y=\"101.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">V</text><line x1=\"102\" y1=\"22\" x2=\"125\" y2=\"45\" class=\"ln\"/><polygon points=\"125,45 119.33432401444499,43.02512895947475 123.02512895947474,39.334324014444995\" class=\"ah\"/><line x1=\"102\" y1=\"60\" x2=\"125\" y2=\"52\" class=\"ln\"/><polygon points=\"125,52 120.75455447191214,56.2398339906226 119.03981268278251,51.30995134687492\" class=\"ah\"/><rect x=\"127\" y=\"32\" width=\"70\" height=\"34\" rx=\"4\" class=\"boxa\"/><text x=\"162.0\" y=\"46.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">QK^T / sqrt d</text><text x=\"162.0\" y=\"56.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">N x N</text><line x1=\"197\" y1=\"49\" x2=\"212\" y2=\"49\" class=\"ln\"/><polygon points=\"212,49 206.59731738588394,51.60979320466738 206.59731738588394,46.39020679533262\" class=\"ah\"/><rect x=\"214\" y=\"36\" width=\"46\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"237.0\" y=\"51.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">softmax</text><line x1=\"260\" y1=\"49\" x2=\"272\" y2=\"49\" class=\"ln\"/><polygon points=\"272,49 266.5973173858839,51.60979320466738 266.5973173858839,46.39020679533262\" class=\"ah\"/><line x1=\"102\" y1=\"98\" x2=\"280\" y2=\"64\" class=\"lnf\"/><polygon points=\"280,64 275.1829064907683,67.57709520747181 274.2036117222575,62.45019906644462\" class=\"ah\"/><rect x=\"274\" y=\"36\" width=\"42\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"295.0\" y=\"51.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">Y = AV</text><text x=\"160\" y=\"128\" text-anchor=\"middle\" font-size=\"9\" class=\"\">each token: query asks, key matches, value is what it gives</text></svg>", "h": "Q asks, K matches, V answers. Divide by sqrt(d) so softmax doesn't saturate."}, {"id": "Q99", "t": "Generative", "q": "(a) Write the GAN minimax objective. (b) Why train G to maximize log D(G(z)) instead of minimizing log(1 - D(G(z)))? (c) What is mode collapse?", "a": "(a) min_G max_D E_x[log D(x)] + E_z[log(1 - D(G(z)))]. D wants D(real) = 1 and D(fake) = 0; G wants D(fake) = 1.\n(b) Early on D easily rejects fakes (D(G(z)) ~ 0), where log(1 - D(G(z))) is flat, so G gets vanishing gradients. -log D(G(z)) gives strong gradients when G is bad.\n(c) The generator produces only a few kinds of output (a single mode) because they reliably fool D, so samples lack diversity.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 124\" role=\"img\"><rect x=\"5\" y=\"20\" width=\"30\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"20.0\" y=\"36.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">z</text><line x1=\"35\" y1=\"33\" x2=\"52\" y2=\"33\" class=\"ln\"/><polygon points=\"52,33 46.59731738588394,35.60979320466738 46.59731738588394,30.390206795332617\" class=\"ah\"/><rect x=\"54\" y=\"18\" width=\"52\" height=\"30\" rx=\"4\" class=\"boxa\"/><text x=\"80.0\" y=\"37.2\" text-anchor=\"middle\" font-size=\"12\" class=\"\">G</text><line x1=\"106\" y1=\"33\" x2=\"124\" y2=\"33\" class=\"ln\"/><polygon points=\"124,33 118.59731738588394,35.60979320466738 118.59731738588394,30.390206795332617\" class=\"ah\"/><rect x=\"126\" y=\"20\" width=\"44\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"148.0\" y=\"36.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">fake</text><rect x=\"126\" y=\"70\" width=\"44\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"148.0\" y=\"86.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">real</text><line x1=\"170\" y1=\"33\" x2=\"200\" y2=\"50\" class=\"ln\"/><polygon points=\"200,50 194.01288540244917,49.60698753735583 196.58620712279173,45.065831560280685\" class=\"ah\"/><line x1=\"170\" y1=\"83\" x2=\"200\" y2=\"64\" class=\"ln\"/><polygon points=\"200,64 196.8320859540476,69.09551965921608 194.03933538281152,64.68591349410647\" class=\"ah\"/><rect x=\"202\" y=\"40\" width=\"52\" height=\"34\" rx=\"4\" class=\"boxg\"/><text x=\"228.0\" y=\"61.2\" text-anchor=\"middle\" font-size=\"12\" class=\"\">D</text><line x1=\"254\" y1=\"57\" x2=\"268\" y2=\"57\" class=\"ln\"/><polygon points=\"268,57 262.5973173858839,59.60979320466738 262.5973173858839,54.39020679533262\" class=\"ah\"/><rect x=\"270\" y=\"44\" width=\"46\" height=\"26\" rx=\"4\" class=\"box\"/><text x=\"293.0\" y=\"54.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">real?</text><text x=\"293.0\" y=\"64.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">fake?</text><path d=\"M228,40 Q180,0 80,18\" class=\"lnr\"/><text x=\"150\" y=\"8\" text-anchor=\"middle\" font-size=\"8\" class=\"bad\">G wants D(fake) = 1</text><text x=\"228\" y=\"96\" text-anchor=\"middle\" font-size=\"8\" class=\"good\">D wants real=1, fake=0</text><text x=\"160\" y=\"118\" text-anchor=\"middle\" font-size=\"9\" class=\"\">min_G max_D E[log D(x)] + E[log(1 - D(G(z)))]</text></svg>", "h": "Counterfeiter (G) vs police (D). G improves by fooling D."}, {"id": "Q100", "t": "Detection & Segmentation", "q": "Regular convolution vs transposed convolution; why is transposed convolution useful in segmentation?", "a": "Regular (strided) convolution reduces spatial size. Transposed convolution increases spatial size using learnable filters (learnable upsampling). In segmentation it upsamples low-resolution feature maps back to full resolution for per-pixel predictions.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 134\" role=\"img\"><text x=\"70\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>2x2 input</text><rect x=\"40\" y=\"24\" width=\"26\" height=\"26\" rx=\"1\" class=\"boxa\"/><text x=\"53.0\" y=\"40.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">a</text><rect x=\"66\" y=\"24\" width=\"26\" height=\"26\" rx=\"1\" class=\"boxa\"/><text x=\"79.0\" y=\"40.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">b</text><rect x=\"40\" y=\"50\" width=\"26\" height=\"26\" rx=\"1\" class=\"boxa\"/><text x=\"53.0\" y=\"66.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">c</text><rect x=\"66\" y=\"50\" width=\"26\" height=\"26\" rx=\"1\" class=\"boxa\"/><text x=\"79.0\" y=\"66.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">d</text><line x1=\"100\" y1=\"50\" x2=\"140\" y2=\"50\" class=\"ln\"/><polygon points=\"140,50 134.59731738588394,52.60979320466738 134.59731738588394,47.39020679533262\" class=\"ah\"/><text x=\"120\" y=\"42\" text-anchor=\"middle\" font-size=\"8\" class=\"\">stride 2</text><text x=\"230\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>4x4 output</text><rect x=\"170\" y=\"24\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"192\" y=\"24\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"214\" y=\"24\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><rect x=\"236\" y=\"24\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><rect x=\"170\" y=\"46\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"192\" y=\"46\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxa\"/><rect x=\"214\" y=\"46\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><rect x=\"236\" y=\"46\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxg\"/><rect x=\"170\" y=\"68\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"192\" y=\"68\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"214\" y=\"68\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"236\" y=\"68\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"170\" y=\"90\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"192\" y=\"90\" width=\"22\" height=\"22\" rx=\"1\" class=\"boxr\"/><rect x=\"214\" y=\"90\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><rect x=\"236\" y=\"90\" width=\"22\" height=\"22\" rx=\"1\" class=\"box\"/><text x=\"160\" y=\"128\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">each input copies a learned filter onto the output</text></svg>", "h": "Transposed conv = learnable upsampling (the reverse of strided conv)."}, {"id": "Q101", "t": "Detection & Segmentation", "q": "Main advantage of dilated convolutions in semantic segmentation?", "a": "They put gaps between filter elements, enlarging the receptive field without adding parameters or reducing resolution, so the network captures wider context while keeping spatial detail.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 134\" role=\"img\"><text x=\"70\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>normal 3x3</text><rect x=\"20\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"38\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"56\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"74\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"92\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"20\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"38\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"56\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"74\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"92\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"20\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"38\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"56\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"74\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"92\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"20\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"38\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"56\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"74\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"92\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"20\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"38\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"56\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"74\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"92\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>dilated 3x3 (gap 1)</text><rect x=\"190\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"208\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"226\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"244\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"262\" y=\"22\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"190\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"208\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"226\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"244\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"262\" y=\"40\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"190\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"208\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"226\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"244\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"262\" y=\"58\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"190\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"208\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"226\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"244\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"262\" y=\"76\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"190\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"208\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"226\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><rect x=\"244\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"box\"/><rect x=\"262\" y=\"94\" width=\"18\" height=\"18\" rx=\"1\" class=\"boxa\"/><text x=\"160\" y=\"128\" text-anchor=\"middle\" font-size=\"9\" class=\"good\">same 9 weights, sees 5x5, keeps resolution</text></svg>", "h": "Dilated = spread-out filter. Bigger view, same parameters."}, {"id": "Q102", "t": "Detection & Segmentation", "q": "Purpose of skip connections in U-Net, and how do they improve segmentation?", "a": "They pass high-resolution encoder features directly to the matching decoder layers, combining fine spatial detail with the decoder's high-level semantic information, which gives sharper, more precise boundaries.", "f": "", "d": "<svg class=\"dg\" viewBox=\"0 0 320 130\" role=\"img\"><rect x=\"20\" y=\"20\" width=\"30\" height=\"70\" rx=\"2\" class=\"boxa\"/><rect x=\"60\" y=\"40\" width=\"30\" height=\"50\" rx=\"2\" class=\"boxa\"/><rect x=\"100\" y=\"60\" width=\"30\" height=\"30\" rx=\"2\" class=\"boxa\"/><rect x=\"140\" y=\"75\" width=\"30\" height=\"20\" rx=\"2\" class=\"boxr\"/><rect x=\"180\" y=\"60\" width=\"30\" height=\"30\" rx=\"2\" class=\"boxg\"/><rect x=\"220\" y=\"40\" width=\"30\" height=\"50\" rx=\"2\" class=\"boxg\"/><rect x=\"260\" y=\"20\" width=\"30\" height=\"70\" rx=\"2\" class=\"boxg\"/><line x1=\"50\" y1=\"30\" x2=\"260\" y2=\"30\" class=\"lna\"/><polygon points=\"260,30 254.59731738588394,32.60979320466738 254.59731738588394,27.390206795332617\" class=\"ah\"/><line x1=\"90\" y1=\"50\" x2=\"220\" y2=\"50\" class=\"lna\"/><polygon points=\"220,50 214.59731738588394,52.60979320466738 214.59731738588394,47.39020679533262\" class=\"ah\"/><line x1=\"130\" y1=\"70\" x2=\"180\" y2=\"70\" class=\"lna\"/><polygon points=\"180,70 174.59731738588394,72.60979320466738 174.59731738588394,67.39020679533262\" class=\"ah\"/><text x=\"160\" y=\"110\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">skips carry fine detail from encoder to decoder</text><text x=\"70\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">encoder</text><text x=\"250\" y=\"124\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">decoder</text></svg>", "h": "U shape: down, up, with bridges across for sharp edges."}, {"id": "Q103", "t": "Attention/Transformers", "q": "What is the bottleneck problem in a basic seq2seq RNN, and how does attention fix it?", "a": "The encoder squeezes the whole input into one fixed-size context vector, losing information for long inputs. Attention computes a new context vector at every decoder step: scores e_t,i = f_att(s_t-1, h_i), weights a = softmax(e), context c_t = sum a_t,i h_i. Each output can look at the relevant parts of the input.", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 134\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>seq2seq: bottleneck</text><rect x=\"10\" y=\"30\" width=\"24\" height=\"20\" rx=\"4\" class=\"boxa\"/><text x=\"22.0\" y=\"42.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">h1</text><rect x=\"40\" y=\"30\" width=\"24\" height=\"20\" rx=\"4\" class=\"boxa\"/><text x=\"52.0\" y=\"42.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">h2</text><rect x=\"70\" y=\"30\" width=\"24\" height=\"20\" rx=\"4\" class=\"boxa\"/><text x=\"82.0\" y=\"42.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">h3</text><line x1=\"94\" y1=\"40\" x2=\"108\" y2=\"40\" class=\"ln\"/><polygon points=\"108,40 102.59731738588394,42.60979320466738 102.59731738588394,37.39020679533262\" class=\"ah\"/><rect x=\"110\" y=\"28\" width=\"22\" height=\"24\" rx=\"4\" class=\"boxr\"/><text x=\"121.0\" y=\"43.5\" text-anchor=\"middle\" font-size=\"10\" class=\"\">c</text><line x1=\"132\" y1=\"40\" x2=\"144\" y2=\"40\" class=\"ln\"/><polygon points=\"144,40 138.59731738588394,42.60979320466738 138.59731738588394,37.39020679533262\" class=\"ah\"/><text x=\"80\" y=\"70\" text-anchor=\"middle\" font-size=\"9\" class=\"bad\">whole sentence in 1 vector</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>attention: new c each step</text><rect x=\"175\" y=\"30\" width=\"24\" height=\"20\" rx=\"4\" class=\"boxa\"/><text x=\"187.0\" y=\"42.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">h1</text><line x1=\"187\" y1=\"50\" x2=\"248\" y2=\"90\" class=\"lnf\"/><text x=\"187\" y=\"62\" text-anchor=\"middle\" font-size=\"7\" class=\"mut\">a=0.1</text><rect x=\"205\" y=\"30\" width=\"24\" height=\"20\" rx=\"4\" class=\"boxa\"/><text x=\"217.0\" y=\"42.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">h2</text><line x1=\"217\" y1=\"50\" x2=\"248\" y2=\"90\" class=\"lna\"/><text x=\"217\" y=\"62\" text-anchor=\"middle\" font-size=\"7\" class=\"acc\">a=0.8</text><rect x=\"235\" y=\"30\" width=\"24\" height=\"20\" rx=\"4\" class=\"boxa\"/><text x=\"247.0\" y=\"42.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">h3</text><line x1=\"247\" y1=\"50\" x2=\"248\" y2=\"90\" class=\"lnf\"/><text x=\"247\" y=\"62\" text-anchor=\"middle\" font-size=\"7\" class=\"mut\">a=0.1</text><rect x=\"232\" y=\"90\" width=\"34\" height=\"22\" rx=\"4\" class=\"boxg\"/><text x=\"249.0\" y=\"104.15\" text-anchor=\"middle\" font-size=\"9\" class=\"\">c_t</text><text x=\"240\" y=\"128\" text-anchor=\"middle\" font-size=\"9\" class=\"\">c_t = sum a_i x h_i</text><text x=\"80\" y=\"100\" text-anchor=\"middle\" font-size=\"9\" class=\"\">e = f_att(s, h)</text><text x=\"80\" y=\"112\" text-anchor=\"middle\" font-size=\"9\" class=\"\">a = softmax(e)</text></svg>", "h": "Attention: look back at all inputs every step, weighted by relevance."}, {"id": "Q104", "t": "Training", "q": "What two ideas does Adam combine, and why does it need bias correction?", "a": "Momentum (running average of gradients, first moment) + RMSProp (leaky running average of squared gradients, second moment, per-parameter learning rates). Both start at 0, so early estimates are biased toward 0; dividing by (1 - beta1^t) and (1 - beta2^t) corrects this.", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 98\" role=\"img\"><rect x=\"10\" y=\"30\" width=\"90\" height=\"40\" rx=\"4\" class=\"boxa\"/><text x=\"55.0\" y=\"47.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">momentum</text><text x=\"55.0\" y=\"58.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">(1st moment)</text><text x=\"115\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><rect x=\"130\" y=\"30\" width=\"90\" height=\"40\" rx=\"4\" class=\"boxg\"/><text x=\"175.0\" y=\"47.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">RMSProp</text><text x=\"175.0\" y=\"58.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">(2nd moment)</text><text x=\"232\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" class=\"\">+</text><rect x=\"244\" y=\"30\" width=\"70\" height=\"40\" rx=\"4\" class=\"box\"/><text x=\"279.0\" y=\"47.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">bias</text><text x=\"279.0\" y=\"58.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">correction</text><text x=\"160\" y=\"92\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">= Adam (good default)</text></svg>", "h": "Adam = Momentum + RMSProp + fix for starting at zero."}, {"id": "Q105", "t": "Basics/KNN/Linear", "q": "What is the curse of dimensionality, and why is KNN on raw pixels rarely used?", "a": "Points needed to cover the space grow exponentially with dimension (4, 4^2, 4^3...). 32x32 binary images alone have 2^1024 ~ 10^308 possibilities. Pixel distances also aren't meaningful (shifted, tinted, or boxed images can have the same L2 distance), and KNN is slow at test time (O(N)).", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 132\" role=\"img\"><text x=\"40\" y=\"108\" text-anchor=\"middle\" font-size=\"10\" class=\"\">1D: 4</text><text x=\"140\" y=\"108\" text-anchor=\"middle\" font-size=\"10\" class=\"\">2D: 4^2 = 16</text><text x=\"250\" y=\"108\" text-anchor=\"middle\" font-size=\"10\" class=\"\">3D: 4^3 = 64</text><circle cx=\"10\" cy=\"50\" r=\"4\" class=\"acc\"/> <circle cx=\"30\" cy=\"50\" r=\"4\" class=\"acc\"/> <circle cx=\"50\" cy=\"50\" r=\"4\" class=\"acc\"/> <circle cx=\"70\" cy=\"50\" r=\"4\" class=\"acc\"/><rect x=\"110\" y=\"20\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"125\" y=\"20\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"140\" y=\"20\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"155\" y=\"20\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"110\" y=\"35\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"125\" y=\"35\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"140\" y=\"35\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"155\" y=\"35\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"110\" y=\"50\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"125\" y=\"50\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"140\" y=\"50\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"155\" y=\"50\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"110\" y=\"65\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"125\" y=\"65\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"140\" y=\"65\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><rect x=\"155\" y=\"65\" width=\"15\" height=\"15\" rx=\"1\" class=\"boxa\"/><circle cx=\"117\" cy=\"27\" r=\"2.5\" class=\"acc\"/><circle cx=\"132\" cy=\"27\" r=\"2.5\" class=\"acc\"/><circle cx=\"147\" cy=\"27\" r=\"2.5\" class=\"acc\"/><circle cx=\"162\" cy=\"27\" r=\"2.5\" class=\"acc\"/><circle cx=\"117\" cy=\"42\" r=\"2.5\" class=\"acc\"/><circle cx=\"132\" cy=\"42\" r=\"2.5\" class=\"acc\"/><circle cx=\"147\" cy=\"42\" r=\"2.5\" class=\"acc\"/><circle cx=\"162\" cy=\"42\" r=\"2.5\" class=\"acc\"/><circle cx=\"117\" cy=\"57\" r=\"2.5\" class=\"acc\"/><circle cx=\"132\" cy=\"57\" r=\"2.5\" class=\"acc\"/><circle cx=\"147\" cy=\"57\" r=\"2.5\" class=\"acc\"/><circle cx=\"162\" cy=\"57\" r=\"2.5\" class=\"acc\"/><circle cx=\"117\" cy=\"72\" r=\"2.5\" class=\"acc\"/><circle cx=\"132\" cy=\"72\" r=\"2.5\" class=\"acc\"/><circle cx=\"147\" cy=\"72\" r=\"2.5\" class=\"acc\"/><circle cx=\"162\" cy=\"72\" r=\"2.5\" class=\"acc\"/><polygon points=\"220,40 260,25 300,40 260,55\" class=\"boxa\"/><polygon points=\"220,40 260,55 260,95 220,80\" class=\"boxa\"/><polygon points=\"260,55 300,40 300,80 260,95\" class=\"boxa\"/><text x=\"260\" y=\"72\" text-anchor=\"middle\" font-size=\"9\" class=\"\">64 pts</text><text x=\"160\" y=\"126\" text-anchor=\"middle\" font-size=\"10\" class=\"bad\">points needed grow exponentially with dimension</text></svg>", "h": "Every extra dimension multiplies the data you need. Images have thousands of dimensions."}, {"id": "Q106", "t": "CNN layers", "q": "What does a 1x1 convolution do? Input 64x56x56, 32 filters 1x1: output shape and params?", "a": "A 64-dimensional dot product at each position: mixes channels without changing spatial size, used to cheaply reduce channels (GoogLeNet bottleneck). Output 32x56x56. Params = 32 x (64 + 1) = 2,080.", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 112\" role=\"img\"><rect x=\"20\" y=\"20\" width=\"50\" height=\"50\" rx=\"2\" class=\"box\"/><rect x=\"26\" y=\"26\" width=\"50\" height=\"50\" rx=\"2\" class=\"boxa\"/><rect x=\"32\" y=\"32\" width=\"50\" height=\"50\" rx=\"2\" class=\"box\"/><rect x=\"38\" y=\"38\" width=\"50\" height=\"50\" rx=\"2\" class=\"boxa\"/><rect x=\"44\" y=\"44\" width=\"50\" height=\"50\" rx=\"2\" class=\"box\"/><rect x=\"50\" y=\"50\" width=\"50\" height=\"50\" rx=\"2\" class=\"boxa\"/><text x=\"70\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">64 channels</text><circle cx=\"70\" cy=\"70\" r=\"4\" class=\"bad\"/><line x1=\"110\" y1=\"60\" x2=\"150\" y2=\"60\" class=\"ln\"/><polygon points=\"150,60 144.59731738588394,62.60979320466738 144.59731738588394,57.39020679533262\" class=\"ah\"/><text x=\"130\" y=\"52\" text-anchor=\"middle\" font-size=\"9\" class=\"\">1x1</text><rect x=\"160\" y=\"30\" width=\"50\" height=\"50\" rx=\"2\" class=\"box\"/><rect x=\"166\" y=\"36\" width=\"50\" height=\"50\" rx=\"2\" class=\"boxg\"/><rect x=\"172\" y=\"42\" width=\"50\" height=\"50\" rx=\"2\" class=\"box\"/><text x=\"200\" y=\"104\" text-anchor=\"middle\" font-size=\"9\" class=\"mut\">32 channels</text><text x=\"275\" y=\"48\" text-anchor=\"middle\" font-size=\"9\" class=\"\">mixes channels</text><text x=\"275\" y=\"62\" text-anchor=\"middle\" font-size=\"9\" class=\"\">same H x W</text><text x=\"275\" y=\"76\" text-anchor=\"middle\" font-size=\"9\" class=\"acc\">params 32x(64+1)</text></svg>", "h": "1x1 conv = a dot product down the channels at each pixel. Cheap channel shrinker."}, {"id": "Q107", "t": "Architectures & BatchNorm", "q": "How does MobileNet's depthwise separable convolution reduce cost vs a standard 3x3 conv with C channels?", "a": "Depthwise 3x3 (groups = C): 9C x HW. Pointwise 1x1: C^2 x HW. Standard: 9C^2 x HW. Speedup = 9C^2 / (9C + C^2) = 9C/(9 + C), approaching 9x (about 7.9x for C = 64).", "f": "added", "d": "<svg class=\"dg\" viewBox=\"0 0 320 96\" role=\"img\"><text x=\"80\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>standard 3x3: 9C^2 HW</text><rect x=\"20\" y=\"24\" width=\"120\" height=\"40\" rx=\"4\" class=\"boxr\"/><text x=\"80.0\" y=\"41.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">every filter sees</text><text x=\"80.0\" y=\"52.65\" text-anchor=\"middle\" font-size=\"9\" class=\"\">all C channels</text><text x=\"240\" y=\"14\" text-anchor=\"middle\" font-size=\"10\" class=\"\" font-weight=600>depthwise separable</text><rect x=\"180\" y=\"24\" width=\"60\" height=\"40\" rx=\"4\" class=\"boxa\"/><text x=\"210.0\" y=\"36.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">3x3 per</text><text x=\"210.0\" y=\"46.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">channel</text><text x=\"210.0\" y=\"56.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">9C HW</text><line x1=\"240\" y1=\"44\" x2=\"252\" y2=\"44\" class=\"ln\"/><polygon points=\"252,44 246.59731738588394,46.60979320466738 246.59731738588394,41.39020679533262\" class=\"ah\"/><rect x=\"252\" y=\"24\" width=\"62\" height=\"40\" rx=\"4\" class=\"boxg\"/><text x=\"283.0\" y=\"41.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">1x1 mix</text><text x=\"283.0\" y=\"51.8\" text-anchor=\"middle\" font-size=\"8\" class=\"\">C^2 HW</text><text x=\"160\" y=\"90\" text-anchor=\"middle\" font-size=\"10\" class=\"acc\">speedup = 9C / (9 + C), about 9x</text></svg>", "h": "Split the job: filter each channel alone, then mix channels with 1x1."}], "topics": ["Basics/KNN/Linear", "Loss", "Optimization & NN", "Backprop", "CNN layers", "Architectures & BatchNorm", "Hardware/PyTorch", "Training", "RNN/LSTM", "Attention/Transformers", "Generative", "Detection & Segmentation"]};
(function(){
 var KEY="dl-flashcards-v1",prog={};
 try{prog=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){prog={}}
 function save(){try{localStorage.setItem(KEY,JSON.stringify(prog))}catch(e){}}
 var topic="All",onlyAgain=false,listMode=false,order=DATA.cards.map(function(_,i){return i}),deck=[],i=0,flipped=false;
 var $=function(id){return document.getElementById(id)};
 var chips=$("chips");
 ["All"].concat(DATA.topics).forEach(function(t){var b=document.createElement("button");b.className="chip";b.type="button";b.textContent=t;b.setAttribute("aria-pressed",t==="All");
  b.onclick=function(){topic=t;[].forEach.call(chips.children,function(c){c.setAttribute("aria-pressed",c===b)});build(true)};chips.appendChild(b)});
 function build(resetPos){deck=order.filter(function(k){var c=DATA.cards[k];return (topic==="All"||c.t===topic)&&(!onlyAgain||prog[c.id]==="again")});if(resetPos||i>=deck.length)i=0;flipped=false;render()}
 function stats(){var g=0,a=0;DATA.cards.forEach(function(c){if(prog[c.id]==="got")g++;else if(prog[c.id]==="again")a++});
  $("stats").innerHTML="<span><b>"+DATA.cards.length+"</b> cards</span><span><b>"+g+"</b> got it</span><span><b>"+a+"</b> again</span><span><b>"+(DATA.cards.length-g-a)+"</b> not seen</span><span>showing <b>"+deck.length+"</b></span>"}
 function render(){stats();
  $("cardView").hidden=listMode||!deck.length;$("empty").hidden=!!deck.length;$("list").hidden=!listMode||!deck.length;
  if(listMode){var L=$("list");L.innerHTML="";deck.forEach(function(k){var c=DATA.cards[k],d=document.createElement("div");d.className="item";
    d.innerHTML='<div class="meta"><span><span class="tag"></span> · <span class="n"></span></span></div><div class="q"></div><div class="a"></div>'+vizHTML(c);
    d.querySelector(".tag").textContent=c.t;d.querySelector(".n").textContent=c.id;d.querySelector(".q").textContent=c.q;d.querySelector(".a").textContent=c.a;L.appendChild(d)});return}
  if(!deck.length)return;var c=DATA.cards[deck[i]];
  $("tag").textContent=c.t;$("num").textContent=c.id;
  var st=prog[c.id];$("pos").innerHTML=(i+1)+" / "+deck.length+(st?' <span class="state '+st+'">'+(st==="got"?"got it":"again")+"</span>":"");
  $("q").textContent=c.q;$("a").textContent=c.a;$("a").hidden=!flipped;var vz=vizHTML(c);$("viz").innerHTML=vz?vz.replace(/^<div class="viz">|<\/div>$/g,""):"";$("viz").hidden=!flipped||!vz;$("hint").hidden=flipped;$("card").classList.toggle("flipped",flipped)}
 function vizHTML(c){if(!c.d&&!c.h)return "";var o=c.d||"";if(c.h){var e=document.createElement("div");e.textContent=c.h;o+='<div class="hook"><b>Memory hook:</b> '+e.innerHTML+'</div>'}return '<div class="viz">'+o+'</div>'}
 function flip(){flipped=!flipped;render()}
 function go(d){if(!deck.length)return;i=(i+d+deck.length)%deck.length;flipped=false;render()}
 function mark(v){if(!deck.length)return;prog[DATA.cards[deck[i]].id]=v;save();if(onlyAgain&&v==="got"){deck.splice(i,1);if(i>=deck.length)i=0;flipped=false;render()}else go(1)}
 $("card").onclick=flip;$("prev").onclick=function(){go(-1)};$("next").onclick=function(){go(1)};
 $("got").onclick=function(){mark("got")};$("again").onclick=function(){mark("again")};
 $("shuffle").onclick=function(){for(var k=order.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1)),t=order[k];order[k]=order[j];order[j]=t}build(true)};
 $("onlyAgain").onclick=function(){onlyAgain=!onlyAgain;this.setAttribute("aria-pressed",onlyAgain);build(true)};
 $("listView").onclick=function(){listMode=!listMode;this.setAttribute("aria-pressed",listMode);render()};
 $("reset").onclick=function(){prog={};save();build(true)};
 document.addEventListener("keydown",function(e){if(listMode)return;var t=e.target.tagName;if(t==="BUTTON"&&(e.key===" "||e.key==="Enter"))return;
  if(e.key===" "){e.preventDefault();flip()}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)});
 build(true);
})();
</script>
